<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three Engine — Game</title>
    <style>
      /* The loading screen's colours come from these three variables, and
         Build Settings overrides them by injecting a `<style id="build-theme">`
         block at export (see src/editor/build/playerHtml.js). They live here
         rather than in the shipped scene because the loading screen is on
         screen *before* scene.json has been fetched — reading them from the
         scene would flash the defaults first. */
      :root {
        --loading-bg: #0d0e11;
        --loading-accent: #0a84ff;
        --loading-fg: 255, 255, 255;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #game { width: 100%; height: 100%; display: block; }

      /* Loading screen. Shown on boot and again for every runtime scene load
         (see createLoadingScreen in src/player/main.js). */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--loading-bg);
        color: rgba(var(--loading-fg), 0.72);
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
        transition: opacity 220ms cubic-bezier(0.2, 0, 0, 1);
      }
      #loading.is-hidden { opacity: 0; pointer-events: none; }
      .loading-bar {
        width: min(280px, 55vw);
        height: 3px;
        border-radius: 2px;
        background: rgba(var(--loading-fg), 0.1);
        overflow: hidden;
      }
      .loading-bar-fill {
        width: 0%;
        height: 100%;
        border-radius: 2px;
        background: var(--loading-accent);
        transition: width 160ms cubic-bezier(0.2, 0, 0, 1);
      }
      .loading-logo {
        max-width: min(340px, 62vw);
        max-height: 32vh;
        object-fit: contain;
      }
      .loading-title {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.05em;
        color: rgba(var(--loading-fg), 0.92);
      }
      @media (prefers-reduced-motion: reduce) {
        #loading, .loading-bar-fill { transition: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="loading">
      <!-- The exporter replaces everything between these markers to add a logo
           and the game title. Keep them in sync with build/playerHtml.js. -->
      <!--build:loading-->
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
      <div class="loading-label">Loading</div>
      <!--/build:loading-->
    </div>
    <script type="module" src="/src/player/main.js"></script>
  </body>
</html>
