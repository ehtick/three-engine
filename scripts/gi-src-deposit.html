<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SRC deposit gate — createSrcDepositFrame vs traceAndDeposit</title>
    <style>html,body{margin:0;background:#111;color:#ddd;font:13px monospace}canvas{display:none}</style>
  </head>
  <body>
    <canvas id="view" width="16" height="16"></canvas>
    <pre id="log"></pre>
    <script type="module">
      // ══ THE PHASE-2 UNIT-3 GATE: THE SPLIT SCATTER, WITHOUT THE ENGINE ═══
      //
      // Same isolation as its two siblings — own renderer, synthetic gbuffer, no
      // engine, no scene, no occupancy field. Which raises the obvious question:
      // with no field, what does the deposit TRACE?
      //
      // ══ A SYNTHETIC TRACE KEYED ON THE RAY INDEX ════════════════════════
      //
      // Not on geometry, and not on the direction. `rayDirection` runs through
      // `decodeDir`'s sin/cos, which are NOT bit-identical between WGSL and JS —
      // so anything derived from `dir` disagrees in the last ulp, and a hit
      // distance a hair either side of an interval boundary would land in a
      // different cascade on the two sides. That is a real disagreement about
      // nothing, and it would make an exact diff impossible forever.
      //
      // The ray INDEX is a u32 both sides agree on exactly. So the trace is
      // `t = hash(n) · T_SPAN` — deterministic, bit-exact, and independent of
      // the pixel's reach ON PURPOSE. A `t` scaled by reach would need the
      // mirror's trace closure to know which pixel it was called for, which
      // `traceAndDeposit` does not tell it — and the gate would then have to
      // re-implement the very loop it exists to diff against. A constant span
      // puts hits across every cascade for near pixels and escapes (the
      // deposit-into-every-cascade case) for the far ones.
      //
      // The shading is the same trick in fixed point: radiance is a 12-bit
      // integer times `Lmax/65536`, with `Lmax = 16` a power of two, so
      // `round(L/Lmax · 2^16)` recovers that integer EXACTLY on both sides. The
      // whole RGB accumulator is then checkable as integer arithmetic — which
      // matters, because in the engine `shadeHit` is still null until Phase 5
      // and nothing else would ever exercise it.
      //
      // ══ THE MIRROR IS FED THE GPU'S OWN RAY ASSIGNMENT ══════════════════
      //
      // `assignRays` and the GPU allocate the same partition in different order
      // (proven by `test:gi-src-rays`), so a pixel's ray indices differ between
      // them — and the synthetic trace is keyed on exactly those indices. The
      // mirror therefore runs against the GPU's `pixelRayBase` rather than its
      // own. That is the right decomposition, not a shortcut: unit 2's gate owns
      // the partition, and this one owns what happens to the rays in it.
      //
      // ══ THE ARMS ════════════════════════════════════════════════════════
      //
      //   totals    deposits, hits and escapes vs the mirror. Exact.
      //   probes    per-probe count / sumT / sumRGB, matched by KEY and summed
      //             over bins. Bin-INDEPENDENT, so it is exact even though the
      //             direction quantization is not — this is the arm that checks
      //             the split rule, the ancestor-chain walk and the fixed point.
      //   bins      the same totals per (probe, bin). Direction-dependent, so
      //             near-boundary ties are counted and bounded rather than
      //             asserted to zero.
      //   split     nothing is deposited ABOVE the owning cascade, and every
      //             cascade below it got T = 1 with no radiance. The rule the
      //             companion guide gets wrong, checked directly.
      //   unknown   zero-count bins resolve to UNKNOWN (T = -1), not to zero.
      //   overflow  measured headroom of the F = 16 accumulator against 2^32.
      //   blocks    one bin block per live probe, distinct and in range. Two
      //             probes sharing a block passes every arm above.
      //   starved   a pool too small to serve every probe: the failure is an
      //             ABSENCE, and the probes that did claim still match the
      //             mirror exactly (which is what rules out a block-0 fallback).
      //   retire    after every probe dies, each cascade's free stack is a
      //             PERMUTATION of its blocks — one assertion for both a leak
      //             and a double-free.
      //
      // Run: node scripts/run-gi-src-deposit-test.mjs
      const out = document.querySelector("#log");
      const say = (line) => { out.textContent += line + "\n"; };
      let failures = 0;
      const check = (label, ok, detail = "") => {
        say(`  ${ok ? "PASS" : "FAIL"} ${label}${detail ? ` — ${detail}` : ""}`);
        if (!ok) failures++;
      };
      const fail = (error) => {
        console.error("SRC-DEPOSIT FAIL", error?.stack ?? error?.message ?? String(error));
        globalThis.__SRC_DEPOSIT_RESULT__ = {
          pass: false, error: error?.message ?? String(error), text: out.textContent,
        };
      };
      globalThis.addEventListener("error", (event) => fail(event.error ?? event.message));
      globalThis.addEventListener("unhandledrejection", (event) => fail(event.reason));

      try {
        const THREE = await import("three/webgpu");
        const TSL = await import("three/tsl");
        const cfgMod = await import("/src/modules/gi/srcConfig.js");
        const refMath = await import("/src/modules/gi/srcMath.js");
        const ref = await import("/src/modules/gi/srcRef.js");
        const M = await import("/src/modules/gi/srcMathTsl.js");
        const P = await import("/src/modules/gi/srcProbes.js");
        const R = await import("/src/modules/gi/srcRays.js");
        const D = await import("/src/modules/gi/srcDeposit.js");

        const { float, instancedArray, select, uint, uniform, vec3 } = TSL;

        const renderer = new THREE.WebGPURenderer({ canvas: document.querySelector("#view") });
        await renderer.init();
        const device = renderer.backend.device;
        const validationErrors = [];
        device.addEventListener?.("uncapturederror", (event) => {
          validationErrors.push(event.error?.message ?? String(event.error));
          console.error("WebGPU validation error:", validationErrors.at(-1));
        });

        const rng = (() => {
          let s = 0x9e3779b9 >>> 0;
          return () => {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        })();

        const S0 = 0.5;
        const CAM = [1.25, 1.6, -0.75];
        const ANCHOR = [0.37, -1.21, 2.93];
        const RAYS_PER_PIXEL = 2;
        // A POWER OF TWO on purpose: `Lmax/65536` is then exact in f32, so a
        // 12-bit synthetic radiance round-trips through the fixed point with no
        // rounding at all and the RGB arms are integer comparisons.
        const LMAX = 16;
        // Hit distances land uniformly in [0, T_SPAN). Cascade 0's interval ends
        // at 0.8 m and the ladder reaches 68 m at LOD 0, so 120 puts deposits in
        // every cascade for the room pixels and escapes for the far shells.
        const T_SPAN = 120;
        const SHADE_SALT = 0x9e3779b9;

        // Smaller than the population gate's set: this one allocates bin
        // accumulators for every probe SLOT, and the c0 capacity drives that.
        const C0_PROBES = 4096;

        const pixels = [];
        const addPixel = (p, n) => pixels.push({ position: p, normal: n });
        for (let i = 0; i < 1400; i++) {
          const u = (rng() - 0.5) * 16;
          const v = (rng() - 0.5) * 16;
          const face = Math.floor(rng() * 5);
          if (face === 0) addPixel([u, -1, v], [0, 1, 0]);
          else if (face === 1) addPixel([u, 5, v], [0, -1, 0]);
          else if (face === 2) addPixel([-8, v * 0.4 + 1, u], [1, 0, 0]);
          else if (face === 3) addPixel([8, v * 0.4 + 1, u], [-1, 0, 0]);
          else addPixel([u, v * 0.4 + 1, 8], [0, 0, -1]);
        }
        for (let lod = 0; lod < 7; lod++) {
          // `lodRadius` is the LAW'S OWN INVERSE, not `S0·2^lod` spelled out
          // here: with the reach constant in place, an inline copy would put
          // every one of these shells inside LOD 0 and the gate would keep
          // passing while testing a single ring.
          const r = cfgMod.lodRadius(lod, S0) * 1.35;
          for (let k = 0; k < 120; k++) {
            const axis = Math.floor(rng() * 3);
            const sign = rng() < 0.5 ? -1 : 1;
            const a = (rng() * 2 - 1) * r;
            const b = (rng() * 2 - 1) * r;
            const p = [0, 0, 0];
            p[axis] = sign * r;
            p[(axis + 1) % 3] = a;
            p[(axis + 2) % 3] = b;
            addPixel([p[0] + CAM[0], p[1] + CAM[1], p[2] + CAM[2]], [0, 1, 0]);
          }
        }
        const PIXELS = pixels.length;
        const valid = new Uint8Array(PIXELS).fill(1);
        for (let i = 0; i < PIXELS; i += 17) valid[i] = 0;

        const q32 = new Float32Array(1);
        const f32 = (v) => { q32[0] = v; return q32[0]; };
        for (const px of pixels) {
          px.position = px.position.map(f32);
          px.normal = px.normal.map(f32);
        }

        const attrs = new Float32Array(PIXELS * 8);
        for (let i = 0; i < PIXELS; i++) {
          attrs[i * 8] = pixels[i].position[0];
          attrs[i * 8 + 1] = pixels[i].position[1];
          attrs[i * 8 + 2] = pixels[i].position[2];
          attrs[i * 8 + 3] = valid[i];
          attrs[i * 8 + 4] = pixels[i].normal[0];
          attrs[i * 8 + 5] = pixels[i].normal[1];
          attrs[i * 8 + 6] = pixels[i].normal[2];
        }
        const posBuf = instancedArray(attrs.slice(), "vec4");   // stride 4: [pos,valid][nrm,0]
        const readPixel = (i) => {
          const t = posBuf.element(i.mul(2)).toVar();
          return { position: t.xyz, valid: t.w.greaterThan(0.5) };
        };
        const readNormal = (i) => posBuf.element(i.mul(2).add(1)).xyz;

        // ── the synthetic trace and shading, both keyed on the ray index ──
        const HASH_TO_UNIT = 1 / 16777216;
        const synthTrace = (o, d, tMax, n) => {
          // `hash >> 8` is a 24-bit integer, exactly representable in f32, and
          // 2^-24 is exact — so this conversion is bit-identical to the JS twin.
          const h = M.hashKey(n).toVar();
          const t = float(h.shiftRight(uint(8))).mul(HASH_TO_UNIT * T_SPAN).toVar();
          // A real marcher stops at `tMax`, so this one does too: past the last
          // cascade boundary the ray is a MISS, and the mirror reaches the same
          // verdict from the other direction (`splitCascade` returns
          // `bounds.length` for a `d` past every bound). Same outcome, and the
          // totals arm is what proves the two agree about how often.
          const isHit = t.lessThanEqual(float(tMax)).toVar();
          return {
            hit: select(isHit, float(1), float(0)),
            t: select(isHit, t, float(-1)),
            position: vec3(0),
            exactPosition: vec3(0),
            normal: vec3(0, 1, 0),
            dynObj: null,
          };
        };
        const shadeHit = (r, d, n) => {
          const h = M.hashKey(n.add(uint(SHADE_SALT))).toVar();
          const k = LMAX / 65536;
          return vec3(
            float(h.bitAnd(uint(4095))).mul(k),
            float(h.shiftRight(uint(12)).bitAnd(uint(4095))).mul(k),
            float(h.shiftRight(uint(24)).bitAnd(uint(255))).mul(k),
          );
        };
        // The JS twin, and the ONE unit choice worth stating: it returns
        // radiance in FIXED-POINT UNITS (the raw 12-bit integers), not in
        // radiance units. The GPU stores `round(L/Lmax · 2^16)`, and with
        // `L = q · Lmax/65536` that is exactly `q` — so the mirror accumulating
        // `q` directly makes every RGB comparison below integer arithmetic with
        // no tolerance anywhere.
        const jsSceneTrace = (origin, dir, n) => {
          // STOPPING AT THE REACH IS THE TRACE'S JOB, and it has to be done here
          // rather than left to `splitDeposits`. Both produce the same DEPOSITS
          // for a t past the last boundary — `splitCascade` returns
          // `bounds.length`, which is the escape case — but they disagree about
          // whether the ray HIT, and the first version of this file returned a
          // bare positive t and had the mirror report 4,216 hits against the
          // GPU's 4,118 while every deposit matched. The reach is recoverable
          // from the origin (it is the pixel's own LOD), so the closure computes
          // it exactly as the kernel's `tMax` does.
          const cheb = cfgMod.chebyshev(
            origin[0], origin[1], origin[2], CAM[0], CAM[1], CAM[2],
          );
          const lod = Math.floor(cfgMod.lodAtDistance(cheb, S0, cfgMod.MAX_LODS));
          const bounds = cfgMod.intervalBoundaries(lod, S0, cfgMod.CASCADE_COUNT);
          const reach = bounds[bounds.length - 1];
          const t = f32((refMath.hashKey(n >>> 0) >>> 8) * (HASH_TO_UNIT * T_SPAN));
          const h = refMath.hashKey((n + SHADE_SALT) >>> 0) >>> 0;
          return {
            t: t <= reach ? t : -1,
            radiance: [h & 4095, (h >>> 12) & 4095, (h >>> 24) & 255],
          };
        };

        // ── the three frames ─────────────────────────────────────────────
        // ══ AN EXPLICIT BLOCK POOL, AND WHY THIS SET NEEDS ONE ══════════════
        //
        // `BIN_BUDGET`'s default splits bins EQUALLY across cascades, which is
        // right exactly when probe counts fall 4× per cascade — the surface-
        // manifold argument, and what a contiguous surface really does.
        //
        // THIS PIXEL SET DOES NOT, ON PURPOSE. Its LOD shells are 120 points
        // scattered over a box whose area is thousands of cells wide at EVERY
        // cascade, so nothing merges and the counts come out nearly flat:
        // measured 1831 / 1405 / 997 / 825. Under the default pool that starved
        // c2 and c3 (683 and 170 blocks) and 969 probes went without bins.
        //
        // That is a fact about scattered points, not about scenes, and the
        // right response is to give the gate a pool shaped like its own set
        // rather than to reshape the engine's budget around an adversarial one.
        // The real check is `smoke:gi-gpu ?src=1` on a real gbuffer, and the
        // `NOBLOCK` counter is what reports it there.
        const store = P.createSrcProbeStore({
          c0Probes: C0_PROBES,
          cascadeCount: cfgMod.CASCADE_COUNT,
          blockCapacity: [2048, 2048, 1024, 1024],
        });
        const cameraU = uniform(new THREE.Vector3(...CAM));
        const anchorU = uniform(new THREE.Vector3(...ANCHOR));
        const lmaxU = uniform(LMAX);

        const frame = P.createSrcProbeFrame(store, {
          spacing0: S0, camera: vec3(cameraU), anchor: vec3(anchorU),
          pixelCount: PIXELS, readPixel,
        });
        const rayStore = R.createSrcRayStore(store, { pixelCount: PIXELS });
        const rayFrame = R.createSrcRayFrame(store, rayStore, {
          pixelProbe: frame.pixelProbe, raysPerPixel: RAYS_PER_PIXEL,
        });
        const bins = D.createSrcBinStore(store, { w0: cfgMod.W0 });
        const deposit = D.createSrcDepositFrame(store, bins, {
          pixelProbe: frame.pixelProbe,
          pixelRayBase: rayStore.pixelRayBase,
          pixelCount: PIXELS,
          raysPerPixel: RAYS_PER_PIXEL,
          trace: synthTrace,
          shadeHit,
          readPixel, readNormal,
          camera: vec3(cameraU),
          spacing0: S0,
          lmax: lmaxU,
          jitterX: 0, jitterY: 0,
        });

        say(`pixels ${PIXELS} (${PIXELS - valid.reduce((a, b) => a + b, 0)} invalid)  ` +
          `raysPerPixel ${RAYS_PER_PIXEL}  Lmax ${LMAX}  F ${D.DEPOSIT_F}`);
        say(`bins ${(bins.binTotal / 1e6).toFixed(3)}M over ` +
          `${store.cascades.map((c) => c.blockCapacity).join("/")} blocks ` +
          `(${store.cascades.map((c) => c.probeCapacity).join("/")} probe slots)  ` +
          `${(bins.bytes / 1048576).toFixed(1)}MB  dispatches ` +
          `${frame.passes.length}+${rayFrame.passes.length}+${deposit.passes.length}`);
        say("");

        for (const pass of frame.passes) await renderer.computeAsync(pass);
        for (const pass of rayFrame.passes) await renderer.computeAsync(pass);
        for (const pass of deposit.passes) await renderer.computeAsync(pass);

        const [table, pixelProbe, pixelRayBase, scratch, payloadRaw, stats] = await Promise.all([
          renderer.getArrayBufferAsync(store.probeTable.value).then((b) => new Uint32Array(b)),
          renderer.getArrayBufferAsync(frame.pixelProbe.value).then((b) => new Uint32Array(b)),
          renderer.getArrayBufferAsync(rayStore.pixelRayBase.value).then((b) => new Uint32Array(b)),
          renderer.getArrayBufferAsync(bins.scratch.value).then((b) => new Uint32Array(b)),
          renderer.getArrayBufferAsync(bins.payload.value).then((b) => new Float32Array(b)),
          deposit.readStats(renderer),
        ]);

        // ══ ARM 0b: COMPACTION (§12.44) ══════════════════════════════════
        say("── COMPACT: the worklist [E] IS the classic [E], bit for bit ──");
        // Same store, same bins, same UNTOUCHED transport frame — the ray
        // partition is scheduler-dependent, so re-running [D] would change
        // the synthetic trace's keys and the diff would measure the shuffle,
        // not the mapping. Both deposits clear at their start (keep = 0), so
        // each readback holds exactly its own frame. Integer atomics make
        // the sums order-independent: the compacted pass must reproduce the
        // classic accumulators EXACTLY, not approximately.
        const depositCompact = D.createSrcDepositFrame(store, bins, {
          pixelProbe: frame.pixelProbe,
          pixelRayBase: rayStore.pixelRayBase,
          rayWork: rayStore.rayWork,
          pixelCount: PIXELS,
          raysPerPixel: RAYS_PER_PIXEL,
          trace: synthTrace,
          shadeHit,
          readPixel, readNormal,
          camera: vec3(cameraU),
          spacing0: S0,
          lmax: lmaxU,
          jitterX: 0, jitterY: 0,
        });
        for (const pass of depositCompact.passes) await renderer.computeAsync(pass);
        const [scratchC, statsC, workCount] = await Promise.all([
          renderer.getArrayBufferAsync(bins.scratch.value).then((b) => new Uint32Array(b)),
          depositCompact.readStats(renderer),
          renderer.getArrayBufferAsync(rayStore.rayWork.value).then((b) => new Uint32Array(b)[0]),
        ]);
        let compactDiff = 0;
        for (let i = 0; i < scratch.length; i++) {
          if (scratch[i] !== scratchC[i]) compactDiff++;
        }
        let winners = 0;
        for (let i = 0; i < PIXELS; i++) if (pixelRayBase[i] !== P.SLOT_EMPTY) winners++;
        check("the worklist holds exactly the winners", workCount === winners,
          `${workCount} listed vs ${winners} pixels with a ray base`);
        check("compacted accumulators are bit-identical to classic", compactDiff === 0,
          `${compactDiff} of ${scratch.length} words differ`);
        check("compacted deposits equal classic", statsC.deposits === stats.deposits,
          `${statsC.deposits} vs ${stats.deposits}`);
        say("");

        // ── the mirror, on the GPU's own ray assignment ──────────────────
        const mirrorPixels = [];
        const gpuIndexOf = [];
        for (let i = 0; i < PIXELS; i++) {
          if (!valid[i]) continue;
          mirrorPixels.push(pixels[i]);
          gpuIndexOf.push(i);
        }
        const cfg = ref.makeSrcConfig({
          spacing0: S0, camera: CAM, anchor: ANCHOR, raysPerPixel: RAYS_PER_PIXEL,
          cascadeCount: cfgMod.CASCADE_COUNT, maxLods: cfgMod.MAX_LODS,
        });
        // A FUNCTION rather than a straight-line block, because the starved-pool
        // arm at the bottom runs a SECOND GPU pipeline whose ray partition is
        // its own — the synthetic trace is keyed on the ray index, so a mirror
        // fed the wrong partition would disagree about everything for a reason
        // that has nothing to do with what is being tested. `buildProbes` is
        // re-run per call: `traceAndDeposit` fills `probe.bins` in place, so
        // reusing one build would accumulate two runs into one set of bins.
        const runMirror = (gpuPixelRayBase) => {
          const built = ref.buildProbes(cfg, mirrorPixels);
          const mirrorBases = new Int32Array(mirrorPixels.length);
          for (let j = 0; j < mirrorPixels.length; j++) {
            const b = gpuPixelRayBase[gpuIndexOf[j]];
            mirrorBases[j] = b === P.SLOT_EMPTY ? -1 : b;
          }
          // The mirror's own `assignRays` still runs — the deposit needs nothing
          // from it, but running it and then OVERRIDING the bases is what makes
          // the substitution explicit rather than a missing call.
          const mirrorRays = ref.assignRays(cfg, built);
          mirrorRays.pixelRayBase = mirrorBases;

          // THE MIRROR'S OWN LOOP, not a re-implementation of it. Everything the
          // arms below compare comes out of `probe.bins`, which is what
          // `traceAndDeposit` filled.
          const s = ref.traceAndDeposit(cfg, built, mirrorPixels, mirrorRays, jsSceneTrace);
          const agg = new Map();          // `${cascade}:${key}` -> totals
          const bin = new Map();          // `${cascade}:${key}:${morton}` -> totals
          for (let c = 0; c < cfgMod.CASCADE_COUNT; c++) {
            const n = cfgMod.binCount(c, cfgMod.W0);
            for (const probe of built.cascades[c].probes) {
              if (!probe.bins) continue;
              const key = `${c}:${probe.key >>> 0}`;
              const total = { r: 0, g: 0, b: 0, t: 0, n: 0 };
              for (let m = 0; m < n; m++) {
                const cnt = probe.bins.count[m];
                if (cnt === 0) continue;
                const e = {
                  r: probe.bins.sumR[m], g: probe.bins.sumG[m],
                  b: probe.bins.sumB[m], t: probe.bins.sumT[m], n: cnt,
                };
                bin.set(`${key}:${m}`, e);
                total.r += e.r; total.g += e.g; total.b += e.b; total.t += e.t; total.n += cnt;
              }
              if (total.n > 0) agg.set(key, total);
            }
          }
          return { agg, bin, traced: s.traced, hits: s.hits, deposits: s.deposits };
        };

        // ── the GPU side, aggregated the same two ways ───────────────────
        // Addressed through the CLAIMED BLOCK. A probe holding `SLOT_EMPTY` owns
        // no bins at all and is skipped — which is also what makes this the
        // instrument for "a blockless probe wrote into block 0": those deposits
        // would land in whatever probe owns block 0 and show up as that probe
        // exceeding its mirror twin.
        const aggregateGpu = (probeStore, binStore, tableRaw, scratchRaw) => {
          const agg = new Map();
          const bin = new Map();
          let deposits = 0;
          let maxAcc = 0;
          let maxCount = 0;
          const blocked = [];
          for (let c = 0; c < probeStore.cascades.length; c++) {
            const info = binStore.cascades[c];
            const pc = probeStore.cascades[c];
            const seenBlocks = new Set();
            let liveCount = 0;
            let noBlock = 0;
            for (let k = 0; k < pc.probeCapacity; k++) {
              const p = pc.probeBase + k;
              const w = p * P.PROBE_WORDS;
              if ((tableRaw[w + P.PROBE_FLAGS] & P.FLAG_ALIVE) === 0) continue;
              liveCount++;
              const key = tableRaw[w + P.PROBE_KEY] >>> 0;
              const block = tableRaw[w + P.PROBE_BLOCK] >>> 0;
              if (block === P.SLOT_EMPTY) { noBlock++; continue; }
              seenBlocks.add(block);
              const blockBase = info.binBase + block * info.bins;
              for (let m = 0; m < info.bins; m++) {
                const b = (blockBase + m) * D.BIN_WORDS;
                // COUNT AND T ARE FIXED-POINT WEIGHTS since the temporal blend
                // (`srcDeposit.js`'s header). Dividing here rather than at every
                // comparison keeps the mirror diff in RAYS, which is the unit
                // the mirror counts in — and on a single frame with no history
                // the division is exact, so the arms stay integer comparisons.
                const n = (scratchRaw[b + D.BIN_COUNT] >>> 0) / D.DEPOSIT_SCALE;
                if (n === 0) continue;
                const r = scratchRaw[b + D.BIN_R] >>> 0;
                const g = scratchRaw[b + D.BIN_G] >>> 0;
                const bl = scratchRaw[b + D.BIN_B] >>> 0;
                const t = (scratchRaw[b + D.BIN_T] >>> 0) / D.DEPOSIT_SCALE;
                maxAcc = Math.max(maxAcc, r, g, bl);
                maxCount = Math.max(maxCount, n);
                deposits += n;
                const kk = `${c}:${key}`;
                const e = agg.get(kk) ?? { r: 0, g: 0, b: 0, t: 0, n: 0 };
                e.r += r; e.g += g; e.b += bl; e.t += t; e.n += n;
                agg.set(kk, e);
                bin.set(`${kk}:${m}`, { r, g, b: bl, t, n });
              }
            }
            blocked.push({
              cascade: c, live: liveCount, noBlock,
              distinctBlocks: seenBlocks.size,
              blockCapacity: pc.blockCapacity,
              maxBlock: seenBlocks.size ? Math.max(...seenBlocks) : -1,
            });
          }
          return { agg, bin, deposits, maxAcc, maxCount, blocked };
        };

        const mirror = runMirror(pixelRayBase);
        const { agg: mAgg, bin: mBin } = mirror;
        const mTraced = mirror.traced;
        const mHits = mirror.hits;
        const mDeposits = mirror.deposits;

        const gpu = aggregateGpu(store, bins, table, scratch);
        const { agg: gAgg, bin: gBin } = gpu;
        const gDeposits = gpu.deposits;
        const maxAccum = gpu.maxAcc;
        const maxBinCount = gpu.maxCount;
        let unknownBins = 0;
        let resolvedBins = 0;
        // Payload coverage, over the WHOLE buffer — unsampled slots included,
        // because "an untouched bin resolves to unknown" is the claim.
        for (let i = 0; i < bins.binTotal; i++) {
          const T = payloadRaw[i * D.PAYLOAD_WORDS + 3];
          if (T === D.PAYLOAD_UNKNOWN) unknownBins++;
          else resolvedBins++;
        }

        // ══ ARM 0c: THE PER-BLOCK EVIDENCE SUMS ══════════════════════════
        say("── SUMS: [E]'s per-block luma/weight record vs a CPU walk ──");
        // The surprise statistic's raw material. [E] adds two words per deposit
        // into the block's `BSTAT` record — the deposit's LUMA (zero on the
        // transmittance-only branch) and its WEIGHT (always) — and everything
        // downstream is a ratio of those two, so an error here is invisible in
        // every image and shows up only as a block that never (or always)
        // surprises.
        //
        // ⚠ THE SHIFT IS PER DEPOSIT, so this cannot be checked against the
        // mirror's bin aggregates: `Σ floor(luma/1024)` is not
        // `floor(Σ luma / 1024)`. The walk below therefore re-derives the
        // per-ray values — and is itself tied to the mirror first, by the two
        // counts it must reproduce (`n` and `n − t` per probe, the mirror's own
        // totals), so a walk that disagreed about which cascade owns a hit
        // would fail before its sums were believed.
        //
        // Placed here, after the aggregation, for exactly that tie; it runs a
        // THIRD deposit over the same untouched ray partition, like ARM 0b.
        const surpriseFU = uniform(1);
        const depositSums = D.createSrcDepositFrame(store, bins, {
          pixelProbe: frame.pixelProbe,
          pixelRayBase: rayStore.pixelRayBase,
          pixelCount: PIXELS,
          raysPerPixel: RAYS_PER_PIXEL,
          trace: synthTrace,
          shadeHit,
          readPixel, readNormal,
          camera: vec3(cameraU),
          spacing0: S0,
          lmax: lmaxU,
          jitterX: 0, jitterY: 0,
          surprise: { statBase: bins.blockStatBase, surpriseF: surpriseFU },
        });
        for (const pass of depositSums.passes) await renderer.computeAsync(pass);
        const scratchS = new Uint32Array(await renderer.getArrayBufferAsync(bins.scratch.value));
        // f32 at every step, because the kernel is: the weights are f32
        // constants, the three products and two adds are f32, and `.toUint()`
        // TRUNCATES. A one-ulp disagreement here moves a truncated integer.
        const W_R = Math.fround(0.2126);
        const W_G = Math.fround(0.7152);
        const W_B = Math.fround(0.0722);
        const lumaShifted = (r, g, b) => {
          const x = Math.fround(
            Math.fround(Math.fround(r * W_R) + Math.fround(g * W_G)) + Math.fround(b * W_B),
          );
          return Math.trunc(x) >>> cfgMod.SUM_SHIFT;
        };
        const RAY_WEIGHT = D.DEPOSIT_SCALE >>> cfgMod.SUM_SHIFT;
        const walkAll = new Map();       // global block -> deposits
        const walkOwn = new Map();       // global block -> deposits at c == own
        const walkLuma = new Map();      // global block -> Σ shifted luma
        const bump = (m, k, v) => m.set(k, (m.get(k) ?? 0) + v);
        for (let i = 0; i < PIXELS; i++) {
          if (!valid[i]) continue;
          const base = pixelRayBase[i];
          if (base === P.SLOT_EMPTY) continue;
          const probe0 = pixelProbe[i];
          if (probe0 === P.SLOT_EMPTY) continue;
          // The ancestor chain and its blocks, out of the GPU's own table —
          // the same walk [E] hoists out of its ray loop.
          const chain = [probe0];
          for (let c = 1; c < cfgMod.CASCADE_COUNT; c++) {
            const prev = chain[c - 1];
            chain.push(prev === P.SLOT_EMPTY
              ? P.SLOT_EMPTY
              : table[prev * P.PROBE_WORDS + P.PROBE_PARENT] >>> 0);
          }
          const pos = pixels[i].position;
          const cheb = cfgMod.chebyshev(pos[0], pos[1], pos[2], CAM[0], CAM[1], CAM[2]);
          const lod = Math.floor(cfgMod.lodAtDistance(cheb, S0, cfgMod.MAX_LODS));
          const bounds = cfgMod.intervalBoundaries(lod, S0, cfgMod.CASCADE_COUNT);
          for (let k = 0; k < RAYS_PER_PIXEL; k++) {
            const n = base + k;
            const { t, radiance } = jsSceneTrace(pos, null, n);
            let own = cfgMod.CASCADE_COUNT;
            if (t >= 0) {
              own = 0;
              for (const b of bounds) if (t > b) own++;
            }
            const luma = lumaShifted(radiance[0], radiance[1], radiance[2]);
            for (let c = 0; c < cfgMod.CASCADE_COUNT; c++) {
              if (chain[c] === P.SLOT_EMPTY || c > own) continue;
              const block = table[chain[c] * P.PROBE_WORDS + P.PROBE_BLOCK] >>> 0;
              if (block === P.SLOT_EMPTY) continue;
              const g = store.cascades[c].blockBase + block;
              bump(walkAll, g, 1);
              if (c === own) { bump(walkOwn, g, 1); bump(walkLuma, g, luma); }
            }
          }
        }
        // ── the tie: the walk must reproduce the mirror's own two counts ──
        let walkWrong = 0;
        let walkWorst = null;
        let sumWrong = 0;
        let sumWorst = null;
        let sumBlocks = 0;
        let lumaTotal = 0;
        for (let c = 0; c < cfgMod.CASCADE_COUNT; c++) {
          const pc = store.cascades[c];
          for (let k = 0; k < pc.probeCapacity; k++) {
            const w = (pc.probeBase + k) * P.PROBE_WORDS;
            if ((table[w + P.PROBE_FLAGS] & P.FLAG_ALIVE) === 0) continue;
            const block = table[w + P.PROBE_BLOCK] >>> 0;
            if (block === P.SLOT_EMPTY) continue;
            const g = pc.blockBase + block;
            const all = walkAll.get(g) ?? 0;
            const own = walkOwn.get(g) ?? 0;
            const m = mAgg.get(`${c}:${table[w + P.PROBE_KEY] >>> 0}`) ?? { n: 0, t: 0 };
            if (all !== m.n || own !== m.n - m.t) {
              walkWrong++;
              if (!walkWorst) walkWorst = `c${c} block ${block}: walk ${all}/${own} vs mirror ${m.n}/${m.n - m.t}`;
            }
            const s = bins.blockStatBase + g * cfgMod.BSTAT_WORDS;
            const gotL = scratchS[s + cfgMod.BSTAT_SUM_L] >>> 0;
            const gotW = scratchS[s + cfgMod.BSTAT_SUM_W] >>> 0;
            const wantL = walkLuma.get(g) ?? 0;
            const wantW = all * RAY_WEIGHT;
            if (all > 0) sumBlocks++;
            lumaTotal += wantL;
            if (gotL !== wantL || gotW !== wantW) {
              sumWrong++;
              if (!sumWorst) sumWorst = `c${c} block ${block}: gpu L${gotL}/W${gotW} vs walk L${wantL}/W${wantW}`;
            }
          }
        }
        check("the CPU walk reproduces the mirror's deposit and own-deposit counts",
          walkWrong === 0, walkWorst ?? `${sumBlocks} blocks`);
        check("every block's SUM_L and SUM_W match the walk exactly", sumWrong === 0,
          sumWorst ?? `${sumBlocks} blocks, ${lumaTotal} shifted luma total`);
        check("the sums are not all zero (the arm is not vacuous)",
          sumBlocks > 0 && lumaTotal > 0, `${sumBlocks} blocks, ${lumaTotal} luma`);
        // No block outside the live set may have been written — an off-by-one
        // in the stat base would scatter atomics into the BIN region, which is
        // the failure the `Number.isInteger` throw exists for.
        let strayStat = 0;
        for (let g = 0; g < store.blockTotal; g++) {
          if (walkAll.has(g)) continue;
          const s = bins.blockStatBase + g * cfgMod.BSTAT_WORDS;
          if ((scratchS[s + cfgMod.BSTAT_SUM_L] >>> 0) !== 0
            || (scratchS[s + cfgMod.BSTAT_SUM_W] >>> 0) !== 0) strayStat++;
        }
        check("no block outside the deposited set holds a sum", strayStat === 0,
          `${strayStat} blocks written that took no deposit`);
        say("");

        // ══ ARM 1: totals ════════════════════════════════════════════════
        say("── TOTALS: rays, hits and deposits vs the mirror ──");
        check("the same number of rays were traced", stats.rays === mTraced,
          `gpu ${stats.rays} vs mirror ${mTraced}`);
        check("the same number of rays hit", stats.hits === mHits,
          `gpu ${stats.hits} vs mirror ${mHits} (${(100 * mHits / mTraced).toFixed(1)}% — the ` +
          "rest escape past the last boundary and deposit into every cascade)");
        check("the same number of deposits landed", stats.deposits === mDeposits,
          `gpu ${stats.deposits} vs mirror ${mDeposits}`);
        check("the bin counts sum to the deposit count", gDeposits === stats.deposits,
          `${gDeposits} vs ${stats.deposits} — a mismatch means deposits landed outside any live probe`);
        say(`   ${(stats.deposits / stats.rays).toFixed(3)} deposits per ray ` +
          `(must be in [1, ${cfgMod.CASCADE_COUNT}])`);

        // ══ ARM 2: per-probe aggregates, exact ═══════════════════════════
        say("");
        say("── PROBES: per-probe totals by key, summed over bins ──");
        // Bin-INDEPENDENT and therefore exact: the direction quantization can
        // move a deposit between BINS of the same probe, but never between
        // probes. This is the arm that carries the split rule, the chain walk
        // and the fixed point.
        let missing = 0;
        let countWrong = 0;
        let tWrong = 0;
        let rgbWrong = 0;
        let worst = null;
        for (const [k, m] of mAgg) {
          const g = gAgg.get(k);
          if (!g) { missing++; continue; }
          if (g.n !== m.n) { countWrong++; worst ??= `${k}: n ${g.n} vs ${m.n}`; }
          if (g.t !== m.t) { tWrong++; worst ??= `${k}: sumT ${g.t} vs ${m.t}`; }
          // The mirror sums the 12-bit integers directly, so this is an integer
          // comparison — see the header on why Lmax is a power of two.
          if (g.r !== m.r || g.g !== m.g || g.b !== m.b) {
            rgbWrong++;
            worst ??= `${k}: rgb ${g.r}/${g.g}/${g.b} vs ${m.r}/${m.g}/${m.b}`;
          }
        }
        check("every probe the mirror deposited into exists on the GPU", missing === 0,
          `${missing}/${mAgg.size} missing`);
        check("every probe's deposit COUNT matches", countWrong === 0, `${countWrong} wrong`);
        check("every probe's transmittance SUM matches", tWrong === 0, `${tWrong} wrong`);
        check("every probe's fixed-point RGB SUM matches exactly", rgbWrong === 0,
          `${rgbWrong} wrong${worst ? ` — ${worst}` : ""}`);
        check("the GPU deposited into no probe the mirror did not",
          gAgg.size === mAgg.size, `gpu ${gAgg.size} probes vs mirror ${mAgg.size}`);

        // ══ ARM 3: per-bin ══════════════════════════════════════════════
        say("");
        say("── BINS: the same totals per (probe, bin) ──");
        // Direction-DEPENDENT, so this one is allowed ties: `rayDirection` runs
        // through sin/cos, which are not bit-identical across the boundary, and
        // a direction within an ulp of a bin edge quantizes either way. The
        // number is reported and bounded rather than asserted to zero — pinning
        // it at zero would be pinning two transcendental implementations
        // together, which is not a property this module has or needs.
        let binMismatch = 0;
        for (const [k, m] of mBin) {
          const g = gBin.get(k);
          if (!g || g.n !== m.n || g.t !== m.t || g.r !== m.r || g.g !== m.g || g.b !== m.b) {
            binMismatch++;
          }
        }
        const binTies = binMismatch / Math.max(1, mBin.size);
        check("per-bin totals agree except for direction-quantization ties",
          binTies < 0.005,
          `${binMismatch}/${mBin.size} bins differ (${(binTies * 100).toFixed(3)}%) — ` +
          "the budget is 0.5%, and these are rays whose direction sits within an ulp of a bin edge");

        // ══ ARM 4: the split rule ═══════════════════════════════════════
        say("");
        say("── SPLIT: nothing above the owning cascade, T=1 below it ──");
        // Checked on the GPU's own numbers rather than against the mirror,
        // because it is a property of a single frame and not of an agreement:
        // a bin that took radiance must have taken T=0 with it, and a bin that
        // is pure transmittance must carry no radiance at all.
        let radianceWithT = 0;
        let cascadeAbove = 0;
        for (const [k, g] of gAgg) {
          // sumT counts clear deposits and (n - sumT) counts blocking ones. A
          // probe with radiance but no blocking deposits is the contradiction.
          const blocking = g.n - g.t;
          if ((g.r + g.g + g.b) > 0 && blocking === 0) radianceWithT++;
          if (blocking < 0) cascadeAbove++;
          void k;
        }
        check("no probe carries radiance without a blocking deposit", radianceWithT === 0,
          `${radianceWithT} probes`);
        check("no probe's clear-deposit count exceeds its total", cascadeAbove === 0,
          `${cascadeAbove} probes`);
        const perRay = stats.deposits / stats.rays;
        check(`deposits per ray sit in [1, ${cfgMod.CASCADE_COUNT}]`,
          perRay >= 1 && perRay <= cfgMod.CASCADE_COUNT, perRay.toFixed(3));

        // ══ ARM 5: unknown vs zero ══════════════════════════════════════
        say("");
        say("── UNKNOWN: a bin no ray landed in is not black ──");
        check("unsampled bins resolved to UNKNOWN, not to zero",
          unknownBins === bins.binTotal - gBin.size,
          `${unknownBins} unknown + ${gBin.size} sampled vs ${bins.binTotal} total`);
        check("some bins DID resolve", resolvedBins > 0,
          `${resolvedBins} resolved — zero here would make the arm above vacuous`);
        say(`   ${(100 * resolvedBins / bins.binTotal).toFixed(4)}% of allocated bins were sampled ` +
          "(§12.16 read 0.24% of this when bins were sized by probe CAPACITY; the " +
          "claimed block pool is what raised it, and the rest is angular sparsity)");

        // ══ ARM 6: the fixed point's headroom ═══════════════════════════
        say("");
        say("── OVERFLOW: measured headroom of the F=16 accumulator ──");
        // §12.13.4 predicts overflow only at 65,536 saturated rays in one bin.
        // This measures the two numbers that prediction is made of — the worst
        // accumulated value and the worst bin occupancy actually reached — and
        // states the margin rather than trusting the table.
        const headroom = maxAccum > 0 ? 4294967296 / maxAccum : Infinity;
        const saturatedCap = 65536;
        say(`   worst bin held ${maxBinCount} deposits; worst accumulator reached ` +
          `${maxAccum} of 2^32 (${headroom.toExponential(2)}x headroom)`);
        check("the accumulator is orders of magnitude clear of 2^32", headroom > 1000,
          `${headroom.toExponential(2)}x`);
        check("the worst bin occupancy is far under the saturated-overflow bound",
          maxBinCount * 64 < saturatedCap,
          `${maxBinCount} deposits vs ${saturatedCap} saturated rays — 64x margin required`);

        // ══ ARM 7: the block claim ══════════════════════════════════════
        say("");
        say("── BLOCKS: one block per live probe, distinct, in range ──");
        // The property the whole scheme rests on. Two probes sharing a block
        // would look EXACTLY like a correct run in every arm above — the
        // deposits would all land, the totals would all match — while the two
        // probes' bins were silently summed together. Nothing else here would
        // catch it, which is why distinctness is asserted directly.
        let sharedBlocks = 0;
        let outOfRange = 0;
        let unclaimed = 0;
        for (const b of gpu.blocked) {
          if (b.distinctBlocks !== b.live - b.noBlock) sharedBlocks++;
          if (b.maxBlock >= b.blockCapacity) outOfRange++;
          unclaimed += b.noBlock;
          say(`   c${b.cascade}: ${b.live} live, ${b.distinctBlocks} distinct blocks ` +
            `of ${b.blockCapacity}` + (b.noBlock ? `, ${b.noBlock} UNCLAIMED` : ""));
        }
        check("no two live probes hold the same block", sharedBlocks === 0,
          `${sharedBlocks} cascades where distinct blocks != live probes with a block`);
        check("every claimed block is inside its cascade's pool", outOfRange === 0,
          `${outOfRange} cascades with a block index past capacity`);
        check("the pool was big enough — no probe went without bins", unclaimed === 0,
          `${unclaimed} probes unclaimed; ${stats.noBlock} deposits dropped`);
        check("no deposit was dropped for want of a block", stats.noBlock === 0,
          `${stats.noBlock} dropped`);

        // ══ ARM 8: a pool too small to serve every probe ════════════════
        say("");
        say("── STARVED: a claim failure is an ABSENCE, never block 0 ──");
        // `binBudget: 1` floors every cascade at `MIN_BLOCKS`, which is far
        // under the live probe count — the exhaustion path taken for real
        // rather than simulated by poking a counter.
        //
        // What this proves is the thing that cannot be proven on a healthy run:
        // a probe that fails to claim writes NOTHING. If it fell back to block
        // 0, block 0's owner would carry its own deposits plus the strays, and
        // the per-probe comparison below would fail on exactly that probe.
        const starvedStore = P.createSrcProbeStore({
          c0Probes: C0_PROBES, cascadeCount: cfgMod.CASCADE_COUNT, binBudget: 1,
        });
        const starvedFrame = P.createSrcProbeFrame(starvedStore, {
          spacing0: S0, camera: vec3(cameraU), anchor: vec3(anchorU),
          pixelCount: PIXELS, readPixel,
        });
        const starvedRays = R.createSrcRayStore(starvedStore, { pixelCount: PIXELS });
        const starvedRayFrame = R.createSrcRayFrame(starvedStore, starvedRays, {
          pixelProbe: starvedFrame.pixelProbe, raysPerPixel: RAYS_PER_PIXEL,
        });
        const starvedBins = D.createSrcBinStore(starvedStore, { w0: cfgMod.W0 });
        const starvedDeposit = D.createSrcDepositFrame(starvedStore, starvedBins, {
          pixelProbe: starvedFrame.pixelProbe,
          pixelRayBase: starvedRays.pixelRayBase,
          pixelCount: PIXELS, raysPerPixel: RAYS_PER_PIXEL,
          trace: synthTrace, shadeHit, readPixel, readNormal,
          camera: vec3(cameraU), spacing0: S0, lmax: lmaxU, jitterX: 0, jitterY: 0,
        });
        for (const pass of starvedFrame.passes) await renderer.computeAsync(pass);
        for (const pass of starvedRayFrame.passes) await renderer.computeAsync(pass);
        for (const pass of starvedDeposit.passes) await renderer.computeAsync(pass);
        const [sTable, sBase, sScratch, sStats, sProbeStats] = await Promise.all([
          renderer.getArrayBufferAsync(starvedStore.probeTable.value).then((b) => new Uint32Array(b)),
          renderer.getArrayBufferAsync(starvedRays.pixelRayBase.value).then((b) => new Uint32Array(b)),
          renderer.getArrayBufferAsync(starvedBins.scratch.value).then((b) => new Uint32Array(b)),
          starvedDeposit.readStats(renderer),
          P.readSrcProbeStats(renderer, starvedStore),
        ]);
        const sGpu = aggregateGpu(starvedStore, starvedBins, sTable, sScratch);
        const sMirror = runMirror(sBase);

        const starvedUnclaimed = sGpu.blocked.reduce((a, b) => a + b.noBlock, 0);
        say(`   ${starvedStore.cascades.map((c) => c.blockCapacity).join("/")} blocks for ` +
          `${sGpu.blocked.map((b) => b.live).join("/")} live probes  ` +
          `${(starvedBins.bytes / 1048576).toFixed(1)}MB`);
        check("the pool really did run out", starvedUnclaimed > 0,
          `${starvedUnclaimed} probes without a block — zero would make this arm vacuous`);
        check("the shortfall is COUNTED by the probe store",
          sProbeStats.reduce((a, s) => a + s.noBlock, 0) > 0,
          `NOBLOCK ${sProbeStats.map((s) => s.noBlock).join("/")}`);
        check("no two probes share a block under starvation",
          sGpu.blocked.every((b) => b.distinctBlocks === b.live - b.noBlock),
          sGpu.blocked.map((b) => `c${b.cascade} ${b.distinctBlocks}/${b.live - b.noBlock}`).join(" "));
        check("no claimed block is past the (tiny) capacity",
          sGpu.blocked.every((b) => b.maxBlock < b.blockCapacity),
          sGpu.blocked.map((b) => `c${b.cascade} max ${b.maxBlock} of ${b.blockCapacity}`).join(" "));

        // The one that matters: every probe that DID claim must still agree with
        // its mirror twin exactly. A blockless probe redirecting to block 0
        // shows up here and nowhere else.
        let strayInto = 0;
        let starvedMissing = 0;
        for (const [k, g] of sGpu.agg) {
          const m = sMirror.agg.get(k);
          if (!m) { starvedMissing++; continue; }
          if (g.n !== m.n || g.t !== m.t || g.r !== m.r || g.g !== m.g || g.b !== m.b) strayInto++;
        }
        check("every probe that HELD a block matches the mirror exactly", strayInto === 0,
          `${strayInto}/${sGpu.agg.size} probes carry deposits that are not theirs`);
        check("the GPU deposited into no probe the mirror did not", starvedMissing === 0,
          `${starvedMissing} unexplained probes`);
        // Exact accounting: what was dropped is precisely what the blockless
        // probes would have deposited, so nothing went missing anywhere else.
        const droppedExpected = sMirror.deposits - sGpu.deposits;
        check("dropped deposits + landed deposits = the mirror's total",
          sStats.noBlock === droppedExpected && sStats.deposits === sGpu.deposits,
          `dropped ${sStats.noBlock} vs expected ${droppedExpected}, ` +
          `landed ${sStats.deposits} vs binned ${sGpu.deposits}, mirror ${sMirror.deposits}`);

        // ══ ARM 9: retirement returns every block ═══════════════════════
        say("");
        say("── RETIREMENT: the pool is a cycle, not a one-way allocation ──");
        // A leak here is invisible for `blockCapacity` probe lifetimes and then
        // permanent, which is the worst shape a bug can have — it survives every
        // gate, ships, and turns into "GI stops working after a few minutes of
        // walking". So the check is a PERMUTATION: after every probe has
        // retired, each cascade's free region must hold each block index exactly
        // once. That catches a leak and a double-free with the same assertion.
        const AGED = 1;
        const agedFrame = P.createSrcProbeFrame(starvedStore, {
          spacing0: S0, camera: vec3(cameraU), anchor: vec3(anchorU),
          pixelCount: PIXELS, readPixel, maxAge: AGED,
        });
        // Every pixel invalid — no key, no insert, nothing to keep alive.
        const attrArr = posBuf.value.array;
        for (let i = 0; i < PIXELS; i++) attrArr[i * 8 + 3] = 0;
        posBuf.value.needsUpdate = true;
        // RETIREMENT CASCADES WITH A ONE-LIFETIME LAG PER LEVEL, so this is not
        // `maxAge + 1` frames — it is that per cascade. A live c0 probe keeps
        // re-inserting its c1 parent, which keeps re-inserting its own, so the
        // ladder only starts dying at the bottom and works up. §12.12 measured
        // the same thing from the other side (c0 12 live < c1 18 across frames)
        // and it is correct behaviour, not a leak: it is what keeps every
        // ancestor chain complete while any descendant is still being used.
        const SWEEP = 16;
        for (let f = 0; f < SWEEP; f++) {
          for (const pass of agedFrame.passes) await renderer.computeAsync(pass);
        }
        const [rTop, rStack, rProbeStats] = await Promise.all([
          renderer.getArrayBufferAsync(starvedStore.freeTop.value).then((b) => new Uint32Array(b)),
          renderer.getArrayBufferAsync(starvedStore.freeStack.value).then((b) => new Uint32Array(b)),
          P.readSrcProbeStats(renderer, starvedStore),
        ]);
        // Block tops live in the SECOND half of `freeTop` — probe tops first,
        // block tops at `cascadeCount + cascade`, one buffer for both.
        const NC = starvedStore.cascadeCount;
        check(`every probe retired within ${SWEEP} frames of its pixels going away`,
          rProbeStats.every((s) => s.live === 0),
          `live ${rProbeStats.map((s) => s.live).join("/")}`);
        check("every block top is back at full capacity",
          starvedStore.cascades.every((c) => rTop[NC + c.cascade] === c.blockCapacity),
          starvedStore.cascades
            .map((c) => `c${c.cascade} ${rTop[NC + c.cascade]}/${c.blockCapacity}`).join(" "));
        let notPermutation = 0;
        for (const c of starvedStore.cascades) {
          const seen = new Set();
          for (let i = 0; i < c.blockCapacity; i++) {
            seen.add(rStack[starvedStore.blockStackBase + c.blockBase + i] >>> 0);
          }
          if (seen.size !== c.blockCapacity) notPermutation++;
          else for (let i = 0; i < c.blockCapacity; i++) if (!seen.has(i)) { notPermutation++; break; }
        }
        check("each cascade's free stack is a PERMUTATION of its blocks",
          notPermutation === 0,
          `${notPermutation} cascades hold a duplicate or a gap — i.e. a double-free or a leak`);

        if (validationErrors.length) check("no WebGPU validation errors", false, validationErrors[0]);

        say("");
        say(failures ? `gi-src-deposit: ${failures} CHECKS FAILED` : "gi-src-deposit: all cases PASS");
        globalThis.__SRC_DEPOSIT_RESULT__ = {
          pass: failures === 0,
          failures,
          rays: stats.rays,
          deposits: stats.deposits,
          perRay: +perRay.toFixed(3),
          binTies: binMismatch,
          binTotal: bins.binTotal,
          binBytes: +(bins.bytes / 1048576).toFixed(1),
          blocks: store.cascades.map((c) => c.blockCapacity).join("/"),
          liveProbes: gpu.blocked.map((b) => b.live).join("/"),
          starvedDropped: sStats.noBlock,
          sampledBins: gBin.size,
          headroom: +headroom.toPrecision(3),
          statBlocks: sumBlocks,
          statLuma: lumaTotal,
          storageLimit: device.limits.maxStorageBuffersPerShaderStage,
          text: out.textContent,
        };

      } catch (error) {
        fail(error);
      }
    </script>
  </body>
</html>
