<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GI portable WebGPU smoke</title>
    <style>html,body,canvas{margin:0;width:100%;height:100%;display:block;background:#111}</style>
  </head>
  <body>
    <canvas id="view" width="320" height="240"></canvas>
    <script type="module">
      const fail = (error) => {
        console.error("GI-SMOKE FAIL", error?.stack ?? error?.message ?? String(error));
        globalThis.__GI_SMOKE_RESULT__ = { pass: false, error: error?.message ?? String(error) };
      };
      globalThis.addEventListener("error", (event) => fail(event.error ?? event.message));
      globalThis.addEventListener("unhandledrejection", (event) => fail(event.reason));

      try {
        const rayHitMode = new URLSearchParams(location.search).get("mode") ?? "hybrid-brick-box";
        const ACTIVE_MODES = {
          "occupancy-legacy": 0,
          "hybrid-brick-box": 1,
          "hybrid-plane": 2,
          "hybrid-plane-coverage": 3,
          "hybrid-exact-complex": 4,
        };
        const expectedActiveMode = ACTIVE_MODES[rayHitMode] ?? 0;
        const hybridMode = expectedActiveMode >= 1;
        const planeMode = expectedActiveMode >= 2;
        const exactMode = expectedActiveMode >= 4;
        // ── SRC'S TRACE LADDER IS NOT THE ENGINE'S ────────────────────────
        //
        // `pickOccTrace` (srcTrace.js) ships TWO rungs, not five (plan §4.3):
        // the plane marcher for modes 2-4, and the legacy occupancy march for
        // anything below — brick-box and plane-coverage are gone, because box
        // hits quantize silhouettes to whole voxels and coverage was superseded
        // by the triangle pool.
        //
        // That matters HERE because SRC's scaffold pass is now the only profiled
        // tracer in the build. The counters that get written are the ones SRC's
        // rung writes, not the ones the requested mode implies: `traceOccupancy`
        // feeds rays/hits/macroSteps and nothing else, so `?mode=hybrid-brick-box`
        // legitimately reports brickSteps = 0. Asserting otherwise — which this
        // file did, and which is how the scaffold's first green run failed — is
        // asserting a property of a tracer that no longer runs.
        //
        // Every quality tier ships HybridPlane or above (RayHitConfig), so the
        // rungs SRC dropped are not rungs any user is on.
        const srcPlaneTrace = expectedActiveMode >= ACTIVE_MODES["hybrid-plane"] &&
          expectedActiveMode <= ACTIVE_MODES["hybrid-exact-complex"];
        const srcExactTrace = expectedActiveMode === ACTIVE_MODES["hybrid-exact-complex"];
        // Phase 5 A/B: `?skip=0` compiles the no-coarse-level arm. Default on,
        // matching the runtime default, so the plain URL still smokes shipping
        // behaviour.
        const coarseSkip = new URLSearchParams(location.search).get("skip") !== "0";
        // Force the Phase-1 hierarchy and its debug binding into the composed
        // cascade shader. This is the binding-budget regression gate.
        globalThis.__giRayHitProfiling = true;
        globalThis.__giRayHitMode = rayHitMode;
        globalThis.__giRayHitSkipDistance = coarseSkip;
        // Compiles the shadow filter's temporal-validity counter (see the
        // lightshadow arm's reprojection gate below). Build-time flag; the
        // second global opts the runtime INTO temporal accumulation (still
        // opt-in until this arm's gate proves it).
        globalThis.__giShadowTemporalDebug = true;
        globalThis.__giShadowTemporal = true;
        // ANALYTIC-WIDTH is the DEFAULT (docs/GI_SHADOWS_PLAN.md §5):
        // deterministic central-ray march × mid-field distanceTexture width,
        // NO temporal chain. `?analytic=0` compiles the legacy stochastic
        // sun-disc + temporal arm instead — that arm's reprojection/counter
        // gates below only run there.
        const analyticArm = new URLSearchParams(location.search).get("analytic") !== "0";
        if (!analyticArm) globalThis.__giShadowAnalyticWidth = false;
        // `?kindmap=1` — FAIL-CLOSED ATTRIBUTION arm: compiles the marcher's
        // verdict SUB-KIND paint (GISystem's "sub" mode) into the sun's shadow
        // channel instead of a shadow, then histograms the raw readback below.
        // Distinguishes macro-exhaust (128) / brick-limit (159) / invalid
        // brick ref (191) — one run answers WHICH fail-closed class the
        // session-29 ⅓-clamped map was. Build-time, so it must be set here.
        // kindmap=1 → paint + readback; kindmap=2 → readback only (isolates
        // "paint broke the pass" from "readback reads an unwritten texture").
        const kindMapMode = Number(new URLSearchParams(location.search).get("kindmap") ?? 0);
        const kindMap = kindMapMode > 0;
        if (kindMapMode === 1) globalThis.__giShadowKindDebug = "sub";
        // `?shadowprofile=1` — fold the SHADOW rays into the rayHitDebug
        // counters (macroLimit/brickLimit/invalid are separate columns there).
        // The zero-limit assertions below then measure the shadow arm too —
        // a run FAILING with nonzero macro=/brick= counts IS the attribution.
        if (new URLSearchParams(location.search).get("shadowprofile") === "1") globalThis.__giShadowProfile = true;
        // `?dynamic=1` pins exact-dynamic adoption OFF at boot (build-time
        // hatch) — that arm gates the voxel record-refit tail, which adoption
        // would legitimately bypass. `?dynobj=1` is the adoption arm.
        if (new URLSearchParams(location.search).get("dynamic") === "1") globalThis.__giDynamicObjects = false;
        // `?staticbvh=1` — the static-scene BVH shadow arm. Without it the
        // lightshadow arm pins the RECORD marcher (its pen-variant compile
        // gate is meaningless under the BVH arm, which replaces that WGSL).
        const staticBvhArm = new URLSearchParams(location.search).get("staticbvh") === "1";
        if (new URLSearchParams(location.search).get("lightshadow") === "1" && !staticBvhArm) {
          globalThis.__giShadowStaticBvh = false;
        }
        // dynobj=1 → box mover (analytic OBB path); dynobj=2 → torus mover
        // (object-local BVH4 exact-triangle path).
        const dynObjArm = Number(new URLSearchParams(location.search).get("dynobj") ?? 0);
        // `?src=1` — SPLIT RADIANCE CASCADES PROBE POPULATION (plan §7 Phase 1).
        // Build-time, because `srcProbesEnabled()` is read when the screen
        // bundle is constructed. This arm is what puts the population's
        // fourteen compute kernels in front of the PORTABLE 8-storage-buffer
        // limit on a device created at exactly that limit — the audit below
        // walks them, and anything over the line fails pipeline creation, which
        // surfaces as a validation error rather than as a wrong picture.
        const srcArm = new URLSearchParams(location.search).get("src") === "1";
        if (srcArm) globalThis.__giSrcProbes = true;
        // `?raysteps=N` — the scaffold ray pass's per-ray step budget. An A/B
        // rather than a constant because SRC's rays are LONGER than the interval
        // rays every existing budget was tuned against (srcTrace.js's header
        // says so), and `stepLimitExits` is the only instrument that can say by
        // how much. Build-time: the budget is baked into the WGSL.
        const raySteps = Number(new URLSearchParams(location.search).get("raysteps") ?? 0);
        if (raySteps > 0) globalThis.__giSrcRaySteps = raySteps;
        // `?sky=N` — SRC's c0-only resolve composites the scene's own Sky Light
        // where a bin's transmittance survived, and `skyIntensity` DEFAULTS TO
        // ZERO. So without this the whole gather is a correct, verifiable,
        // entirely black picture — which is exactly what unit 4 must not be
        // allowed to ship as. Set on the component below, not here.
        const skyArm = Number(new URLSearchParams(location.search).get("sky") ?? 0);
        // `?s0=N` — probe spacing at LOD 0, overriding the quality tier. The A/B
        // for the wrong-hemisphere count: an SRC probe is position-only, so one
        // shared by two surfaces facing opposite ways has bins in only one of
        // their hemispheres. Fewer, larger probes should make that worse.
        const s0Arm = Number(new URLSearchParams(location.search).get("s0") ?? 0);
        if (s0Arm > 0) globalThis.__giSrcSpacing0 = s0Arm;
        // editorFramePacing stops unfocused engines — headless the page is
        // NEVER focused, and the temporal gate below is the first assertion
        // that needs the loop RUNNING at assert time (earlier arms only read
        // state accumulated during the pinned boot window).
        globalThis.__editorKeepRendering = true;
        const { Engine, THREE, registerBuiltInComponents } = await import("/src/engine/index.js");
        await import("/src/modules/index.js");
        const { enableEngineModule } = await import("/src/engine/modules.js");

        registerBuiltInComponents();
        const engine = new Engine();
        globalThis.__GI_SMOKE_ENGINE__ = engine;
        // Diagnostic: our own preRender callback — separates "Engine stopped
        // running preRender callbacks" from "GI's callback specifically died".
        const preRenderProbe = { count: 0 };
        engine.onPreRender(() => preRenderProbe.count++);
        globalThis.__GI_SMOKE_PRERENDER__ = preRenderProbe;
        engine.setSize(320, 240);
        await engine.init(document.querySelector("#view"));
        if (engine.getBackendName() !== "WebGPU") throw new Error(`WebGPU unavailable (${engine.getBackendName()})`);
        globalThis.__GI_SMOKE_RENDERER__ = engine.renderer;
        const device = engine.renderer.backend.device;
        const validationErrors = [];
        device.addEventListener?.("uncapturederror", (event) => {
          validationErrors.push(event.error?.message ?? String(event.error));
          console.error("WebGPU validation error:", validationErrors.at(-1));
        });
        if (device.limits.maxStorageBuffersPerShaderStage !== 8) {
          throw new Error(`smoke device was not created at portable storage-buffer limit 8 (got ${device.limits.maxStorageBuffersPerShaderStage})`);
        }

        await enableEngineModule(engine, "gi");
        const material = new THREE.MeshStandardNodeMaterial({ color: 0x888888, roughness: 0.9 });
        const floor = new THREE.Mesh(new THREE.BoxGeometry(8, 0.2, 8).toNonIndexed(), material);
        floor.position.y = -1;
        const wall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 8).toNonIndexed(), material);
        wall.position.x = -2;
        floor.updateMatrixWorld(true);
        wall.updateMatrixWorld(true);
        engine.scene.add(floor, wall);
        // `?lightshadow=1` — the RECORD-MARCH arm: a component light claiming
        // Shadow Source "gi" compiles the pen variant of the plane trace
        // (giHybridPlaneTrace…p) into the resolve. An invalid pipeline there
        // silently drops the whole compute batch, so this is the compile gate
        // for the shadow variant that no CPU suite can provide.
        const lightShadowArm = new URLSearchParams(location.search).get("lightshadow") === "1";
        if (lightShadowArm) {
          engine.renderer.shadowMap.enabled = true;
          const sunEnt = engine.createEntity({ name: "Smoke Sun" });
          const sunComp = sunEnt.addComponent("light", {
            type: "directional", color: "#ffffff", intensity: 2,
            castShadow: true, shadowMode: "gi", sourceAngle: 2,
          });
          sunEnt.object3D?.position?.set(2, 4, 2);
          globalThis.__GI_SMOKE_SUN__ = { ent: sunEnt, comp: sunComp };
        } else {
          const sun = new THREE.DirectionalLight(0xffffff, 2);
          sun.position.set(2, 4, 2);
          engine.scene.add(sun);
        }
        const camera = new THREE.PerspectiveCamera(55, 320 / 240, 0.1, 50);
        camera.position.set(5, 3, 5);
        camera.lookAt(0, 0, 0);
        engine.scene.add(camera);
        engine.camera = camera;

        const gi = engine.createEntity({ name: "GI Smoke" });
        gi.addComponent("global-illumination", {
          autoFit: true,
          quality: "low",
          // `?sky=N` — see the note by `skyArm`. Zero keeps every pre-existing
          // baseline byte-identical, which is why it is the shipping default.
          skyIntensity: skyArm,
          cascadeCount: 2,
          c0DirRes: 2,
          reflections: false,
          exactReflections: false,
          ao: false,
          // The src arm selects the PROBE GIZMO view, because that is the only
          // way its vertex-stage storage read gets compiled and rendered at
          // all — a gizmo material that never draws is a shader that was never
          // validated, and the eye check would be the first thing to find out.
          debugProbes: srcArm ? "src-probes" : (hybridMode ? "occupancy" : "off"),
          rayHitMode,
          rayHitProfiling: true,
        });
        engine.start();

        const deadline = performance.now() + 60_000;
        let stats = null;
        let settled = 0;
        while (performance.now() < deadline) {
          await new Promise((resolve) => setTimeout(resolve, 500));
          const system = engine.modules.get("gi")?.system;
          if (!system?.state || engine.renderSuspended || validationErrors.length) continue;
          settled++;
          stats = await system.readRayHitStats();
          if (stats?.rays > 0 &&
            (!hybridMode || stats.brickSteps > 0) &&
            (!planeMode || stats.planeTests > 0) &&
            (!exactMode || stats.complexTests > 0)) break;
          // Without `?src=1` nothing binds the counter buffer at all (SRC's
          // scaffold ray pass is the module's only profiled tracer), so waiting
          // the full minute for it to fill is waiting for something that cannot
          // happen. But this loop is ALSO the boot window every later arm
          // relies on — breaking on a fixed timer
          // shortened it from 60s to 10s and the exact-complex dynobj arm then
          // measured an occupancy field that had not voxelized yet (0 -> 0).
          // So the exit condition is the field being READY, not a stopwatch.
          if (stats?.dispatched === false && settled >= 20 && system._fieldReadyOnce) break;
        }
        // `?dynamic=1` — the DYNAMIC RECORD REFIT arm: wobble the wall so
        // GISystem promotes its slot, the chain types its bricks DynamicBrick,
        // and the per-chain tail refit claims records for them. The tail
        // cursor resets every chain, so a non-zero readback proves the refit
        // passes compiled AND dispatched on the mover's chains.
        const dynamicArm = new URLSearchParams(location.search).get("dynamic") === "1";
        let dynamicAlloc = null;
        if (dynamicArm) {
          // This arm regression-gates the VOXEL record-refit tail — the path
          // non-adoptable movers (skinned, over-budget, set overflow) still
          // take. Exact-dynamic adoption would park the wall's slot on first
          // motion and the tail would legitimately stay at zero, so the arm
          // pins the feature off. (?dynobj=1 is the adoption arm.)
          if (globalThis.__giDynamicObjects !== false) {
            throw new Error("dynamic arm: set __giDynamicObjects=false before GI builds (see the boot pin below)");
          }
          const occField = engine.modules.get("gi").system.state.volume.occupancyField;
          const dynDeadline = performance.now() + 20_000;
          while (performance.now() < dynDeadline) {
            for (let i = 0; i < 12; i++) {
              wall.position.x += 0.01 * (i % 2 ? 1 : -1); // sub-voxel wobble
              wall.updateMatrixWorld(true);
              await new Promise((resolve) => setTimeout(resolve, 50));
            }
            dynamicAlloc = await occField.readbackSurfaceAlloc(engine.renderer);
            if (dynamicAlloc?.dynamicAllocated > 0) break;
          }
          // Re-read so the limit/invalid asserts below cover the moving frames.
          stats = await engine.modules.get("gi").system.readRayHitStats();
        }
        // `?dynobj=1` — the EXACT-DYNAMIC ADOPTION arm
        // (docs/dynamic_gi_exact_dynamic_objects.md): rotate the wall so the
        // first transform change adopts it as an analytic OBB. Asserts the
        // three contract points no CPU suite can: (1) adoption happened and
        // the GPU side went live, (2) the wall's bits LEFT the world
        // occupancy (occupied-voxel count drops), (3) further rotation leaves
        // the occupancy BYTE-STABLE — the membership churn that popped
        // silhouettes is structurally gone.
        let dynObjReport = null;
        // `?dynobj=9` — MOBILITY "static" HOLDS THROUGH MOTION. The
        // load-bearing case of the mobility/trace split: every mover is
        // tested by EVERY ray, so "this never moves" has to be a promise the
        // adoption path keeps even when the transform says otherwise. The old
        // single tag could not express it — asking for exact triangles also
        // pinned the object as a mover, which is how 30 static Sponza meshes
        // ended up in the per-ray loop. A trace override rides along to prove
        // the two axes really are independent.
        if (dynObjArm === 9) {
          const system = engine.modules.get("gi").system;
          const occField = system.state.volume.occupancyField;
          const settle = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          wall.userData.giMobility = "static";
          wall.userData.giTrace = "bvh";
          const staticDeadline = performance.now() + 12_000;
          while (performance.now() < staticDeadline) {
            wall.rotation.y += 0.05;
            wall.rotation.x += 0.03;
            wall.updateMatrixWorld(true);
            await settle(50);
            if ((system._dynSet?.count() ?? 0) > 0) {
              throw new Error('dynobj=9: GI Mobility "static" adopted a moving mesh anyway — the axes are still coupled');
            }
          }
          const held = await occField.readbackStats(engine.renderer);
          if (!(held.occupiedVoxels > 0)) {
            throw new Error("dynobj=9: the static mesh left the voxel field — static keeps BOTH the field and the static BVH");
          }
          dynObjReport = { staticHeld: true, adopted: system._dynSet?.count() ?? 0, occupied: held.occupiedVoxels };
          console.log("GI-SMOKE DYNOBJ", JSON.stringify(dynObjReport));
          stats = await system.readRayHitStats();
        } else if (dynObjArm) {
          const system = engine.modules.get("gi").system;
          const occField = system.state.volume.occupancyField;
          const settle = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let mover = wall;
          if (dynObjArm >= 2 && dynObjArm <= 6) {
            // dynobj=2 torus-knot → BVH exact triangles; 3 sphere, 4 capsule,
            // 5 cylinder-frustum → the analytic default-primitive paths.
            // Added AFTER boot so the content refresh ships it like a
            // late-loading GLB.
            const geo = dynObjArm === 3 ? new THREE.SphereGeometry(0.8, 24, 16)
              : dynObjArm === 4 ? new THREE.CapsuleGeometry(0.5, 1.2, 8, 16)
              : dynObjArm === 5 ? new THREE.CylinderGeometry(0.6, 0.3, 1.6, 24)
              : new THREE.TorusKnotGeometry(0.8, 0.25, 48, 12);
            mover = new THREE.Mesh(geo, material);
            // dynobj=6: the per-mesh override — a CUSTOM mesh tagged "obb"
            // must adopt as the analytic bounding box, no BVH upload.
            if (dynObjArm === 6) mover.userData.giTrace = "obb";
            mover.position.set(1.5, 0.5, 0);
            mover.updateMatrixWorld(true);
            engine.scene.add(mover);
            await settle(2_500); // fingerprint scan + content refresh + re-voxelize
          }
          await settle(1_000);
          const before = await occField.readbackStats(engine.renderer);
          const occupiedBefore = before.occupiedVoxels;
          // dynobj=7 — the "dynamic" PIN: tag the (never-moved) wall AFTER
          // the baseline readback and assert adoption fires with ZERO motion.
          if (dynObjArm === 7) {
            mover.userData.giMobility = "dynamic";
            const eagerDeadline = performance.now() + 15_000;
            let eager = false;
            while (performance.now() < eagerDeadline) {
              await settle(250);
              if ((system._dynSet?.count() ?? 0) > 0) { eager = true; break; }
            }
            if (!eager) throw new Error("dynobj=7: the 'dynamic' pin never adopted a motionless mesh");
          }
          // dynobj=8 — REST DEMOTION. The window starts HUGE: GPU readbacks
          // stall the rotation for seconds at a time, and a short window
          // fires mid-phase — the "after" baseline then reads the already-
          // revived wall and the final assert compares equal numbers while
          // everything works (this arm's first three failures). It shortens
          // only once the baselines are taken.
          if (dynObjArm === 8) { globalThis.__giDynDemoteFrames = 1e9; globalThis.__giDynObjectsDebug = true; }
          const adoptDeadline = performance.now() + 20_000;
          let adopted = false;
          while (performance.now() < adoptDeadline) {
            mover.rotation.y += 0.05;
            mover.rotation.x += 0.03;
            mover.updateMatrixWorld(true);
            await settle(50);
            if ((system._dynSet?.count() ?? 0) > 0 && system._dynSet.pendingDispatch().length === 0 &&
                (system._dynPendingDisable?.length ?? 0) === 0) { adopted = true; break; }
          }
          if (!adopted) throw new Error("dynobj arm: the rotating mover never adopted (or the GPU side never went live)");
          // Refit-immune wall detector: the rotating 8m wall changes the
          // scene AABB and triggers auto-fit refits mid-arm, so TOTAL
          // occupancy counts are incomparable across phases (voxel sizing
          // moves under them — this arm's first four failures were all this
          // instrument trap). The wall is the only geometry above the floor
          // band, so a world-space count above y=-0.7 reads its presence
          // regardless of the current voxel size.
          const wallVoxels = async () => {
            const rb = await occField.readbackBits(engine.renderer);
            let n = 0;
            const l0 = rb.levels[0].res;
            for (let z = 0; z < l0.z; z++) for (let y = 0; y < l0.y; y++) for (let x = 0; x < l0.x; x++) {
              if (!rb.get(x, y, z, 0)) continue;
              if (rb.origin.y + (y + 0.5) * rb.voxel.y > -0.7) n++;
            }
            return n;
          };
          if (dynObjArm === 8) {
            const parked = await wallVoxels();
            console.log(`GI-SMOKE D8 postadopt wallVoxels=${parked} dispatches=${occField.stats.dispatches}`);
            if (parked > 50) throw new Error(`dynobj=8: ${parked} wall voxels survived the park`);
          }
          if (dynObjArm === 2 && !(system._dynSet.stats.meshUploadsQueued > 0)) {
            throw new Error("dynobj=2 arm: the torus adopted without a BVH upload — it took an analytic path");
          }
          if (dynObjArm >= 3 && system._dynSet.stats.meshUploadsQueued > 0) {
            throw new Error(`dynobj=${dynObjArm} arm: an analytic path queued a BVH upload — ` +
              (dynObjArm === 6 ? "the userData.giTrace=\"obb\" override was ignored" : "classification regressed"));
          }
          // Let the parked slot's purge re-voxelize land, then measure.
          for (let i = 0; i < 20; i++) { mover.rotation.y += 0.05; mover.updateMatrixWorld(true); await settle(50); }
          const mid = await occField.readbackStats(engine.renderer);
          for (let i = 0; i < 10; i++) { mover.rotation.y += 0.07; mover.rotation.z += 0.04; mover.updateMatrixWorld(true); await settle(50); }
          const after = await occField.readbackStats(engine.renderer);
          if (!(mid.occupiedVoxels < occupiedBefore)) {
            throw new Error(`dynobj arm: occupancy never dropped after adoption (${occupiedBefore} -> ${mid.occupiedVoxels}) — the mover still voxelizes`);
          }
          if (mid.occupiedVoxels !== after.occupiedVoxels) {
            throw new Error(`dynobj arm: occupancy changed under pure mover rotation (${mid.occupiedVoxels} -> ${after.occupiedVoxels}) — membership churn survives`);
          }
          dynObjReport = {
            occupiedBefore, occupiedAfter: after.occupiedVoxels,
            adopted: system._dynSet.count(), meshUploads: system._dynSet.stats.meshUploadsQueued,
            poolWords: system._dynSet.stats.poolWordsUsed,
          };
          // dynobj=8: stop moving and watch the edit-idle demotion return
          // the mesh to the voxel path (slot re-enabled, bits back).
          if (dynObjArm === 8) {
            globalThis.__giDynDemoteFrames = 120;
            const demoteDeadline = performance.now() + 30_000;
            let demoted = false;
            while (performance.now() < demoteDeadline) {
              await settle(500);
              if ((system._dynSet?.count() ?? 0) === 0) { demoted = true; break; }
            }
            if (!demoted) throw new Error("dynobj=8: the rested adoptee never demoted back to voxel");
            const backDeadline = performance.now() + 15_000;
            let backWall = 0;
            while (performance.now() < backDeadline) {
              await settle(1_000);
              backWall = await wallVoxels();
              const wp = occField.placements?.find((pl) => pl.mesh === mover);
              console.log(`GI-SMOKE D8 wallVoxels=${backWall} state=${wp ? occField.slotState?.(wp.slot) : "?"} dispatches=${occField.stats.dispatches}`);
              if (backWall > 200) break;
            }
            if (!(backWall > 200)) {
              throw new Error(
                `dynobj=8: the demoted mesh never re-voxelized (wallVoxels=${backWall}) — ` +
                `dynCount=${system._dynSet?.count()} adoptedKeys=${system._dynAdoptedKeys?.size} ` +
                `dispatches=${occField.stats.dispatches} composited=${system._compositedOnce}`,
              );
            }
            dynObjReport.demotedWallVoxels = backWall;
          }
          console.log("GI-SMOKE DYNOBJ", JSON.stringify(dynObjReport));
          stats = await system.readRayHitStats();
        }
        engine.stop();
        const bindingAudit = [];
        const state = engine.modules.get("gi")?.system?.state;
        if (state?.rayHitConfig?.activeMode !== expectedActiveMode) {
          throw new Error(`ray-hit mode ${rayHitMode} did not activate (active=${state?.rayHitConfig?.activeMode})`);
        }
        // The SRC population's kernels are NOT in `state.queue` (they are
        // dispatched off the gbuffer, ahead of it), so the audit has to be told
        // about them explicitly or the arm would audit nothing and pass.
        const auditNodes = [
          ...(state?.queue ?? []).map((node, index) => [`queue[${index}]`, node]),
          ...(state?.screen?.srcProbes?.passes ?? []).map((node, index) => [`srcProbes[${index}]`, node]),
        ];
        for (const [index, node] of auditNodes) {
          const shader = engine.renderer._nodes?.getForCompute?.(node)?.computeShader ?? "";
          const storageBindings = [...shader.matchAll(/var<storage[^>]*>/g)].length;
          if (storageBindings >= 8) {
            const names = shader.split("\n").filter((line) => line.includes("var<storage"));
            bindingAudit.push({ index, storageBindings, bytes: shader.length, names });
          }
        }
        console.log("GI-SMOKE BINDINGS", JSON.stringify(bindingAudit));

        // ── ?src=1 assertions ────────────────────────────────────────────
        let srcReport = null;
        if (srcArm) {
          const src = state?.screen?.srcProbes;
          if (!src) throw new Error("src arm: __giSrcProbes was set but no probe system was built");
          const s = await src.readStats(engine.renderer);
          srcReport = {
            dispatches: src.passes.length,
            megabytes: +(s.bytes / 1048576).toFixed(2),
            cascades: s.cascades.map((c) => ({
              live: c.live, load: +c.loadFactor.toFixed(3),
              steps: +c.meanProbeSteps.toFixed(2), failed: c.failed,
            })),
          };
          // ── THE SCAFFOLD RAY PASS (plan §12.13.5 unit 1) ────────────────
          //
          // Its own sink, not the ray-hit counters: those are shared with every
          // other profiled trace in the build, so a nonzero `rays` there does
          // not prove THIS pass ran. This buffer has exactly one writer.
          //
          // The HIT RATE is the assertion worth having. A pass that dispatched
          // but traced garbage — a zero direction, a zero-length interval, a
          // normal read out of the wrong channel — reports rays and zero hits,
          // and this scene is a floor plus a wall at c0 reach, so some rays
          // must land and some must escape. Both bounds, because 100% is the
          // signature of a trace that hits its own origin voxel.
          if (!src.deposit) {
            throw new Error("src arm: no deposit frame — the volume never reached the probe system");
          }
          const rays = s.rays;
          srcReport.rays = {
            dispatched: rays.dispatched, count: rays.rays,
            budget: s.totalRays, perPixel: s.raysPerPixel,
            deposits: rays.deposits, perRay: +rays.perRay.toFixed(3),
            clamped: rays.clamped, bins: src.binStore.binTotal,
            hitRate: +rays.hitRate.toFixed(3),
            meanT: +rays.meanT.toFixed(3), maxT: +rays.maxT.toFixed(3),
          };
          // ── THE SPLIT RULE, AS AN INEQUALITY THE SCENE CANNOT BREAK ─────
          //
          // Every ray deposits into cascades 0..k where k owns its hit, and into
          // all N on a miss. So deposits per ray is in [1, N] — never zero (even
          // a hit inside cascade 0's interval deposits there) and never more
          // than the cascade count (nothing is deposited ABOVE the owning
          // cascade, which is the rule the companion guide gets wrong).
          //
          // Both ends are real failures: 0 would mean the ancestor chain is not
          // being walked, and > N would mean the split is depositing upward.
          if (!(rays.perRay >= 1 && rays.perRay <= src.store.cascadeCount)) {
            throw new Error(
              `src arm: ${rays.perRay.toFixed(2)} deposits per ray is outside [1, ` +
              `${src.store.cascadeCount}] — the split rule or the ancestor chain is wrong`,
            );
          }
          // With no hit shading yet (Phase 5) every deposited radiance is zero,
          // so a clamp is structurally impossible. When it becomes possible this
          // assertion is what will say so, rather than the clamp quietly eating
          // energy — which is exactly the failure §12.13.4 left open.
          if (rays.clamped !== 0) {
            throw new Error(
              `src arm: ${rays.clamped} deposits hit the Lmax ceiling while hit shading is ` +
              "still zero — something is depositing radiance from somewhere",
            );
          }

          // ── THE c0-ONLY RESOLVE (plan §12.13.5 unit 4) ──────────────────
          //
          // The output is a StorageTexture, and reading one back headlessly is
          // the rig problem [[gi-harness-viewport-traps]] records — so the
          // gather writes the numbers a gate needs into a buffer alongside the
          // pixels. These four failures look identical on screen and different
          // here: no probe, every bin unknown, lit but flat, lit and varying.
          const g = s.gather;
          if (!g?.dispatched) throw new Error("src arm: the c0-only gather never dispatched");
          srcReport.gather = {
            pixels: g.pixels, unknown: g.unknown, facing: g.facing, badN: g.badNormals, lit: g.lit,
            meanLum: +g.meanLum.toFixed(4), minLum: +g.minLum.toFixed(4),
            maxLum: +g.maxLum.toFixed(4), contrast: +g.contrast.toFixed(3),
            sampled: +g.meanSampledBins.toFixed(1), totalBins: g.totalBins,
            sky: skyArm,
          };
          if (!(g.pixels > 0)) {
            throw new Error("src arm: the gather saw no pixel with a c0 probe");
          }
          // Deposits landed, so a pixel whose every bin is unknown means its
          // probe got none of them — a broken probe/bin address, not sparsity.
          // `unknown` is now the FAULT case only (the probe holds no sampled bin
          // at all); `facing` is the structural one, split out in the kernel.
          // Deposits landed this frame, so an empty probe means the bins the
          // deposit wrote and the bins the gather reads are not the same bins.
          // STRUCTURALLY IMPOSSIBLE SINCE THE VALIDITY FIX, and pinned here so
          // it stays that way: a pixel with a degenerate normal no longer gets a
          // probe at all (srcSystem's readPixel). Before that, 46% of this
          // scene's pixels had one, fired a hemisphere of rays around NaN and
          // gathered nothing.
          if (g.badNormals !== 0) {
            throw new Error(
              `src arm: ${g.badNormals}/${g.pixels} gathered pixels have a degenerate gbuffer normal — ` +
              "the validity test admitted a pixel with no geometry",
            );
          }
          if (g.unknown > g.pixels * 0.02) {
            throw new Error(
              `src arm: ${g.unknown}/${g.pixels} pixels found their probe EMPTY while ` +
              `${rays.deposits} deposits landed — the deposit and the gather disagree about addresses`,
            );
          }
          if (skyArm > 0) {
            // THE PAYOFF ASSERTION. With hit shading still zero the only term
            // is sky·transmittance, so this is ambient occlusion — and the two
            // things that must both be true are that light arrives at all, and
            // that it is NOT uniform. A flat result would mean the occlusion
            // term is doing nothing, which looks like plain ambient on screen
            // and passes every other check in this file.
            // Every pixel that has a probe should end up lit in an open scene:
            // the only way not to is a fully enclosed hemisphere, and this scene
            // has none. A shortfall here is the wrong-hemisphere effect, which
            // is REAL in general (probes are position-only) but should be zero
            // on a scene this simple.
            if (g.facing > g.pixels * 0.02) {
              throw new Error(
                `src arm: ${g.facing}/${g.pixels} pixels found their probe's bins entirely ` +
                "outside their own hemisphere on a scene with no enclosed surfaces",
              );
            }
            if (!(g.lit > 0)) {
              throw new Error(`src arm: sky=${skyArm} and not one pixel came out lit`);
            }
            if (!(g.contrast > 0.05)) {
              throw new Error(
                `src arm: irradiance is flat (min ${g.minLum.toFixed(4)}, max ` +
                `${g.maxLum.toFixed(4)}, contrast ${g.contrast.toFixed(3)}) — with no hit ` +
                "shading the only term is sky x transmittance, so no contrast means no occlusion",
              );
            }
            // A fully open hemisphere under uniform sky radiance L returns pi*L
            // (equal-area bins, Sum max(0,cos)*dOmega = pi). Anything past that
            // is energy the gather invented — a renormalization that overshoots,
            // or a solid angle counted twice.
            const ceiling = Math.PI * skyArm * 1.05;
            if (g.maxLum > ceiling) {
              throw new Error(
                `src arm: peak irradiance ${g.maxLum.toFixed(3)} exceeds pi x sky = ` +
                `${(Math.PI * skyArm).toFixed(3)} — the gather is creating energy`,
              );
            }
          } else if (g.lit !== 0) {
            // Sky off and hit shading absent means there is genuinely no light.
            // A lit pixel here is light from nowhere.
            throw new Error(
              `src arm: ${g.lit} pixels are lit with skyIntensity 0 and no hit shading — ` +
              "the gather is producing light from nothing",
            );
          }
          // ── THE BUDGET AND THE TRACER MUST AGREE ──────────────────────
          //
          // Algorithm 3 (`srcRays.js`, plan §12.13.5 unit 2) partitions
          // [0, totalRays) and hands each pixel a slice; the scaffold fires
          // exactly that slice. So the count the marcher's own atomic reports
          // and the count the global cursor allocated are the SAME NUMBER
          // arrived at from opposite ends of the frame.
          //
          // `test:gi-src-rays` proves the partition against the CPU mirror on a
          // synthetic gbuffer. What it cannot see is the real one: a pixel whose
          // probe exists but whose range never arrived keeps SLOT_EMPTY and
          // simply does not fire, which is silent everywhere except here.
          if (rays.rays !== s.totalRays) {
            throw new Error(
              `src arm: the budget and the tracer disagree — Alg. 3 allocated ${s.totalRays} rays, ` +
              `the marcher fired ${rays.rays}. Pixels are being dropped between the two.`,
            );
          }
          if (!rays.dispatched || !(rays.rays > 0)) {
            throw new Error(`src arm: the scaffold ray pass traced nothing (dispatched=${rays.dispatched}, rays=${rays.rays})`);
          }
          if (!(rays.hitRate > 0)) {
            throw new Error("src arm: every scaffold ray missed — the medium, the direction or the interval is wrong");
          }
          if (rays.hitRate >= 1) {
            throw new Error("src arm: every scaffold ray hit — rays are almost certainly hitting their own origin voxel");
          }
          if (!(rays.maxT > 0)) throw new Error("src arm: every hit was at distance zero");
          // The gizmos must have RENDERED, not merely been constructed. Their
          // vertex stage reads the probe table out of a storage buffer, which
          // is the one thing in this file that a compute-only gate cannot
          // cover — and a vertex shader that fails to compile shows up as a
          // validation error, which the check after this loop catches.
          const giz = src.gizmos;
          if (!giz?.meshes?.length) throw new Error("src arm: no probe gizmos were built");
          if (!giz.group.parent) throw new Error("src arm: the gizmo group was never added to the scene");
          for (const mesh of giz.meshes) {
            if (!mesh.visible) throw new Error(`src arm: ${mesh.name} stayed hidden — the debug view never engaged`);
            if (!mesh.userData.__giDebug) {
              throw new Error(`src arm: ${mesh.name} is missing __giDebug — it would voxelize into the field it draws`);
            }
          }
          srcReport.gizmos = giz.meshes.map((m) => m.count);

          // ── DID THEY PUT PIXELS ON THE SCREEN? ────────────────────────────
          //
          // Everything above proves the gizmos exist, are visible, are in the
          // scene and compile without a validation error. None of that is the
          // same as RASTERIZING: a `positionNode` that resolves to NaN, an
          // instance matrix left at zeros, or a radius that collapses for every
          // probe all produce a silently empty draw. So render the same frame
          // twice into an offscreen target, once with the gizmos hidden and
          // once shown, and require the images to differ. This is the closest a
          // headless harness gets to the eye check, and it is the difference
          // between "the debug view is wired" and "the debug view works".
          const rt = new THREE.RenderTarget(96, 96, { depthBuffer: true });
          const shot = async () => {
            const prev = engine.renderer.getRenderTarget();
            engine.renderer.setRenderTarget(rt);
            await engine.renderer.renderAsync(engine.scene, engine.camera);
            // 6th arg is the TEXTURE INDEX, not an output buffer — the pixels
            // are the return value.
            const buf = await engine.renderer.readRenderTargetPixelsAsync(rt, 0, 0, 96, 96, 0);
            engine.renderer.setRenderTarget(prev);
            return buf;
          };
          giz.setVisible(false);
          const without = await shot();
          giz.setVisible(true);
          const withGizmos = await shot();
          let changed = 0;
          for (let i = 0; i < without.length; i += 4) {
            if (Math.abs(without[i] - withGizmos[i]) > 8 ||
              Math.abs(without[i + 1] - withGizmos[i + 1]) > 8 ||
              Math.abs(without[i + 2] - withGizmos[i + 2]) > 8) changed++;
          }
          rt.dispose();
          const total = 96 * 96;
          srcReport.gizmoPixels = changed;
          srcReport.gizmoCoverage = +(changed / total).toFixed(3);
          if (changed === 0) {
            throw new Error(
              "src arm: showing the probe gizmos changed ZERO pixels — they compile, they are " +
              "visible and they are in the scene, so the draw itself produced nothing " +
              "(NaN position, zero radius, or uninitialized instance matrices)",
            );
          }
          // AND THEY MUST NOT PAINT THE WHOLE FRAME. The first version of this
          // check reported 9216/9216: the radius was proportional to probe
          // spacing with no ceiling, so a cascade-3 LOD-8 probe was a
          // 125-metre ball around the camera. Total coverage is the same
          // failure as zero coverage — an overlay that hides the scene it
          // annotates — and it passes a "did anything draw" test.
          if (changed > total * 0.9) {
            throw new Error(
              `src arm: the probe gizmos cover ${changed}/${total} pixels — they are painting ` +
              "over the scene rather than annotating it (unbounded radius at the coarse cascades)",
            );
          }
          console.log("GI-SMOKE SRC", JSON.stringify(srcReport));
          // The controls first, in the order a failure is worth distinguishing.
          if (!(s.cascades[0].live > 0)) {
            throw new Error(
              "src arm: cascade 0 has no probes — the gbuffer read, the LOD selection or " +
              "the key window is wrong (a scene with geometry always produces some)",
            );
          }
          for (const c of s.cascades) {
            if (c.failed > 0) {
              throw new Error(
                `src arm: cascade ${c.cascade} dropped ${c.failed} inserts at load ` +
                `${c.loadFactor.toFixed(2)} — those probes do not exist`,
              );
            }
            if (c.loadFactor > 0.7) {
              throw new Error(
                `src arm: cascade ${c.cascade} hash load ${c.loadFactor.toFixed(2)} — ` +
                "open addressing degrades sharply past 0.7 and drops follow",
              );
            }
          }
          // ── NOT ASSERTED HERE: that probe counts THIN with cascade ────────
          //
          // The obvious invariant — each cascade holds fewer probes than the
          // one below, since spacing doubles and each child inserts exactly one
          // parent — is true WITHIN A FRAME and false across frames, and this
          // arm measured it false (c0 12, c1 18) before the reason was clear.
          //
          // Retirement cascades with a one-lifetime LAG PER LEVEL. A c0 probe
          // that no pixel sees is still ALIVE for PROBE_MAX_AGE frames, and
          // while it is alive the ladder keeps inserting its parent, so the
          // parent's age keeps resetting. The parent only starts aging when its
          // LAST child retires, and its own parent only starts after that — so
          // c3 outlives its c0 descendant by three full lifetimes. That is the
          // price of keeping every ancestor chain complete for a probe's whole
          // life, which `test:gi-src-populate` asserts and which a split deposit
          // requires, so it is correct rather than merely tolerable.
          //
          // The structural claim (the ladder inserts at the PARENT's spacing)
          // therefore lives in `test:gi-src-populate`, where a fixed camera and
          // a key-set comparison against the CPU mirror can state it exactly.
          // What this arm can honestly check is that every cascade got
          // populated at all — a ladder that silently inserted nothing above c0
          // is the failure that would otherwise reach the eye check.
          for (let c = 1; c < s.cascades.length; c++) {
            if (!(s.cascades[c].live > 0)) {
              throw new Error(
                `src arm: cascade ${c} has no probes while cascade ${c - 1} has ` +
                `${s.cascades[c - 1].live} — the ladder stopped climbing`,
              );
            }
          }
        }
        if (validationErrors.length) throw new Error(validationErrors.join(" | "));
        // ── WHO FEEDS THE TRAVERSAL COUNTERS, AND WHEN ────────────────────
        //
        // Every assertion below measures the ray-hit PROFILING counters, and the
        // module has exactly one profiled trace: `srcTrace.js`, reached through
        // the SRC scaffold ray pass. So the counters are fed if and only if the
        // SRC arm is on — which means `?src=1` is not merely allowed to demand
        // them, it is REQUIRED to. The leniency below is now scoped to the arms
        // where nothing traces at all, and it is the deletion §12.13.5 unit 1
        // asks for: what remains is not "the interregnum", it is the honest
        // statement that a build with SRC compiled out has no profiled tracer.
        //
        // Before the scaffold landed this leniency covered EVERY arm, and the
        // alternative it replaced was worse — failing all of them on "counters
        // stayed at zero", which reads as a traversal regression and hid the
        // binding audit, the dynobj arm and the validation check behind it.
        // `?requirerays=1` still pins the demand on explicitly.
        const raysRequired =
          srcArm || new URLSearchParams(location.search).get("requirerays") === "1";
        const countersFed = stats?.dispatched !== false && (stats?.rays ?? 0) > 0;
        if (!countersFed && raysRequired) {
          throw new Error(
            `traversal counters are unfed (dispatched=${stats?.dispatched}, ` +
            `rays=${stats?.rays ?? 0}) — nothing traced with profiling on` +
            (srcArm ? " despite ?src=1, so the scaffold ray pass never dispatched" : ""),
          );
        }
        if (!countersFed) {
          console.log(
            "GI-SMOKE NOTE traversal counters unfed (SRC is the only profiled tracer and this " +
            "arm has it compiled out) — the mode-specific step/plane/triangle assertions are SKIPPED",
          );
        }
        // Gated on SRC's RUNG, not the engine's mode — see `srcPlaneTrace`.
        if (countersFed) {
          if (srcPlaneTrace && !stats.brickSteps) {
            throw new Error("hybrid local-brick traversal counters stayed at zero");
          }
          if (srcPlaneTrace && !stats.planeTests) {
            throw new Error("plane-mode traversal never consulted a surface record");
          }
          if (srcPlaneTrace && !stats.planeAccepts) {
            throw new Error("plane-mode traversal never accepted a plane hit");
          }
          if (srcExactTrace && !stats.complexTests) {
            throw new Error("exact-complex traversal never entered a complex cell");
          }
          if (srcExactTrace && !stats.triangleTests) {
            throw new Error("exact-complex traversal never tested a triangle");
          }
        }
        let surfaceAlloc = null;
        if (planeMode) {
          surfaceAlloc = await engine.modules.get("gi").system.state.volume
            .occupancyField.readbackSurfaceAlloc(engine.renderer);
          if (!surfaceAlloc?.allocated) throw new Error("surface-record pool allocated zero records");
          if (surfaceAlloc.overflowBricks) {
            throw new Error(`surface-record pool overflowed on ${surfaceAlloc.overflowBricks} bricks in a tiny scene`);
          }
        }
        // Same interregnum rule as the mode assertions above: every one of
        // these reads the traversal counters, and structural zeros are not
        // measured zeros. `skip=0`'s "still executed N coarse levels" would
        // even PASS on unfed counters, which is worse than failing.
        if (countersFed) {
          // ── A RATE, NOT AN ABSOLUTE ZERO, AND THE MEASUREMENT THAT FORCED IT ──
          //
          // This was `!== 0` for the dense backend, whose profiled rays were
          // short INTERVAL rays. SRC's are full-length and hemispherical from
          // every pixel, so a few are tangent to the surface they were born on
          // by construction — and occupancyField's own note says exhaustion
          // "leaks worst exactly where the DDA descends most: a light raking
          // along a floor or wall". Those rays fail CLOSED, which is designed.
          //
          // It is a rate rather than a budget problem, and that was measured
          // rather than assumed: the count is 0 or 1 out of ~10,400 rays and is
          // INSENSITIVE to the ceiling (1 at 192 steps, still 1 at 256), which
          // is what rules out "the ray is too long". The bound stays tight
          // enough that a real traversal regression still trips it.
          const exitRate = stats.rays > 0 ? stats.stepLimitExits / stats.rays : 0;
          if (exitRate > 0.0005) {
            throw new Error(
              `GI traversal exhausted its step limit ${stats.stepLimitExits} times ` +
              `in ${stats.rays} rays (${(exitRate * 100).toFixed(4)}%, budget 0.05%)`,
            );
          }
          if (stats.macroStepLimitExits !== 0 || stats.brickStepLimitExits !== 0) {
            throw new Error(`hybrid traversal limit detail macro=${stats.macroStepLimitExits} brick=${stats.brickStepLimitExits}`);
          }
          if (stats.invalidNumerics !== 0) throw new Error(`GI traversal produced ${stats.invalidNumerics} invalid numeric results`);
          // The ride was always-on and never measured; these three make the A/B
          // real — that the skip engages, that it actually advances through
          // empty space (descend-only would be a ride that never pays), and
          // that `skip=0` compiled the coarse levels OUT rather than predicating
          // them away.
          if (srcPlaneTrace && coarseSkip && !stats.coarseSteps) {
            throw new Error("coarse pyramid ride never engaged");
          }
          if (srcPlaneTrace && coarseSkip && !(stats.coarseSkipsL3 + stats.coarseSkipsL4)) {
            throw new Error("coarse skip never advanced through empty space");
          }
          if (srcPlaneTrace && !coarseSkip && stats.coarseSteps !== 0) {
            throw new Error(`skip=0 arm still executed ${stats.coarseSteps} coarse levels`);
          }
        }
        if (dynamicArm) {
          if (!planeMode) throw new Error("dynamic arm needs a plane-family mode (records off otherwise)");
          if (!dynamicAlloc?.dynamicAllocated) {
            throw new Error("dynamic arm: the record tail never allocated for the mover's bricks");
          }
          if (dynamicAlloc.dynamicOverflowBricks) {
            throw new Error(`dynamic arm: tail overflowed on ${dynamicAlloc.dynamicOverflowBricks} bricks in a tiny scene`);
          }
          // Exact mode: the mover's corner/edge cells fail the simple fit and
          // must claim DYNAMIC triangle ranges — a zero here means rotated
          // movers still cast voxel-box silhouettes.
          if (exactMode && !dynamicAlloc.dynamicTriangles) {
            throw new Error("dynamic arm: no dynamic exact triangles claimed for the mover's edge cells");
          }
          console.log(
            `GI-SMOKE DYNAMIC tail=${dynamicAlloc.dynamicAllocated}/${dynamicAlloc.dynamicCapacity} ` +
            `dynTris=${dynamicAlloc.dynamicTriangles ?? 0}/${dynamicAlloc.dynamicTriangleCapacity ?? 0} overflow=0`,
          );
        }
        if (lightShadowArm) {
          // The claim is only proven by the artifacts it leaves: a custom
          // shadowNode on the component's light AND the pen-variant WGSL
          // (name suffix "p") present in a composed compute shader.
          const stash = globalThis.__GI_SMOKE_SUN__ ?? {};
          const comp = stash.comp ?? stash.ent?.getComponent?.("light");
          const sunLight = comp?.light;
          if (!sunLight?.shadow?.shadowNode) throw new Error("lightshadow arm: the sun never received a gi shadowNode");
          let penVariantSeen = false;
          for (const node of state?.queue ?? []) {
            const shader = engine.renderer._nodes?.getForCompute?.(node)?.computeShader ?? "";
            if (/giHybridPlaneTrace\d+\w*p\w*\(/.test(shader) || shader.includes("giHybridPlaneTrace192cp")) {
              penVariantSeen = true;
              break;
            }
          }
          if (planeMode && !penVariantSeen && !staticBvhArm) {
            throw new Error("lightshadow arm: the pen plane-trace variant never compiled into the resolve");
          }
          if (staticBvhArm) {
            const m = engine.modules.get("gi").system.state.screen?.lightShadow?.marcher ?? "";
            if (!/static-bvh8/.test(m)) {
              throw new Error(`staticbvh arm: unexpected marcher "${m}" — the static-BVH arm never engaged`);
            }
          }
          // SOFT ARM: the default is the stochastic sun-disc sample (exact
          // march along a jittered direction — no extra WGSL function), with
          // the density cone behind __giConeShadowDensity. Assert the bundle
          // says so, and that the density pyramid still holds REAL fractions
          // for the hatched arm — cross-checked against the level-0 bits (a
          // level-1 cell's byte is round(255·popcount(children)/8) exactly).
          const marcher = engine.modules.get("gi").system.state.screen?.lightShadow?.marcher ?? "";
          if (analyticArm ? !/analytic-width/.test(marcher) : !/sun-disc|density-cone/.test(marcher)) {
            throw new Error(`lightshadow arm: unexpected soft-shadow marcher "${marcher}"`);
          }
          const occField = engine.modules.get("gi").system.state.volume.occupancyField;
          const rb = await occField.readbackBits(engine.renderer);
          const d1 = occField.densityLayout.levels[0];
          let densityCells = 0, densityMismatches = 0, partialCells = 0;
          for (let z = 0; z < d1.res.z; z++) {
            for (let y = 0; y < d1.res.y; y++) {
              for (let x = 0; x < d1.res.x; x++) {
                let count = 0;
                for (let dz = 0; dz < 2; dz++) for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) {
                  count += rb.get(x * 2 + dx, y * 2 + dy, z * 2 + dz, 0);
                }
                const expected = Math.floor((count * 255 + 4) / 8);
                const got = rb.getDensity(x, y, z, 1);
                if (count > 0) densityCells++;
                if (count > 0 && count < 8) partialCells++;
                if (got !== expected) densityMismatches++;
              }
            }
          }
          if (densityMismatches) {
            throw new Error(`lightshadow arm: ${densityMismatches} density cells disagree with the level-0 bits`);
          }
          if (!densityCells) throw new Error("lightshadow arm: density pyramid is empty over occupied geometry");
          if (!partialCells) {
            throw new Error("lightshadow arm: no PARTIAL density cells — the fraction channel is behaving like the OR bit");
          }
          // TEMPORAL REPROJECTION CONVENTION GATE: with a static camera the
          // filter pass's history reprojection must land back on the same
          // texel (position-validated) — the debug counter counts valid
          // pixels per frame. A wrong NDC→texel y-flip reads ~0 forever,
          // which would silently disable accumulation (grain looks like
          // "the filter does nothing"), so this asserts the delta across a
          // settle window covers at least one frame's worth of geometry.
          const filterPass = engine.modules.get("gi").system.state.screen?.lightShadowFilterPass;
          if (!filterPass) throw new Error("lightshadow arm: filter pass missing from the screen bundle");
          if (analyticArm) {
            // ANALYTIC-WIDTH TOPOLOGY GATE: no temporal chain may exist —
            // one trace pass, one history-free filter straight into the
            // sampled target — and the width probe's WGSL function must have
            // compiled into the shadow pass (an invalid pipeline there
            // silently drops the whole compute batch, so presence of the
            // function in the composed shader is the compile gate).
            const sb = engine.modules.get("gi").system.state.screen;
            if (sb.lightShadowHistoryPass || sb.lightShadowPostPass) {
              throw new Error("analytic arm: temporal passes were built despite __giShadowAnalyticWidth");
            }
            if (filterPass.temporalCounter) {
              throw new Error("analytic arm: filter pass compiled the temporal counter (history should be null)");
            }
            const shadowShader = engine.renderer._nodes?.getForCompute?.(sb.lightShadowPass.compute)?.computeShader ?? "";
            // Under the kind-map paint the trace returns before the width
            // probe multiply, so the probe legitimately never enters the graph.
            if (!kindMap && !/giShadowWidthProbe/.test(shadowShader)) {
              throw new Error("analytic arm: the width probe never compiled into the shadow pass");
            }
            console.log(
              `GI-SMOKE LIGHTSHADOW-ANALYTIC marcher="${marcher}" widthProbe=compiled ` +
              `temporalPasses=none pen-variant=${penVariantSeen ? "compiled" : "n/a (non-plane mode)"}`,
            );
          } else {
          if (!filterPass.temporalCounter) throw new Error("lightshadow arm: temporal debug counter not compiled");
          const readValid = async () =>
            Array.from(new Uint32Array(await engine.renderer.getArrayBufferAsync(filterPass.temporalCounter.value)));
          const screenBundle = engine.modules.get("gi").system.state.screen;
          const shadowPixels = screenBundle.shadowWidth * screenBundle.shadowHeight;
          // GROUND-TRUTH CONVENTION CHECK (temporary diagnostic): read back a
          // gbuffer row, project each texel's stored world position with the
          // camera VP in JS, and report where it lands vs its own pixel.
          {
            const gb = screenBundle.gbuffer;
            const W = screenBundle.width, H = screenBundle.height;
            const row = Math.floor(H / 2);
            const pixels = await engine.renderer.readRenderTargetPixelsAsync(gb.rt, 0, row, W, 1, 0);
            const cam = engine.camera;
            cam.updateMatrixWorld(true);
            const vp = new THREE.Matrix4().multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse);
            const offsets = [];
            for (let x = 0; x < W; x += 13) {
              const w = pixels[x * 4 + 3];
              if (w < 0.5) continue;
              const p = new THREE.Vector4(pixels[x * 4], pixels[x * 4 + 1], pixels[x * 4 + 2], 1).applyMatrix4(vp);
              if (p.w <= 0) continue;
              const hx = (p.x / p.w * 0.5 + 0.5) * W;
              const hyUp = (p.y / p.w * 0.5 + 0.5) * H;
              const hyDown = (0.5 - p.y / p.w * 0.5) * H;
              offsets.push(`x=${x}: hx=${hx.toFixed(1)} hyUp=${hyUp.toFixed(1)} hyDown=${hyDown.toFixed(1)} (row=${row})`);
            }
            console.log(`GI-SMOKE REPROJ-TRUTH ${offsets.slice(0, 6).join(" | ")}`);
          }
          // The page stopped the engine after the stats settle (line ~162) —
          // every other assert reads state ACCUMULATED during boot, but this
          // gate needs live frames. Restart for the window, stop again after.
          engine.start();
          const v0 = await readValid();
          await new Promise((resolve) => setTimeout(resolve, 800));
          const v1 = await readValid();
          engine.stop();
          const funnel = v1.map((v, i) => v - v0[i]);
          if (funnel[0] < shadowPixels * 0.5) {
            throw new Error(
              `lightshadow arm: temporal reprojection nearly never validates — window delta: ` +
              `threads=${funnel[1]} inBounds=${funnel[2]} histGeom=${funnel[3]} valid=${funnel[0]} ` +
              `of ${shadowPixels}px/frame; absolute v0=[${v0}] v1=[${v1}]`,
            );
          }
          console.log(
            `GI-SMOKE LIGHTSHADOW pen-variant=${penVariantSeen ? "compiled" : "n/a (non-plane mode)"} ` +
            `marcher="${marcher}" densityCells=${densityCells} partial=${partialCells} mismatches=0 ` +
            `temporalValid=${funnel[0]} threads=${funnel[1]} inBounds=${funnel[2]} loose=${funnel[3]} of ${shadowPixels}px/frame over the window`,
          );
          }
          if (kindMap) {
            // Read the RAW trace target (pre-filter — the bilateral would
            // smear the class bytes). The paint is deterministic per frame,
            // so the boot frames' content is already final; run a short live
            // window anyway so the read post-dates full field convergence.
            const framesBefore = preRenderProbe.count;
            engine.start();
            await new Promise((resolve) => setTimeout(resolve, 1200));
            engine.stop();
            const framesInWindow = preRenderProbe.count - framesBefore;
            const sb2 = engine.modules.get("gi").system.state.screen;
            const W = sb2.shadowWidth, H = sb2.shadowHeight;
            const strideBytes = Math.ceil((W * 4) / 256) * 256;
            const data = await engine.renderer.backend.copyTextureToBuffer(sb2.targets.lightShadowRaw, 0, 0, W, H);
            const names = { 0: "miss", 32: "plane", 64: "tri", 96: "box", 128: "macroExhaust", 159: "brickLimit", 191: "invalidBrick", 255: "noGeom" };
            const anchors = [0, 32, 64, 96, 128, 159, 191, 255];
            const buckets = {};
            for (let y = 0; y < H; y++) {
              const row = y * strideBytes;
              for (let x = 0; x < W; x++) {
                const b = data[row + x * 4];
                let best = 255, bd = 1e9;
                for (const k of anchors) { const dd = Math.abs(b - k); if (dd < bd) { bd = dd; best = k; } }
                const key = bd > 2 ? `odd(${b})` : names[best];
                buckets[key] = (buckets[key] ?? 0) + 1;
              }
            }
            console.log(`GI-SMOKE KINDMAP ${W}x${H} ${JSON.stringify(buckets)}`);
            // Diagnostics for an all-zero map: is the pass in the live queue,
            // and does the FILTERED target differ from raw?
            const dataF = await engine.renderer.backend.copyTextureToBuffer(sb2.targets.lightShadow, 0, 0, W, H);
            let rawNonZero = 0, filtNonZero = 0;
            for (let y = 0; y < H; y++) {
              const row = y * strideBytes;
              for (let x = 0; x < W; x++) {
                if (data[row + x * 4] !== 0) rawNonZero++;
                if (dataF[row + x * 4] !== 0) filtNonZero++;
              }
            }
            const st = engine.modules.get("gi").system.state;
            // Readback-health control: the gbuffer position texture PROVABLY
            // holds data (the reproj-truth block reads it via
            // readRenderTargetPixelsAsync). If THIS path reads it as zeros,
            // copyTextureToBuffer is the broken link, not the shadow pass.
            let gbNonZero = 0;
            try {
              const gbTex = sb2.gbuffer?.position ?? sb2.gbuffer?.rt?.textures?.[0];
              if (gbTex) {
                const gdata = await engine.renderer.backend.copyTextureToBuffer(gbTex, 0, 0, 32, 32);
                for (let i = 0; i < gdata.length; i++) if (gdata[i] !== 0) gbNonZero++;
              }
            } catch (err) {
              console.log(`GI-SMOKE KINDMAP-DIAG gbuffer readback threw: ${err?.message ?? err}`);
            }
            console.log(
              `GI-SMOKE KINDMAP-DIAG frames=${framesInWindow} rawNonZero=${rawNonZero} filtNonZero=${filtNonZero} ` +
              `gbNonZero=${gbNonZero} pendingPipes=${globalThis.__giPendingComputePipelines?.size ?? "?"} ` +
              `passInQueue=${st.queue?.includes?.(st.screen?.lightShadowPass?.compute) ?? "?"} ` +
              `widthU=${st.screen?.lightShadowPass?.widthU?.value ?? "?"} shadowWH=${sb2.shadowWidth}x${sb2.shadowHeight} ` +
              `texWH=${sb2.targets?.lightShadowRaw?.image?.width ?? "?"}x${sb2.targets?.lightShadowRaw?.image?.height ?? "?"} ` +
              `marcher="${st.screen?.lightShadow?.marcher ?? ""}" slots=${st.screen?.lightShadow?.slots?.length ?? 0}`,
            );
            // Decisive: dispatch the shadow pass OURSELVES and re-read. Content
            // appearing = the tick never dispatches it; still-zero = the store
            // itself is dead (dropped batch / dead branch).
            try {
              await engine.renderer.computeAsync(st.screen.lightShadowPass.compute);
              const data2 = await engine.renderer.backend.copyTextureToBuffer(sb2.targets.lightShadowRaw, 0, 0, W, H);
              let nz2 = 0;
              const buckets2 = {};
              for (let y = 0; y < H; y++) {
                const row = y * strideBytes;
                for (let x = 0; x < W; x++) {
                  const b = data2[row + x * 4];
                  if (b !== 0) nz2++;
                  let best = 255, bd = 1e9;
                  for (const k of anchors) { const dd = Math.abs(b - k); if (dd < bd) { bd = dd; best = k; } }
                  const key = bd > 2 ? `odd(${b})` : names[best];
                  buckets2[key] = (buckets2[key] ?? 0) + 1;
                }
              }
              console.log(`GI-SMOKE KINDMAP-MANUAL nonZero=${nz2} ${JSON.stringify(buckets2)}`);
            } catch (err) {
              console.log(`GI-SMOKE KINDMAP-MANUAL threw: ${err?.message ?? err}`);
            }
          }
        }
        globalThis.__GI_SMOKE_RESULT__ = {
          pass: true,
          storageLimit: device.limits.maxStorageBuffersPerShaderStage,
          aggregateGpuMs: engine.stats.readout.gpuMs,
          stats,
          surfaceAlloc,
          bindingAudit,
          srcProbes: srcReport,
        };
        console.log(
          `GI-SMOKE PASS storage=8 mode=${rayHitMode} rays=${stats.rays} ` +
          `avgMacro=${stats.averageMacroSteps.toFixed(2)} avgBrick=${stats.averageBrickSteps.toFixed(2)} ` +
          `maxMacro=${stats.maxMacroSteps} maxBrick=${stats.maxBrickSteps} ` +
          (hybridMode
            ? `coarse=${stats.coarseSteps} skipL3=${stats.coarseSkipsL3} ` +
              `skipL4=${stats.coarseSkipsL4} descends=${stats.coarseDescends} ` +
              `skip=${coarseSkip ? "on" : "off"} `
            : "") +
          (planeMode
            ? `planeTests=${stats.planeTests} planeAccepts=${stats.planeAccepts} ` +
              `planeRejects=${stats.planeRejects} boxFallbacks=${stats.surfaceFallbacks} ` +
              `surfRecords=${surfaceAlloc.allocated}/${surfaceAlloc.capacity} `
            : "") +
          (exactMode
            ? `complexTests=${stats.complexTests} triTests=${stats.triangleTests} ` +
              `complexAccepts=${stats.complexAccepts} complexMisses=${stats.complexMisses} ` +
              `poolTris=${surfaceAlloc.triangles ?? 0} complexOverflow=${surfaceAlloc.complexOverflowCells ?? 0} `
            : "") +
          `limitExits=0 invalid=0 aggregateGpuMs=${engine.stats.readout.gpuMs.toFixed(2)}`,
        );
      } catch (error) {
        fail(error);
      }
    </script>
  </body>
