<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SRC ray budget gate — createSrcRayFrame vs assignRays</title>
    <style>html,body{margin:0;background:#111;color:#ddd;font:13px monospace}canvas{display:none}</style>
  </head>
  <body>
    <canvas id="view" width="16" height="16"></canvas>
    <pre id="log"></pre>
    <script type="module">
      // ══ THE PHASE-2 UNIT-2 GATE: ALGORITHM 3, WITHOUT THE ENGINE ═════════
      //
      // Same shape as `gi-src-populate.html` and for the same reasons — its own
      // `WebGPURenderer`, a synthetic gbuffer in a storage buffer, no engine, no
      // scene. The population runs first because the ray budget is a function of
      // it, and then `createSrcRayFrame` is diffed against `srcRef.js`'s
      // `assignRays`.
      //
      // ══ WHAT CAN AND CANNOT BE COMPARED ═════════════════════════════════
      //
      // NOT the offsets. The GPU allocates them with atomic cursors in scheduler
      // order and the mirror walks its probes in table order, so the same probe
      // gets a different offset in the two — by construction, on every run, and
      // even between two runs of the GPU. A gate comparing offsets would fail
      // forever for a reason that is not a bug (plan §12.13.3).
      //
      // What IS comparable, and what Alg. 3 actually promises:
      //
      //   counts     per-probe ray counts, matched by KEY. A probe's count is
      //              the sum of its children's, and at c0 the sum of its pixels'
      //              — deterministic, so this is an exact match.
      //   total      the length of the partition. One number, exact.
      //   partition  every probe's [offset, offset+count) at the top cascade
      //              tiles [0, total) with no gap and no overlap; and within
      //              every parent, its children tile ITS range the same way.
      //              This is the property the offsets exist to provide, and it
      //              is checkable without agreeing on any single offset.
      //   pixels     every pixel's slice lies inside its own c0 probe's segment,
      //              and the pixel slices tile that segment exactly.
      //   contiguity a probe's rays are a CONTIGUOUS run of the R2 sequence —
      //              which is the entire reason for the algorithm, and would be
      //              satisfied vacuously by a wrong-but-tidy allocator, so it is
      //              checked together with the counts rather than alone.
      //   reruns     two runs of the same frame may assign different indices but
      //              must produce the same COUNTS and the same total. A rerun
      //              that changes the total is an atomics race.
      //
      // Run: node scripts/run-gi-src-rays-test.mjs
      const out = document.querySelector("#log");
      const say = (line) => { out.textContent += line + "\n"; };
      let failures = 0;
      const check = (label, ok, detail = "") => {
        say(`  ${ok ? "PASS" : "FAIL"} ${label}${detail ? ` — ${detail}` : ""}`);
        if (!ok) failures++;
      };
      const fail = (error) => {
        console.error("SRC-RAYS FAIL", error?.stack ?? error?.message ?? String(error));
        globalThis.__SRC_RAYS_RESULT__ = {
          pass: false, error: error?.message ?? String(error), text: out.textContent,
        };
      };
      globalThis.addEventListener("error", (event) => fail(event.error ?? event.message));
      globalThis.addEventListener("unhandledrejection", (event) => fail(event.reason));

      try {
        const THREE = await import("three/webgpu");
        const TSL = await import("three/tsl");
        const cfgMod = await import("/src/modules/gi/srcConfig.js");
        const ref = await import("/src/modules/gi/srcRef.js");
        const P = await import("/src/modules/gi/srcProbes.js");
        const R = await import("/src/modules/gi/srcRays.js");

        const { instancedArray, uniform, vec3 } = TSL;

        const renderer = new THREE.WebGPURenderer({ canvas: document.querySelector("#view") });
        await renderer.init();
        const device = renderer.backend.device;
        const validationErrors = [];
        device.addEventListener?.("uncapturederror", (event) => {
          validationErrors.push(event.error?.message ?? String(event.error));
          console.error("WebGPU validation error:", validationErrors.at(-1));
        });

        const rng = (() => {
          let s = 0x9e3779b9 >>> 0;
          return () => {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        })();

        const S0 = 0.5;
        const CAM = [1.25, 1.6, -0.75];
        const ANCHOR = [0.37, -1.21, 2.93];
        // > 1 ON PURPOSE. With one ray per pixel a probe's count equals its pixel
        // count and an implementation that forgot to multiply would pass every
        // arm below. Two is the shipping value at high/ultra anyway.
        const RAYS_PER_PIXEL = 2;

        // The same pixel set as the population gate: a dense clustered room (the
        // contention pattern — many pixels per probe, which is what makes the c0
        // counts worth checking at all) plus one shell per LOD.
        const pixels = [];
        const addPixel = (p) => pixels.push({ position: p, normal: [0, 1, 0] });
        for (let i = 0; i < 3000; i++) {
          const u = (rng() - 0.5) * 16;
          const v = (rng() - 0.5) * 16;
          const face = Math.floor(rng() * 5);
          if (face === 0) addPixel([u, -1, v]);
          else if (face === 1) addPixel([u, 5, v]);
          else if (face === 2) addPixel([-8, v * 0.4 + 1, u]);
          else if (face === 3) addPixel([8, v * 0.4 + 1, u]);
          else addPixel([u, v * 0.4 + 1, 8]);
        }
        for (let lod = 0; lod < 9; lod++) {
          // The law's own inverse — see gi-src-populate.html's note.
          const r = cfgMod.lodRadius(lod, S0) * 1.35;
          for (let k = 0; k < 220; k++) {
            const axis = Math.floor(rng() * 3);
            const sign = rng() < 0.5 ? -1 : 1;
            const a = (rng() * 2 - 1) * r;
            const b = (rng() * 2 - 1) * r;
            const p = [0, 0, 0];
            p[axis] = sign * r;
            p[(axis + 1) % 3] = a;
            p[(axis + 2) % 3] = b;
            addPixel([p[0] + CAM[0], p[1] + CAM[1], p[2] + CAM[2]]);
          }
        }
        const INVALID_EVERY = 17;
        const PIXELS = pixels.length;
        const valid = new Uint8Array(PIXELS).fill(1);
        for (let i = 0; i < PIXELS; i += INVALID_EVERY) valid[i] = 0;

        const q = new Float32Array(1);
        const f32 = (v) => { q[0] = v; return q[0]; };
        for (const px of pixels) px.position = px.position.map(f32);

        const positions = new Float32Array(PIXELS * 4);
        for (let i = 0; i < PIXELS; i++) {
          positions[i * 4] = pixels[i].position[0];
          positions[i * 4 + 1] = pixels[i].position[1];
          positions[i * 4 + 2] = pixels[i].position[2];
          positions[i * 4 + 3] = valid[i];
        }

        // ── population, then the ray budget on top of it ──────────────────
        const store = P.createSrcProbeStore({ c0Probes: 16384, cascadeCount: cfgMod.CASCADE_COUNT });
        const posBuf = instancedArray(positions, "vec4");
        const cameraU = uniform(new THREE.Vector3(...CAM));
        const anchorU = uniform(new THREE.Vector3(...ANCHOR));

        const frame = P.createSrcProbeFrame(store, {
          spacing0: S0,
          camera: vec3(cameraU),
          anchor: vec3(anchorU),
          pixelCount: PIXELS,
          readPixel: (i) => {
            const t = posBuf.element(i).toVar();
            return { position: t.xyz, valid: t.w.greaterThan(0.5) };
          },
        });
        const rayStore = R.createSrcRayStore(store, { pixelCount: PIXELS });
        const rayFrame = R.createSrcRayFrame(store, rayStore, {
          pixelProbe: frame.pixelProbe,
          raysPerPixel: RAYS_PER_PIXEL,
        });

        say(`pixels ${PIXELS} (${PIXELS - valid.reduce((a, b) => a + b, 0)} invalid)  ` +
          `raysPerPixel ${RAYS_PER_PIXEL}  s0=${S0}  camera [${CAM}]  anchor [${ANCHOR}]`);
        say(`probe store ${(store.bytes / 1048576).toFixed(2)}MB  ` +
          `ray store ${(rayStore.bytes / 1048576).toFixed(2)}MB  ` +
          `dispatches ${frame.passes.length} + ${rayFrame.passes.length}`);
        say("");

        const runFrame = async () => {
          for (const pass of frame.passes) await renderer.computeAsync(pass);
          for (const pass of rayFrame.passes) await renderer.computeAsync(pass);
          const [table, pp, base, total] = await Promise.all([
            renderer.getArrayBufferAsync(store.probeTable.value).then((b) => new Uint32Array(b)),
            renderer.getArrayBufferAsync(frame.pixelProbe.value).then((b) => new Uint32Array(b)),
            renderer.getArrayBufferAsync(rayStore.pixelRayBase.value).then((b) => new Uint32Array(b)),
            rayFrame.readTotal(renderer),
          ]);
          // One record per live probe: key, parent, count, offset.
          const live = store.cascades.map((c) => {
            const byKey = new Map();
            const byIndex = new Map();
            for (let k = 0; k < c.probeCapacity; k++) {
              const p = c.probeBase + k;
              const w = p * P.PROBE_WORDS;
              if ((table[w + P.PROBE_FLAGS] & P.FLAG_ALIVE) === 0) continue;
              const rec = {
                index: p,
                key: table[w + P.PROBE_KEY] >>> 0,
                parent: table[w + P.PROBE_PARENT] >>> 0,
                count: table[w + P.PROBE_RAYS] >>> 0,
                offset: table[w + P.PROBE_RAYOFF] >>> 0,
              };
              byKey.set(rec.key, rec);
              byIndex.set(p, rec);
            }
            return { byKey, byIndex };
          });
          return { table, pixelProbe: pp, pixelRayBase: base, total, live };
        };

        const gpu = await runFrame();

        // ── the mirror on the same pixels ─────────────────────────────────
        // `mirrorSlotToPixel[slot]` is the gbuffer's LINEAR index for the
        // mirror's compacted slot. Only ARM 7 needs it — a stride is a function
        // of the index, and the two numberings differ by exactly the invalid
        // pixels this list drops.
        const mirrorSlotToPixel = [];
        for (let i = 0; i < pixels.length; i++) if (valid[i]) mirrorSlotToPixel.push(i);
        const mirrorPixels = mirrorSlotToPixel.map((i) => pixels[i]);
        const cfg = ref.makeSrcConfig({
          spacing0: S0, camera: CAM, anchor: ANCHOR, raysPerPixel: RAYS_PER_PIXEL,
          cascadeCount: cfgMod.CASCADE_COUNT, maxLods: cfgMod.MAX_LODS,
        });
        const built = ref.buildProbes(cfg, mirrorPixels);
        const mirrorRays = ref.assignRays(cfg, built);

        // ══ ARM 1: the counts, matched by key ════════════════════════════
        say("── COUNTS: per-probe ray budget vs the CPU mirror, by key ──");
        let totalGpuRays = 0;
        for (let c = 0; c < cfgMod.CASCADE_COUNT; c++) {
          const mirrorByKey = new Map();
          for (const p of built.cascades[c].probes) mirrorByKey.set(p.key >>> 0, p.rayCount);
          let wrong = 0;
          let worst = null;
          let sum = 0;
          for (const [key, rec] of gpu.live[c].byKey) {
            sum += rec.count;
            const want = mirrorByKey.get(key);
            if (want === rec.count) continue;
            wrong++;
            if (!worst) worst = `key ${key} gpu ${rec.count} vs mirror ${want}`;
          }
          if (c === 0) totalGpuRays = sum;
          check(`c${c} every probe's ray count matches the mirror`,
            wrong === 0, wrong === 0 ? `${gpu.live[c].byKey.size} probes, ${sum} rays` : `${wrong} wrong — ${worst}`);
          // Conservation, stated per level rather than only at the top: the
          // budget must be neither created nor destroyed climbing the ladder. A
          // level whose sum drops is a broken parent link eating rays silently.
          check(`c${c} total equals c0's — the budget is conserved climbing`,
            sum === totalGpuRays, `${sum} vs ${totalGpuRays}`);
        }
        check("the frame total matches the mirror's",
          gpu.total === mirrorRays.totalRays, `gpu ${gpu.total} vs mirror ${mirrorRays.totalRays}`);
        check("the total equals raysPerPixel x valid pixels",
          gpu.total === RAYS_PER_PIXEL * mirrorPixels.length,
          `${gpu.total} vs ${RAYS_PER_PIXEL} x ${mirrorPixels.length}`);

        // ══ ARM 2: the top cascade tiles [0, total) ══════════════════════
        say("");
        say("── PARTITION: the top cascade tiles [0, total) exactly ──");
        const topRecs = [...gpu.live[cfgMod.CASCADE_COUNT - 1].byKey.values()]
          .filter((r) => r.offset !== P.SLOT_EMPTY)
          .sort((a, b) => a.offset - b.offset);
        let gap = 0;
        let overlap = 0;
        let cursor = 0;
        for (const r of topRecs) {
          if (r.offset > cursor) gap++;
          else if (r.offset < cursor) overlap++;
          cursor = Math.max(cursor, r.offset + r.count);
        }
        check("no gap between top-cascade segments", gap === 0, `${gap} gaps`);
        check("no overlap between top-cascade segments", overlap === 0, `${overlap} overlaps`);
        check("the segments end exactly at the total", cursor === gpu.total,
          `covered [0, ${cursor}) of [0, ${gpu.total})`);
        check("every top-cascade probe got an offset",
          topRecs.length === gpu.live[cfgMod.CASCADE_COUNT - 1].byKey.size,
          `${topRecs.length}/${gpu.live[cfgMod.CASCADE_COUNT - 1].byKey.size}`);

        // ══ ARM 3: every parent's children tile ITS range ════════════════
        say("");
        say("── NESTING: each parent's children tile the parent's range ──");
        // This is the arm that would catch the compaction the atomic cursor
        // replaced. A cursor that was seeded from the wrong place, or read
        // before its parent settled, produces children whose ranges are
        // individually plausible and collectively outside the parent.
        for (let c = 0; c < cfgMod.CASCADE_COUNT - 1; c++) {
          const byParent = new Map();
          let orphan = 0;
          for (const rec of gpu.live[c].byKey.values()) {
            if (rec.parent === P.SLOT_EMPTY) { orphan++; continue; }
            if (rec.offset === P.SLOT_EMPTY) { orphan++; continue; }
            const list = byParent.get(rec.parent) ?? [];
            list.push(rec);
            byParent.set(rec.parent, list);
          }
          let badTile = 0;
          let escaped = 0;
          let countMismatch = 0;
          for (const [parentIndex, kids] of byParent) {
            const parent = gpu.live[c + 1].byIndex.get(parentIndex);
            if (!parent) { escaped += kids.length; continue; }
            kids.sort((a, b) => a.offset - b.offset);
            let cur = parent.offset;
            let sum = 0;
            for (const k of kids) {
              if (k.offset !== cur) badTile++;
              cur = k.offset + k.count;
              sum += k.count;
              if (k.offset < parent.offset || cur > parent.offset + parent.count) escaped++;
            }
            if (sum !== parent.count) countMismatch++;
          }
          check(`c${c} -> c${c + 1} children tile the parent contiguously`,
            badTile === 0, `${badTile} children not flush with the previous one`);
          check(`c${c} -> c${c + 1} no child escapes its parent's range`,
            escaped === 0, `${escaped} outside`);
          check(`c${c} -> c${c + 1} children's counts sum to the parent's`,
            countMismatch === 0, `${countMismatch} parents disagree`);
          check(`c${c} every probe has a parent and an offset`, orphan === 0,
            `${orphan} orphaned — those rays exist in the total but no pixel can fire them`);
        }

        // ══ ARM 4: pixels tile their own c0 probe's segment ══════════════
        say("");
        say("── PIXELS: each pixel's slice sits inside its own probe's range ──");
        const perProbe = new Map();
        let noBase = 0;
        let invalidLeaked = 0;
        for (let i = 0; i < PIXELS; i++) {
          const probe = gpu.pixelProbe[i];
          const base = gpu.pixelRayBase[i];
          if (!valid[i]) {
            if (base !== P.SLOT_EMPTY) invalidLeaked++;
            continue;
          }
          if (probe === P.SLOT_EMPTY) continue;
          if (base === P.SLOT_EMPTY) { noBase++; continue; }
          const list = perProbe.get(probe) ?? [];
          list.push(base);
          perProbe.set(probe, list);
        }
        check("no invalid pixel was given a ray slice", invalidLeaked === 0, `${invalidLeaked} leaked`);
        check("every resolved pixel got a ray slice", noBase === 0, `${noBase} missing`);
        let pxBadTile = 0;
        let pxEscaped = 0;
        for (const [probeIndex, bases] of perProbe) {
          const probe = gpu.live[0].byIndex.get(probeIndex);
          if (!probe) { pxEscaped += bases.length; continue; }
          bases.sort((a, b) => a - b);
          let cur = probe.offset;
          for (const b of bases) {
            if (b !== cur) pxBadTile++;
            cur = b + RAYS_PER_PIXEL;
            if (b < probe.offset || cur > probe.offset + probe.count) pxEscaped++;
          }
          if (cur !== probe.offset + probe.count) pxBadTile++;
        }
        check("pixel slices tile their probe's segment contiguously", pxBadTile === 0,
          `${pxBadTile} slices out of place`);
        check("no pixel slice escapes its probe's segment", pxEscaped === 0, `${pxEscaped} outside`);

        // ══ ARM 5: the global index set is a permutation ═════════════════
        say("");
        say("── COVERAGE: [0, total) is used exactly once, end to end ──");
        // The strongest single statement available, and the one the three arms
        // above are decomposed FROM: if every ray index in the frame is claimed
        // by exactly one pixel, the whole allocator is correct regardless of
        // which probe got which offset. It is checked last because when it
        // fails, the arms above say WHERE.
        const seen = new Uint8Array(gpu.total);
        let dup = 0;
        let outOfRange = 0;
        for (let i = 0; i < PIXELS; i++) {
          const base = gpu.pixelRayBase[i];
          if (base === P.SLOT_EMPTY) continue;
          for (let r = 0; r < RAYS_PER_PIXEL; r++) {
            const idx = base + r;
            if (idx >= gpu.total) { outOfRange++; continue; }
            if (seen[idx]) dup++;
            seen[idx] = 1;
          }
        }
        let uncovered = 0;
        for (let i = 0; i < gpu.total; i++) if (!seen[i]) uncovered++;
        check("no ray index is claimed twice", dup === 0, `${dup} duplicates`);
        check("no ray index is past the total", outOfRange === 0, `${outOfRange} out of range`);
        check("every ray index in [0, total) is claimed", uncovered === 0,
          `${uncovered}/${gpu.total} unclaimed`);

        // ══ ARM 6: rerun — different indices, identical budget ═══════════
        say("");
        say("── RERUN: the allocation may move, the budget may not ──");
        const gpu2 = await runFrame();
        check("the total is stable across runs", gpu2.total === gpu.total,
          `${gpu2.total} vs ${gpu.total} — a moving total is an atomics race, not scheduler order`);
        let countDrift = 0;
        let offsetsMoved = 0;
        for (let c = 0; c < cfgMod.CASCADE_COUNT; c++) {
          for (const [key, rec] of gpu.live[c].byKey) {
            const now = gpu2.live[c].byKey.get(key);
            if (!now || now.count !== rec.count) countDrift++;
            else if (now.offset !== rec.offset) offsetsMoved++;
          }
        }
        check("every probe's ray count is identical on the second run",
          countDrift === 0, `${countDrift} changed`);
        // NOT a failure. Stated as an observation because it is the thing a
        // reader will otherwise mistake for one, and because a run where
        // NOTHING moved would mean the atomics happened to serialize — worth
        // seeing rather than asserting either way.
        say(`   ${offsetsMoved} probes were handed a different offset on the rerun ` +
          `(scheduler order — expected, and why no arm compares offsets)`);

        // ══ ARM 7: THE RAY CEILING'S STRIDE ══════════════════════════════
        say("");
        say("── STRIDE: a ray ceiling subsamples pixels without breaking the allocator ──");
        // Every arm above runs at stride 1, where `strideSkips` is identically
        // false — so without this one the ceiling ships ungated, and the arms
        // would all still pass. What makes it worth its lines is the specific
        // failure it is aimed at: [D1] counts a probe's rays and [D5] hands out
        // slices of exactly that count. If the two admitted different pixel
        // sets, [D5]'s atomicAdd would return an offset PAST its probe's
        // segment and write into the NEXT probe's rays. Nothing throws. The
        // total still looks plausible. It surfaces as a few wrongly-lit probes
        // in a scene, which is indistinguishable from ordinary GI noise.
        //
        // ARM 5's permutation is the statement that catches it, so this arm is
        // ARM 5 re-run against a strided frame plus the two facts specific to
        // striding: the mirror agrees on the smaller total, and the pixels that
        // got a slice are EXACTLY the residue class.
        const STRIDE = 3;
        const PHASE = 1;
        // Threads, not pixels: the transport dispatches a baked thread count and
        // thread `t` owns pixel `t·STRIDE + PHASE`. Sized so the last thread
        // lands inside the image — `floor((PIXELS - PHASE) / STRIDE)` — which is
        // exactly what srcSystem computes from the tier's ceiling.
        const THREADS = Math.floor((PIXELS - PHASE) / STRIDE);
        const strideU = TSL.uniform(STRIDE, "uint");
        const phaseU = TSL.uniform(PHASE, "uint");
        // ⚠ A FRESH RAY STORE, AND THE FIRST VERSION OF THIS ARM DID NOT HAVE
        // ONE. A strided [D5] writes `pixelRayBase` only for the pixels it owns,
        // so the buffer keeps whatever the earlier full-dispatch runs left in
        // every other slot — and the checks below scan the WHOLE buffer. Reusing
        // `rayStore` therefore reported 3,125 pixels "fired out of class", 2,062
        // duplicate ray indices and 4,188 out of range: all of them stale reads,
        // none of them a kernel fault, and every message pointed confidently at
        // the [D1]/[D5] disagreement this arm exists to catch.
        //
        // A new store is `fill(SLOT_EMPTY)`, so anything not SLOT_EMPTY was
        // written by THIS frame. That is what makes a whole-buffer scan mean
        // something, and it keeps the arm able to see a [D5] that writes outside
        // its own set — which masking the scan to the owned pixels would not.
        const strideRayStore = R.createSrcRayStore(store, { pixelCount: PIXELS });
        const strideFrame = R.createSrcRayFrame(store, strideRayStore, {
          pixelProbe: frame.pixelProbe,
          raysPerPixel: RAYS_PER_PIXEL,
          stride: strideU,
          phase: phaseU,
          threads: THREADS,
        });
        for (const pass of frame.passes) await renderer.computeAsync(pass);
        for (const pass of strideFrame.passes) await renderer.computeAsync(pass);
        const sBase = new Uint32Array(await renderer.getArrayBufferAsync(strideRayStore.pixelRayBase.value));
        const sProbe = new Uint32Array(await renderer.getArrayBufferAsync(frame.pixelProbe.value));
        const sTotal = await strideFrame.readTotal(renderer);
        const sMirror = ref.assignRays({
          ...cfg, rayStride: STRIDE, rayPhase: PHASE, rayThreads: THREADS,
          pixelIndexOf: (p) => mirrorSlotToPixel[p],
        }, built);
        check("the strided total matches the mirror's",
          sTotal === sMirror.totalRays, `gpu ${sTotal} vs mirror ${sMirror.totalRays}`);
        // The ceiling has to actually bite, or every check here is vacuous —
        // the same reason the deposit gate pins raysPerPixel above 1.
        check("striding actually cut the budget", sTotal > 0 && sTotal < gpu.total,
          `${sTotal} of ${gpu.total} (stride ${STRIDE})`);
        // Split the two directions rather than counting mismatches: they are
        // different bugs. A pixel OUT of the class that got a slice means [D5]
        // is admitting what [D1] did not count (the corruption). A pixel IN the
        // class that got none is the benign direction — its probe is not
        // resolvable this frame — and lumping them cost a round.
        let firedOutOfClass = 0;
        let silentInClass = 0;
        for (let i = 0; i < PIXELS; i++) {
          // ON the progression `t·STRIDE + PHASE` and inside its span. Written
          // as the kernel enumerates it, not as a modulo: `(i + PHASE) % STRIDE`
          // picks the residue `−PHASE` and would agree only at PHASE = 0.
          const t = (i - PHASE) / STRIDE;
          const inClass = i >= PHASE && Number.isInteger(t) && t < THREADS;
          const got = sBase[i] !== P.SLOT_EMPTY;
          if (got && !inClass) firedOutOfClass++;
          if (!got && inClass && valid[i] && sProbe[i] !== P.SLOT_EMPTY) silentInClass++;
        }
        check("no pixel outside the residue class fired", firedOutOfClass === 0,
          `${firedOutOfClass} fired out of class — [D5] admitted what [D1] never counted`);
        check("every in-class pixel with a live probe fired", silentInClass === 0,
          `${silentInClass} in-class pixels with a probe got no slice`);
        const sSeen = new Uint8Array(sTotal);
        let sDup = 0;
        let sOut = 0;
        for (let i = 0; i < PIXELS; i++) {
          const base = sBase[i];
          if (base === P.SLOT_EMPTY) continue;
          for (let r = 0; r < RAYS_PER_PIXEL; r++) {
            const idx = base + r;
            if (idx >= sTotal) { sOut++; continue; }
            if (sSeen[idx]) sDup++;
            sSeen[idx] = 1;
          }
        }
        let sUncovered = 0;
        for (let i = 0; i < sTotal; i++) if (!sSeen[i]) sUncovered++;
        check("strided: no ray index is claimed twice", sDup === 0, `${sDup} duplicates`);
        check("strided: no ray index is past the total", sOut === 0,
          `${sOut} out of range — [D5] admitted a pixel [D1] never counted`);
        check("strided: every ray index in [0, total) is claimed", sUncovered === 0,
          `${sUncovered}/${sTotal} unclaimed`);

        // ══ ARM 8: THE PER-PROBE RAY CAP ═════════════════════════════════
        say("");
        say("── CAP: min(count, B) at the source, whole-slice denial at [D5] ──");
        // The cap changes WHO gets rays, not how the allocator works — so the
        // strong claims are the old ones re-asserted on a capped frame: the
        // partition still tiles, the claimed slices still cover [0, total)
        // exactly once (whole-slice denial means a capped segment is SHORTER,
        // never fragmented), and the counts are exactly min(natural, B) by
        // key against the mirror. What is NEW is the denial itself: per
        // probe, exactly `members − count/rpp` pixels come back empty-handed.
        // Scheduler order picks WHICH — that is never compared (the header's
        // rule), only how many and which slots.
        // 2 pixels' worth: small enough to deny on every ≥3-member probe of
        // this sparse synthetic field (~1.3 px/probe — at 4 px the denial path
        // ran only 29 times), big enough that a capped segment still tiles
        // MULTIPLE winner slices, which 1 px worth would never exercise.
        const CAP = 2 * RAYS_PER_PIXEL;
        const capU = TSL.uniform(CAP, "uint");
        const capRayStore = R.createSrcRayStore(store, { pixelCount: PIXELS });
        const capFrame = R.createSrcRayFrame(store, capRayStore, {
          pixelProbe: frame.pixelProbe,
          raysPerPixel: RAYS_PER_PIXEL,
          cap: capU,
        });
        // Read the influx region BEFORE any capped frame touches it: the
        // uncapped frames above built no publish passes at all, so every word
        // must still hold its INFLUX_ONE init — the structural half of "an
        // uncapped build decays bit-identically". (ARM 9 reads it again after
        // the capped frame, when it must NOT be all ones.)
        const influxBefore = new Uint32Array(
          await renderer.getArrayBufferAsync(store.freeStack.value),
        ).slice(store.blockInfluxBase, store.blockInfluxBase + store.blockTotal);
        for (const pass of frame.passes) await renderer.computeAsync(pass);
        for (const pass of capFrame.passes) await renderer.computeAsync(pass);
        const [cTable, cProbe, cBase, cTotal] = await Promise.all([
          renderer.getArrayBufferAsync(store.probeTable.value).then((b) => new Uint32Array(b)),
          renderer.getArrayBufferAsync(frame.pixelProbe.value).then((b) => new Uint32Array(b)),
          renderer.getArrayBufferAsync(capRayStore.pixelRayBase.value).then((b) => new Uint32Array(b)),
          capFrame.readTotal(renderer),
        ]);
        // The mirror with the same cap. `assignRays` overwrites the built
        // probes' counts/offsets in place, so this arm runs after every use
        // of the uncapped mirror above (ARM 7 already relies on the same).
        const cMirror = ref.assignRays({ ...cfg, probeRayCap: CAP }, built);
        check("the capped total matches the mirror's", cTotal === cMirror.totalRays,
          `gpu ${cTotal} vs mirror ${cMirror.totalRays}`);
        check("the cap actually bit", cTotal > 0 && cTotal < gpu.total,
          `${cTotal} of ${gpu.total} (cap ${CAP})`);
        // Counts by key, all cascades — parents must hold SUMS OF CAPPED
        // children, which is what clamping at the source and propagating up
        // means. A clamp applied after propagation would pass c0 and fail c1.
        const cLive = store.cascades.map((c) => {
          const byKey = new Map();
          const byIndex = new Map();
          for (let k = 0; k < c.probeCapacity; k++) {
            const p = c.probeBase + k;
            const w = p * P.PROBE_WORDS;
            if ((cTable[w + P.PROBE_FLAGS] & P.FLAG_ALIVE) === 0) continue;
            const rec = {
              key: cTable[w + P.PROBE_KEY] >>> 0,
              count: cTable[w + P.PROBE_RAYS] >>> 0,
              offset: cTable[w + P.PROBE_RAYOFF] >>> 0,
            };
            byKey.set(rec.key, rec);
            byIndex.set(p, rec);
          }
          return { byKey, byIndex };
        });
        for (let c = 0; c < cfgMod.CASCADE_COUNT; c++) {
          const mirrorByKey = new Map();
          for (const p of built.cascades[c].probes) mirrorByKey.set(p.key >>> 0, p.rayCount);
          let wrong = 0;
          let worst = null;
          let over = 0;
          for (const [key, rec] of cLive[c].byKey) {
            if (c === 0 && rec.count > CAP) over++;
            const want = mirrorByKey.get(key);
            if (want === rec.count) continue;
            wrong++;
            if (!worst) worst = `key ${key} gpu ${rec.count} vs mirror ${want}`;
          }
          check(`c${c} capped counts match the mirror by key`, wrong === 0,
            wrong === 0 ? `${cLive[c].byKey.size} probes` : `${wrong} wrong — ${worst}`);
          if (c === 0) check("no c0 probe exceeds the cap", over === 0, `${over} over ${CAP}`);
        }
        // Coverage + segment containment + the denial arithmetic, one sweep.
        const cSeen = new Uint8Array(cTotal);
        let cDup = 0;
        let cOut = 0;
        const claimedBy = new Map();
        const membersBy = new Map();
        for (let i = 0; i < PIXELS; i++) {
          const probe = cProbe[i];
          if (probe === P.SLOT_EMPTY) continue;
          membersBy.set(probe, (membersBy.get(probe) ?? 0) + 1);
          const base = cBase[i];
          if (base === P.SLOT_EMPTY) continue;
          claimedBy.set(probe, (claimedBy.get(probe) ?? 0) + 1);
          for (let r = 0; r < RAYS_PER_PIXEL; r++) {
            const idx = base + r;
            if (idx >= cTotal) { cOut++; continue; }
            if (cSeen[idx]) cDup++;
            cSeen[idx] = 1;
          }
        }
        let cUncovered = 0;
        for (let i = 0; i < cTotal; i++) if (!cSeen[i]) cUncovered++;
        check("capped: no ray index is claimed twice", cDup === 0, `${cDup} duplicates`);
        check("capped: no ray index is past the total", cOut === 0, `${cOut} out of range`);
        check("capped: every ray index in [0, total) is claimed", cUncovered === 0,
          `${cUncovered}/${cTotal} unclaimed — a partial slice slipped the whole-slice denial`);
        let denialWrong = 0;
        let denied = 0;
        let escaped2 = 0;
        for (const [probeIndex, members] of membersBy) {
          const rec = cLive[0].byIndex.get(probeIndex);
          if (!rec) { denialWrong++; continue; }
          const winners = claimedBy.get(probeIndex) ?? 0;
          if (winners !== rec.count / RAYS_PER_PIXEL) denialWrong++;
          denied += members - winners;
          if (rec.offset !== P.SLOT_EMPTY && rec.count > 0) {
            // Spot containment per probe: winners × rpp must fit the segment.
            if (winners * RAYS_PER_PIXEL > rec.count) escaped2++;
          }
        }
        check("every probe's winners are exactly count/raysPerPixel", denialWrong === 0,
          `${denialWrong} probes disagree`);
        check("denials happened (the arithmetic above is not vacuous)", denied > 0,
          `${denied} pixels denied across ${membersBy.size} probes`);
        check("no probe's winners exceed its segment", escaped2 === 0, `${escaped2} over`);

        // ══ ARM 9: THE INFLUX WORDS (§12.40.4's α compensation) ══════════
        say("");
        say("── INFLUX: capped/natural per block, exact vs the mirror ──");
        // [D1''] publishes `floor(fl32(capped/natural)·65536 + 0.5)` into the
        // store's per-block region for every probe holding a block, on EVERY
        // cascade — a parent's deposits are its children's rays, so a capped
        // child starves its ancestors and their blocks carry the ratio too.
        // The mirror computes the same word per probe (`influxWordFor`, same
        // f32 divide); probe → block goes through the GPU's own table, since
        // the mirror has no block allocator to agree with.
        let initWrong = 0;
        for (const w of influxBefore) if (w !== P.INFLUX_ONE) initWrong++;
        check("before any capped frame, every word is INFLUX_ONE", initWrong === 0,
          initWrong === 0 ? `${influxBefore.length} words` : `${initWrong} touched`);
        const influxAfter = new Uint32Array(
          await renderer.getArrayBufferAsync(store.freeStack.value),
        ).slice(store.blockInfluxBase, store.blockInfluxBase + store.blockTotal);
        let iWrong = 0;
        let iWorst = null;
        let iCompared = 0;
        let iBelowOne = 0;
        let iOverOne = 0;
        for (let c = 0; c < cfgMod.CASCADE_COUNT; c++) {
          const mirrorWordByKey = new Map();
          for (const p of built.cascades[c].probes) mirrorWordByKey.set(p.key >>> 0, p.influxWord);
          const info = store.cascades[c];
          for (let k = 0; k < info.probeCapacity; k++) {
            const pi = info.probeBase + k;
            const w = pi * P.PROBE_WORDS;
            if ((cTable[w + P.PROBE_FLAGS] & P.FLAG_ALIVE) === 0) continue;
            const block = cTable[w + P.PROBE_BLOCK] >>> 0;
            if (block === P.SLOT_EMPTY) continue;
            const got = influxAfter[info.blockBase + block];
            const want = mirrorWordByKey.get(cTable[w + P.PROBE_KEY] >>> 0);
            if (want === undefined) continue;
            iCompared++;
            if (got < P.INFLUX_ONE) iBelowOne++;
            if (got > P.INFLUX_ONE) iOverOne++;
            if (got !== want) {
              iWrong++;
              if (!iWorst) iWorst = `c${c} block ${block} gpu ${got} vs mirror ${want}`;
            }
          }
        }
        check("every live block's influx word matches the mirror exactly", iWrong === 0,
          iWrong === 0 ? `${iCompared} blocks` : `${iWrong} wrong — ${iWorst}`);
        check("capped probes published words below ONE (not vacuous)", iBelowOne > 0,
          `${iBelowOne} of ${iCompared} below, cap ${CAP}`);
        check("no word exceeds INFLUX_ONE — capped never exceeds natural", iOverOne === 0,
          `${iOverOne} over`);

        // ══ ARM 10: THE CAP EXEMPTION (cold fill + surprise) ════════════
        say("");
        say("── BOOST: cap << shift for cold and surprised blocks ──");
        // [D1'] is the ONLY pass the exemption edits, and that is the claim
        // worth testing hardest. [D5]'s denial reads `probeTable[PROBE_RAYS]`,
        // which [D4] copies from the already-clamped `rayCount` — so the
        // exemption reaches the handout through the SAME single clamp, and
        // ARM 8's partition statements must hold unchanged under it. Anything
        // less would be an allocator that hands out slices of a segment length
        // it disagrees with, which is the silent corruption ARM 7's header
        // describes.
        //
        // The state is SEEDED rather than produced: a real cold block needs a
        // claim this frame and a real surprised one needs a whole deposit
        // history, neither of which this fixture has. Seeding also exercises
        // every branch on the same frame — cold, surprised, and neither — which
        // a real population would only reach one at a time.
        const BOOST_FRAME = 1000;
        const boostStampU = TSL.uniform(BOOST_FRAME, "uint");
        const boostOnU = TSL.uniform(1, "uint");
        // block % 3: 0 stamped THIS frame (COLD), 1 given a full surprise word,
        // 2 neither. Written over the whole region; [D1'] reads only cascade
        // 0's, whose LOCAL block index is its global one (blockBase[0] = 0).
        const seedBoost = TSL.Fn(() => {
          const b = TSL.instanceIndex.toVar();
          store.freeStack.element(TSL.uint(store.blockStampBase).add(b)).assign(
            TSL.select(b.mod(TSL.uint(3)).equal(TSL.uint(0)),
              TSL.uint(BOOST_FRAME), TSL.uint(BOOST_FRAME - 100)));
          store.freeStack.element(TSL.uint(store.blockSurpriseBase).add(b)).assign(
            TSL.select(b.mod(TSL.uint(3)).equal(TSL.uint(1)),
              TSL.uint(cfgMod.SURPRISE_ONE), TSL.uint(0)));
        })().compute(store.blockTotal);
        const boostRayStore = R.createSrcRayStore(store, { pixelCount: PIXELS });
        const boostFrame = R.createSrcRayFrame(store, boostRayStore, {
          pixelProbe: frame.pixelProbe,
          raysPerPixel: RAYS_PER_PIXEL,
          cap: capU,
          capBoost: {
            frameStamp: boostStampU, boostEnable: boostOnU, counters: store.counters,
          },
        });
        for (const pass of frame.passes) await renderer.computeAsync(pass);
        // AFTER the population, because the population's own clear pass zeroes
        // the counter this arm reads and (in the engine) the compaction is what
        // stamps a claim. Nothing here stamps — the harness's probe frame is
        // built without a `frameStamp` — so the seed is the whole state.
        await renderer.computeAsync(seedBoost);
        for (const pass of boostFrame.passes) await renderer.computeAsync(pass);
        const [bTable, bBase, bTotal, bCounters] = await Promise.all([
          renderer.getArrayBufferAsync(store.probeTable.value).then((b) => new Uint32Array(b)),
          renderer.getArrayBufferAsync(boostRayStore.pixelRayBase.value).then((b) => new Uint32Array(b)),
          boostFrame.readTotal(renderer),
          renderer.getArrayBufferAsync(store.counters.value).then((b) => new Uint32Array(b)),
        ]);
        // The seeded shift, as the kernel derives it: cold wins over surprise,
        // and a probe with no block is never exempt.
        const shiftOf = (block) => {
          if (block === P.SLOT_EMPTY) return 0;
          if (block % 3 === 0) return cfgMod.COLD_CAP_SHIFT;
          if (block % 3 === 1) return cfgMod.SURPRISE_CAP_SHIFT;
          return 0;
        };
        const blockOfKey = new Map();
        let boostExpect = 0;
        for (let k = 0; k < store.cascades[0].probeCapacity; k++) {
          const p = store.cascades[0].probeBase + k;
          const w = p * P.PROBE_WORDS;
          const block = bTable[w + P.PROBE_BLOCK] >>> 0;
          if (block !== P.SLOT_EMPTY && shiftOf(block) > 0) boostExpect++;
          if ((bTable[w + P.PROBE_FLAGS] & P.FLAG_ALIVE) === 0) continue;
          blockOfKey.set(bTable[w + P.PROBE_KEY] >>> 0, block);
        }
        const capEffOfKey = (key) => CAP << shiftOf(blockOfKey.get(key) ?? P.SLOT_EMPTY);
        // The mirror's exemption hook — `srcRef.assignRays`'s `capOf`. Every
        // arm above passes nothing and gets `cfg.probeRayCap` for every probe,
        // which is the exact clamp they were written against.
        const bMirror = ref.assignRays(
          { ...cfg, probeRayCap: CAP, capOf: (probe) => capEffOfKey(probe.key >>> 0) },
          built,
        );
        check("the exempted total matches the mirror's", bTotal === bMirror.totalRays,
          `gpu ${bTotal} vs mirror ${bMirror.totalRays}`);
        check("the exemption actually raised the budget", bTotal > cTotal && bTotal <= gpu.total,
          `${bTotal} against ${cTotal} capped and ${gpu.total} uncapped`);
        // The per-probe statement, spelled out against the NATURAL counts
        // rather than only against the mirror — a mirror that shared the bug
        // would agree with the kernel and this would not.
        let capWrong = 0;
        let capWorst = null;
        let notMultiple = 0;
        let exempted = 0;
        const bLive0 = new Map();
        for (let k = 0; k < store.cascades[0].probeCapacity; k++) {
          const p = store.cascades[0].probeBase + k;
          const w = p * P.PROBE_WORDS;
          if ((bTable[w + P.PROBE_FLAGS] & P.FLAG_ALIVE) === 0) continue;
          bLive0.set(bTable[w + P.PROBE_KEY] >>> 0, bTable[w + P.PROBE_RAYS] >>> 0);
        }
        for (const probe of built.cascades[0].probes) {
          const key = probe.key >>> 0;
          const got = bLive0.get(key);
          if (got === undefined) continue;
          const capEff = capEffOfKey(key);
          if (capEff % RAYS_PER_PIXEL !== 0) notMultiple++;
          if (capEff > CAP) exempted++;
          const want = Math.min(probe.naturalRays, capEff);
          if (got !== want) {
            capWrong++;
            if (!capWorst) capWorst = `key ${key} gpu ${got} vs min(${probe.naturalRays}, ${capEff})`;
          }
        }
        check("every c0 count is min(natural, cap << shift)", capWrong === 0,
          capWorst ?? `${bLive0.size} probes`);
        check("every effective cap is a multiple of raysPerPixel", notMultiple === 0,
          `${notMultiple} of ${bLive0.size} — a shift preserves the multiple, a scale would not`);
        check("probes were actually exempted (the arm is not vacuous)", exempted > 0,
          `${exempted} of ${bLive0.size} probes exempt`);
        check("the boosted counter matches the exempted set",
          (bCounters[P.COUNTER_BOOSTED] >>> 0) === boostExpect,
          `counter ${bCounters[P.COUNTER_BOOSTED] >>> 0} vs ${boostExpect} blocks with a shift`);
        // Counts by key on EVERY cascade: parents hold sums of exempted
        // children, the same statement ARM 8 makes about capped ones.
        for (let c = 0; c < cfgMod.CASCADE_COUNT; c++) {
          const mirrorByKey = new Map();
          for (const p of built.cascades[c].probes) mirrorByKey.set(p.key >>> 0, p.rayCount);
          const info = store.cascades[c];
          let wrong = 0;
          let worst = null;
          for (let k = 0; k < info.probeCapacity; k++) {
            const w = (info.probeBase + k) * P.PROBE_WORDS;
            if ((bTable[w + P.PROBE_FLAGS] & P.FLAG_ALIVE) === 0) continue;
            const want = mirrorByKey.get(bTable[w + P.PROBE_KEY] >>> 0);
            const got = bTable[w + P.PROBE_RAYS] >>> 0;
            if (want === got) continue;
            wrong++;
            if (!worst) worst = `c${c} key ${bTable[w + P.PROBE_KEY] >>> 0} gpu ${got} vs ${want}`;
          }
          check(`c${c} exempted counts match the mirror by key`, wrong === 0, worst ?? "");
        }
        // ARM 8's partition, re-run under exemption. This is the arm that would
        // catch an exemption applied anywhere but at the source.
        const bSeen = new Uint8Array(bTotal);
        let bDup = 0;
        let bOut = 0;
        for (let i = 0; i < PIXELS; i++) {
          const base = bBase[i];
          if (base === P.SLOT_EMPTY) continue;
          for (let r = 0; r < RAYS_PER_PIXEL; r++) {
            const idx = base + r;
            if (idx >= bTotal) { bOut++; continue; }
            if (bSeen[idx]) bDup++;
            bSeen[idx] = 1;
          }
        }
        let bUncovered = 0;
        for (let i = 0; i < bTotal; i++) if (!bSeen[i]) bUncovered++;
        check("exempted: no ray index is claimed twice", bDup === 0, `${bDup} duplicates`);
        check("exempted: no ray index is past the total", bOut === 0, `${bOut} out of range`);
        check("exempted: every ray index in [0, total) is claimed", bUncovered === 0,
          `${bUncovered}/${bTotal} unclaimed — an exempted segment did not tile`);
        // And the switch: `boostEnable = 0` must reproduce ARM 8 EXACTLY, with
        // the same seeded state still in place. Without this leg the exemption
        // could be unconditional and every check above would still pass.
        boostOnU.value = 0;
        for (const pass of frame.passes) await renderer.computeAsync(pass);
        await renderer.computeAsync(seedBoost);
        for (const pass of boostFrame.passes) await renderer.computeAsync(pass);
        const offTotal = await boostFrame.readTotal(renderer);
        const offCounters = new Uint32Array(await renderer.getArrayBufferAsync(store.counters.value));
        check("boostEnable = 0 reproduces the plain capped total", offTotal === cTotal,
          `${offTotal} vs ${cTotal}`);
        check("boostEnable = 0 exempts nobody", (offCounters[P.COUNTER_BOOSTED] >>> 0) === 0,
          `${offCounters[P.COUNTER_BOOSTED] >>> 0} boosted`);

        if (validationErrors.length) check("no WebGPU validation errors", false, validationErrors[0]);

        say("");
        say(failures ? `gi-src-rays: ${failures} CHECKS FAILED` : "gi-src-rays: all cases PASS");
        globalThis.__SRC_RAYS_RESULT__ = {
          pass: failures === 0,
          failures,
          totalRays: gpu.total,
          probesPerCascade: gpu.live.map((l) => l.byKey.size),
          offsetsMoved,
          cappedRays: cTotal,
          boostedRays: bTotal,
          boostedProbes: exempted,
          storageLimit: device.limits.maxStorageBuffersPerShaderStage,
          text: out.textContent,
        };
      } catch (error) {
        fail(error);
      }
    </script>
  </body>
