<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Env light test</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="view"></canvas><script type="module">
try {
  const { setup } = await import('/scripts/lib/envLightTest.js');
  globalThis.__ENV_TEST__ = await setup(document.querySelector('#view'));
  globalThis.__ENV_READY__ = true;
} catch (error) { console.error(error); globalThis.__ENV_ERROR__ = error.stack ?? String(error); }
</script></body></html>
