<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Light-tree descent gate — lightTreeGpu vs sampleLightTree</title>
    <style>html,body{margin:0;background:#111;color:#ddd;font:13px monospace}canvas{display:none}</style>
  </head>
  <body>
    <canvas id="view" width="16" height="16"></canvas>
    <pre id="log"></pre>
    <script type="module">
      // ══ THE §12.62 UNIT-W2 GATE: THE DESCENT TWIN, WITHOUT THE ENGINE ════
      //
      // `lightTreeGpu.js`'s `createLightTreeSampler` diffed against
      // `lightTree.js`'s `sampleLightTree` — same packed words, same shading
      // points, same counter-based RNG seeds, so the two descents must pick
      // THE SAME EMITTERS case by case and report pdfs equal to f32 drift.
      //
      // ══ WHERE THE TWO SIDES CAN LEGALLY DISAGREE ════════════════════════
      //
      //   · f32 vs f64 in the IMPORTANCE math only. The u01 draws themselves
      //     are bit-identical by construction ((h >> 8) · 2^-24 is exact in
      //     both widths — see lightTreeGpu.js's RNG note), so a pick can flip
      //     only when a probability boundary lands within ~1e-7 of a draw.
      //     Randomized fixtures keep measure-zero boundaries measure-zero;
      //     indices are therefore compared EXACTLY, pdfs at 1e-4 relative.
      //
      // ══ THE ARMS ════════════════════════════════════════════════════════
      //
      //   coverage   the fixture set actually exercises both root paths
      //              (split and choose-one), point receivers, and >1-emitter
      //              leaves — a gate over a degenerate fixture proves nothing.
      //   indices    GPU-selected emitter indices == CPU's, case by case.
      //   pdf        GPU pdf vs CPU pdf, relative 1e-4; max reported.
      //   selfpdf    lightTreeSelectPdf(view,P,N,index) recomputes each CPU
      //              sample's marginal inclusion probability independently —
      //              the estimator's other half must agree with the sampler.
      //   canary     one importance term (node 0 / slot 0 attr power) is
      //              perturbed ×1.05 in a CPU-side COPY of the words; the diff
      //              against the untouched GPU results must FAIL. A gate that
      //              cannot fail proves nothing.
      //   eval       (§12.62 Unit W3) createLightTreeEmitterEval vs the CPU's
      //              emitterIrradiance for EVERY (case, emitter) pair: E per
      //              channel (rel 2e-3, abs floor 1e-5 — f32 through the
      //              acos-heavy box math), dirTo vs normalized(centre − P),
      //              and the shadow-ray cap maxT (sphere: dist − angularRadius;
      //              box: a CPU mirror of giLight.boxRayEnter's slab entry).
      //   estimator  the full W3 NEE term, term for term on the GPU:
      //              Σ over the sampler's slots of E(index)/pdf, vs the CPU's
      //              estimateLightTree under the SAME seed — same picks.
      //
      // Run: node scripts/run-gi-lighttree-descent.mjs
      const out = document.querySelector("#log");
      const say = (line) => { out.textContent += line + "\n"; };
      let failures = 0;
      let checks = 0;
      const check = (label, ok, detail = "") => {
        checks++;
        say(`  ${ok ? "PASS" : "FAIL"} ${label}${detail ? ` — ${detail}` : ""}`);
        if (!ok) failures++;
      };
      const fail = (error) => {
        console.error("LT-DESCENT FAIL", error?.stack ?? error?.message ?? String(error));
        globalThis.__LT_DESCENT_RESULT__ = {
          pass: false, error: error?.message ?? String(error), text: out.textContent,
        };
      };
      globalThis.addEventListener("error", (event) => fail(event.error ?? event.message));
      globalThis.addEventListener("unhandledrejection", (event) => fail(event.reason));

      try {
        const THREE = await import("three/webgpu");
        const TSL = await import("three/tsl");
        const LT = await import("/src/modules/gi/lightTree.js");
        const GPU = await import("/src/modules/gi/lightTreeGpu.js");
        const { Fn, If, float, instanceIndex, instancedArray, vec3, vec4 } = TSL;

        const renderer = new THREE.WebGPURenderer({ canvas: document.querySelector("#view") });
        await renderer.init();
        const device = renderer.backend.device;
        const validationErrors = [];
        device.addEventListener?.("uncapturederror", (event) => {
          validationErrors.push(event.error?.message ?? String(event.error));
          console.error("WebGPU validation error:", validationErrors.at(-1));
        });

        // mulberry32 — the harness PRNG standard, for FIXTURE GEOMETRY only.
        // The descent draws come from makeGpuRng, the kernel's exact mirror.
        const makeRng = (seed) => {
          let s = seed >>> 0;
          return () => {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        };
        const f32 = Math.fround;
        const f32v = (v) => v.map(Math.fround);
        const relErr = (a, b) => Math.abs(a - b) / Math.max(Math.abs(a), Math.abs(b), 1e-12);

        // ── SYNTHETIC EMITTERS ─────────────────────────────────────────────
        // Direct emitter records (the shape emitterFromMesh emits) rather than
        // meshes: the descent reads ONLY bounds/power/axis/cones, and direct
        // synthesis gives the cone variety the arms need — isotropic closed
        // bodies (cosThetaO = −1), wide cones, and tight spot-like cones —
        // without a geometry pass. buildLightTree packs everything to f32, so
        // both sides read identical words regardless of input precision.
        const makeEmitter = (rng, centre, id) => {
          const half = [0.1 + rng() * 0.7, 0.1 + rng() * 0.7, 0.1 + rng() * 0.7];
          const axis = (() => {
            const a = [rng() * 2 - 1, rng() * 2 - 1, rng() * 2 - 1];
            const l = Math.hypot(...a) || 1;
            return a.map((c) => c / l);
          })();
          const coneRoll = rng();
          // A third of everything: closed bodies, wide cones, spot-like cones.
          const cosThetaO = coneRoll < 0.34 ? -1 : coneRoll < 0.67 ? rng() - 0.5 : 0.9 + rng() * 0.085;
          // Mostly Lambertian (theta_e = pi/2), a few narrowed emitters.
          const cosThetaE = rng() < 0.8 ? 0 : 0.17;
          const area = 0.05 + rng() * 2;
          return {
            min: [centre[0] - half[0], centre[1] - half[1], centre[2] - half[2]],
            max: [centre[0] + half[0], centre[1] + half[1], centre[2] + half[2]],
            rgb: [0.2 + rng() * 4, 0.2 + rng() * 4, 0.2 + rng() * 4],
            power: 0.2 + rng() * 8,
            area,
            axis,
            cosThetaO,
            cosThetaE,
            centre: centre.slice(),
            angularRadius: Math.sqrt(((half[0] * half[1] + half[1] * half[2] + half[2] * half[0]) * 2) / Math.PI),
            kind: rng() < 0.5 ? 0 : 1,
            half,
            bx: [1, 0, 0],
            by: [0, 1, 0],
            meshId: 1000 + id,
            instanceId: -1,
          };
        };
        const makeFixture = (n, layout, seed) => {
          const rng = makeRng(seed);
          const emitters = [];
          if (layout === "clustered") {
            const hubs = [];
            const hubCount = Math.max(1, Math.min(3, Math.ceil(n / 6)));
            for (let h = 0; h < hubCount; h++) {
              hubs.push([(rng() * 2 - 1) * 6, (rng() * 2 - 1) * 6, (rng() * 2 - 1) * 6]);
            }
            for (let i = 0; i < n; i++) {
              const hub = hubs[i % hubs.length];
              emitters.push(makeEmitter(rng, [
                hub[0] + (rng() * 2 - 1) * 0.8,
                hub[1] + (rng() * 2 - 1) * 0.8,
                hub[2] + (rng() * 2 - 1) * 0.8,
              ], i));
            }
          } else {
            for (let i = 0; i < n; i++) {
              emitters.push(makeEmitter(rng, [
                (rng() * 2 - 1) * 8, (rng() * 2 - 1) * 8, (rng() * 2 - 1) * 8,
              ], i));
            }
          }
          return emitters;
        };

        // ── BUILD + PACK ALL FIXTURES INTO ONE BUFFER ──────────────────────
        // One storage buffer, several blocks at NON-ZERO bases behind a junk
        // prefix: every internal offset must be base-relative (the production
        // block rides the occupancy `bits` tail), so an absolute read fails
        // loudly here rather than silently in the real buffer.
        // 40 and 80 on top of the plan's five: with targetLeafSize 8 and
        // arity 4 the root alone holds up to 32 emitters, so every plan-sized
        // tree is depth 0 and the interior choose-one loop would never run —
        // a twin whose descent loop is untested is not a twin.
        const COUNTS = [1, 2, 4, 9, 17, 40, 80];
        const LAYOUTS = ["clustered", "spread"];
        const fixtures = [];
        {
          let fseed = 0x11f7;
          for (const layout of LAYOUTS) {
            for (const n of COUNTS) {
              const emitters = makeFixture(n, layout, (fseed = (fseed * 2654435761) >>> 0));
              const built = LT.buildLightTree(emitters);
              if (!built) throw new Error(`buildLightTree returned null for n=${n} ${layout}`);
              fixtures.push({ n, layout, built });
            }
          }
        }
        const PREFIX = 13; // junk words before the first block
        let totalWords = PREFIX;
        for (const f of fixtures) { f.base = totalWords; totalWords += f.built.words.length; }
        const hosted = new Uint32Array(totalWords);
        hosted.fill(0xdeadbeef, 0, PREFIX);
        for (const f of fixtures) hosted.set(f.built.words, f.base);
        for (const f of fixtures) f.view = LT.readLightTree(hosted, f.base);

        say("── THE FIXTURES ──");
        for (const f of fixtures) {
          say(`  n=${String(f.n).padStart(2)} ${f.layout.padEnd(9)} base=${f.base} nodes=${f.built.nodeCount} depth=${f.built.maxDepth} words=${f.built.words.length}`);
        }
        {
          // A gate over single-emitter leaves only would never walk the leaf
          // CDF loop; require a fixture with a >1-emitter leaf.
          let multiLeaf = 0;
          for (const f of fixtures) {
            const walk = (node) => {
              for (let s = 0; s < f.view.arity; s++) {
                const ref = f.view.childRef(node, s);
                if (ref === 0) continue;
                if (ref & 0x80000000) { if (((ref >>> 24) & 0x7f) > 1) multiLeaf++; }
                else walk(ref - 1);
              }
            };
            walk(0);
          }
          check("the fixture set contains multi-emitter leaves (the leaf CDF walk has a subject)",
            multiLeaf > 0, `${multiLeaf} leaves with >1 emitter`);
          check("the fixture set contains depth >= 1 trees (the interior descent loop has a subject)",
            fixtures.some((f) => f.built.maxDepth >= 1),
            `depths ${fixtures.map((f) => f.built.maxDepth).join(",")}`);
        }

        // ── THE CASES ──────────────────────────────────────────────────────
        // Per fixture: points at emitter centres (near-field, d <= radius),
        // inside the cloud, on random "surfaces", and far away; every 4th
        // point is a POINT RECEIVER (N = null — the CPU skips the receiver
        // term, the GPU multiplies by an exact 1). P and N are f32-quantized
        // on the way in so both sides start from identical inputs.
        const CASES = [];
        const SEEDS_PER_POINT = 10;
        {
          const rng = makeRng(0xca5e5);
          const unit = () => {
            const v = [rng() * 2 - 1, rng() * 2 - 1, rng() * 2 - 1];
            const l = Math.hypot(...v) || 1;
            return f32v(v.map((c) => c / l));
          };
          for (const [fi, f] of fixtures.entries()) {
            const view = f.view;
            const emitterCentre = (i) => {
              const e = view.emitter(i % view.emitterCount);
              return [(e.min[0] + e.max[0]) / 2, (e.min[1] + e.max[1]) / 2, (e.min[2] + e.max[2]) / 2];
            };
            const points = [];
            for (let k = 0; k < 4; k++) {
              const c = emitterCentre(k);
              points.push(f32v([c[0] + (rng() - 0.5) * 0.1, c[1] + (rng() - 0.5) * 0.1, c[2] + (rng() - 0.5) * 0.1]));
            }
            for (let k = 0; k < 8; k++) {
              points.push(f32v([(rng() * 2 - 1) * 9, (rng() * 2 - 1) * 9, (rng() * 2 - 1) * 9]));
            }
            for (let k = 0; k < 9; k++) {
              const c = emitterCentre(k + 2);
              points.push(f32v([c[0] + (rng() * 2 - 1) * 3, c[1] + (rng() * 2 - 1) * 3, c[2] + (rng() * 2 - 1) * 3]));
            }
            for (let k = 0; k < 4; k++) {
              const d = unit();
              points.push(f32v([d[0] * 28, d[1] * 28, d[2] * 28]));
            }
            for (const [pi, P] of points.entries()) {
              const N = pi % 4 === 3 ? null : unit();
              for (let k = 0; k < SEEDS_PER_POINT; k++) {
                const seed = GPU.lowbias32((fi * 0x01000193) ^ (pi * 0x9e3779b9) ^ (k * 0x85ebca6b) ^ 0x5eed);
                CASES.push({ fixture: fi, P, N, seed });
              }
            }
          }
        }
        say(`\n  ${CASES.length} (P, N, seed) cases over ${fixtures.length} fixtures`);
        check("case count reaches the bar", CASES.length >= 2000, `${CASES.length} >= 2000`);

        // ── THE CPU SIDE ───────────────────────────────────────────────────
        const cpuRun = (view) => (c) =>
          LT.sampleLightTree(view, c.P, c.N, GPU.makeGpuRng(c.seed));
        const cpuResults = CASES.map((c) => cpuRun(fixtures[c.fixture].view)(c));
        {
          const twos = cpuResults.filter((r) => r.length === 2).length;
          const ones = cpuResults.filter((r) => r.length === 1).length;
          const nulls = CASES.filter((c) => c.N === null).length;
          check("both root paths are exercised (split AND choose-one)",
            twos > CASES.length * 0.05 && ones > CASES.length * 0.05,
            `${twos} split cases, ${ones} choose-one cases`);
          check("point receivers (N = null) are in the mix", nulls > CASES.length * 0.1, `${nulls} cases`);
        }

        // ── THE GPU SIDE ───────────────────────────────────────────────────
        const wordsBuf = instancedArray(hosted, "uint");
        const meta = new Uint32Array(CASES.length * 2);
        const pos = new Float32Array(CASES.length * 4);
        const nrm = new Float32Array(CASES.length * 4);
        CASES.forEach((c, i) => {
          meta[i * 2] = fixtures[c.fixture].base;
          meta[i * 2 + 1] = c.seed;
          pos.set([...c.P, c.N ? 1 : 0], i * 4);
          nrm.set(c.N ? [...c.N, 0] : [0, 1, 0, 0], i * 4);
        });
        const metaBuf = instancedArray(meta, "uint");
        const posBuf = instancedArray(pos, "vec4");
        const nrmBuf = instancedArray(nrm, "vec4");
        const outBuf = instancedArray(new Float32Array(CASES.length * 4), "vec4");

        const sampler = GPU.createLightTreeSampler(wordsBuf);
        const kernel = Fn(() => {
          const i = instanceIndex.toVar();
          const pv = posBuf.element(i).toVar();
          const nv = nrmBuf.element(i).toVar();
          const baseW = metaBuf.element(i.mul(2)).toVar();
          const seed = metaBuf.element(i.mul(2).add(1)).toVar();
          const r = sampler(pv.xyz, nv.xyz, pv.w, baseW, seed);
          outBuf.element(i).assign(vec4(r.index0, r.pdf0, r.index1, r.pdf1));
        })().compute(CASES.length);
        await renderer.computeAsync(kernel);
        const raw = new Float32Array(
          (await renderer.getArrayBufferAsync(outBuf.value)).slice(0, CASES.length * 16),
        );
        const gpuResults = CASES.map((_, i) => {
          const list = [];
          if (raw[i * 4] >= 0) list.push({ index: Math.round(raw[i * 4]), pdf: raw[i * 4 + 1] });
          if (raw[i * 4 + 2] >= 0) list.push({ index: Math.round(raw[i * 4 + 2]), pdf: raw[i * 4 + 3] });
          return list;
        });

        // ── THE DIFF ───────────────────────────────────────────────────────
        const diff = (cpu, tolPdf) => {
          let indexMismatches = 0;
          let maxPdfRel = 0;
          let worstAt = "";
          let samples = 0;
          const bad = [];
          for (let i = 0; i < CASES.length; i++) {
            const a = cpu[i];
            const b = gpuResults[i];
            if (a.length !== b.length || a.some((s, k) => s.index !== b[k].index)) {
              indexMismatches++;
              if (bad.length < 6) {
                bad.push(`case ${i} (fix ${CASES[i].fixture}, seed ${CASES[i].seed >>> 0}): ` +
                  `cpu [${a.map((s) => s.index).join(",")}] gpu [${b.map((s) => s.index).join(",")}]`);
              }
              continue;
            }
            for (let k = 0; k < a.length; k++) {
              samples++;
              const e = relErr(a[k].pdf, b[k].pdf);
              if (e > maxPdfRel) {
                maxPdfRel = e;
                worstAt = `case ${i} (fix ${CASES[i].fixture}) sample ${k}: cpu pdf ${a[k].pdf} gpu ${b[k].pdf}`;
              }
              if (e > tolPdf && bad.length < 6) {
                bad.push(`case ${i} sample ${k}: cpu pdf ${a[k].pdf} gpu ${b[k].pdf} rel ${e.toExponential(2)}`);
              }
            }
          }
          return { indexMismatches, maxPdfRel, worstAt, samples, bad, pass: indexMismatches === 0 && maxPdfRel <= tolPdf };
        };

        say("\n── THE MIRROR: same seeds, same descent, both sides ──");
        const TOL = 1e-4;
        const main = diff(cpuResults, TOL);
        check("selected emitter indices match EXACTLY, case by case",
          main.indexMismatches === 0,
          `${main.indexMismatches} of ${CASES.length} cases differ` +
          (main.bad.length && main.indexMismatches ? `\n     ${main.bad.join("\n     ")}` : ""));
        check("pdfs agree within f32 drift",
          main.maxPdfRel <= TOL,
          `max rel ${main.maxPdfRel.toExponential(2)} over ${main.samples} samples (bar ${TOL})` +
          (main.maxPdfRel > TOL ? `\n     worst: ${main.worstAt}` : ""));
        {
          // The interior choose-one loop must have actually run: some sampled
          // emitter must sit two levels down (root slot -> interior node ->
          // leaf), or the depth arm above was decoration.
          let deep = 0;
          for (let i = 0; i < CASES.length; i++) {
            const view = fixtures[CASES[i].fixture].view;
            for (const s of cpuResults[i]) if (view.locate[s.index].path.length >= 2) deep++;
          }
          check("sampled paths traverse interior nodes (the descent loop ran)",
            deep > 100, `${deep} samples descended through depth >= 1`);
        }

        // ── SELF-CONSISTENCY: the pdf query agrees with the sampler ────────
        say("\n── lightTreeSelectPdf RECOMPUTES what the sampler REPORTED ──");
        {
          let worst = 0;
          let n = 0;
          for (let i = 0; i < CASES.length; i++) {
            const c = CASES[i];
            const view = fixtures[c.fixture].view;
            for (const s of cpuResults[i]) {
              n++;
              const p = LT.lightTreeSelectPdf(view, c.P, c.N, s.index);
              worst = Math.max(worst, relErr(p, s.pdf));
            }
          }
          check("the marginal inclusion probability matches the returned pdf",
            worst <= TOL, `max rel ${worst.toExponential(2)} over ${n} samples (both f64 — expect ~1e-12)`);
        }

        // ── THE CANARY ─────────────────────────────────────────────────────
        // One importance term — the packed attr POWER of node 0 / slot 0 —
        // perturbed ×1.05 in a CPU-side copy. Root probabilities move in
        // every multi-emitter fixture, so the diff against the untouched GPU
        // results must fail, or this gate could not catch a real drift.
        say("\n── THE CANARY: a gate that cannot fail proves nothing ──");
        {
          const perturbed = hosted.slice();
          const pf32 = new Float32Array(perturbed.buffer);
          const perturbedViews = fixtures.map((f) => {
            if (f.view.emitterCount < 2) return f.view; // single-emitter pdfs are 1 regardless
            const aw = f.view.attrBase; // node 0, slot 0 attr record, +0 = power
            pf32[aw] = f32(pf32[aw] * 1.05);
            return LT.readLightTree(perturbed, f.base);
          });
          const canaryCpu = CASES.map((c, i) => {
            const f = fixtures[c.fixture];
            if (f.view.emitterCount < 2) return cpuResults[i];
            return LT.sampleLightTree(perturbedViews[c.fixture], c.P, c.N, GPU.makeGpuRng(c.seed));
          });
          const canary = diff(canaryCpu, TOL);
          check("perturbing one importance term CPU-side makes the diff FAIL",
            !canary.pass,
            `${canary.indexMismatches} index mismatches, max pdf rel ${canary.maxPdfRel.toExponential(2)}`);
        }

        // ── THE EVAL ARM (§12.62 Unit W3) ──────────────────────────────────
        // createLightTreeEmitterEval vs emitterIrradiance for EVERY
        // (case, emitter) pair. Point receivers (N = null) are compared with
        // the SAME placeholder normal the nrm buffer already carries
        // ([0,1,0]): irradiance is a surface quantity, the eval twin always
        // takes a normal — parity only needs both sides fed the same one.
        say("\n── THE EVAL ARM: createLightTreeEmitterEval vs emitterIrradiance ──");
        const NSUB = [0, 1, 0]; // the nrm buffer's stand-in for N = null
        const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
        const cross3 = (a, b) => [
          a[1] * b[2] - a[2] * b[1],
          a[2] * b[0] - a[0] * b[2],
          a[0] * b[1] - a[1] * b[0],
        ];
        // giLight.boxRayEnter's slab entry, mirrored exactly: transform P and
        // dir into the box frame, safe inverse with ±1e-6 clamps, entry =
        // max over slabs of the per-slab tmin.
        const boxEnterCpu = (P, dir, centre, half, bx, by, bz) => {
          const rel = [P[0] - centre[0], P[1] - centre[1], P[2] - centre[2]];
          const ro = [dot3(rel, bx), dot3(rel, by), dot3(rel, bz)];
          const rd = [dot3(dir, bx), dot3(dir, by), dot3(dir, bz)];
          const safe = (c) => (c >= 0 ? Math.max(c, 1e-6) : Math.min(c, -1e-6));
          let enter = -Infinity;
          for (let k = 0; k < 3; k++) {
            const inv = 1 / safe(rd[k]);
            const t1 = (-half[k] - ro[k]) * inv;
            const t2 = (half[k] - ro[k]) * inv;
            enter = Math.max(enter, Math.min(t1, t2));
          }
          return enter;
        };

        const evalMetaList = [];
        for (let ci = 0; ci < CASES.length; ci++) {
          const count = fixtures[CASES[ci].fixture].view.emitterCount;
          for (let ei = 0; ei < count; ei++) evalMetaList.push(ci, ei);
        }
        const evalCount = evalMetaList.length / 2;
        const evalMeta = new Uint32Array(evalMetaList);
        say(`  ${evalCount} (case, emitter) evaluations`);

        const evalFn = GPU.createLightTreeEmitterEval(wordsBuf);
        const evalMetaBuf = instancedArray(evalMeta, "uint");
        const evalOutE = instancedArray(new Float32Array(evalCount * 4), "vec4");
        const evalOutD = instancedArray(new Float32Array(evalCount * 4), "vec4");
        const evalKernel = Fn(() => {
          const i = instanceIndex.toVar();
          const caseI = evalMetaBuf.element(i.mul(2)).toVar();
          const emitterI = evalMetaBuf.element(i.mul(2).add(1)).toVar();
          const pv = posBuf.element(caseI).toVar();
          const nv = nrmBuf.element(caseI).toVar();
          const baseW = metaBuf.element(caseI.mul(2)).toVar();
          const r = evalFn(pv.xyz, nv.xyz, baseW, emitterI);
          evalOutE.element(i).assign(vec4(r.E, r.maxT));
          evalOutD.element(i).assign(vec4(r.dirTo, 0));
        })().compute(evalCount);
        await renderer.computeAsync(evalKernel);
        const rawEval = new Float32Array(
          (await renderer.getArrayBufferAsync(evalOutE.value)).slice(0, evalCount * 16),
        );
        const rawDir = new Float32Array(
          (await renderer.getArrayBufferAsync(evalOutD.value)).slice(0, evalCount * 16),
        );

        {
          // Kind-aware relative tolerance. The sphere factor is two multiplies
          // and a Hermite fade — 2e-3 holds easily. The box factor is 24 f32
          // `acos` calls whose conditioning degrades as the subtended angles
          // shrink (acos near ±1 loses ~half the significand): measured worst
          // drift 1.51e-2 at dist 27.8 with the cone WIDE open (margin 0.35),
          // i.e. pure float width, not a gate flip — the bound is set just
          // above what f64-vs-f32 arithmetic actually costs, and a wrong word
          // offset or missing term still overshoots it by orders.
          const REL_E_SPH = 2e-3;
          const REL_E_BOX = 2.5e-2;
          const ABS_E = 1e-5; // near-zero channel floor
          // The box factor's f32 noise is ABSOLUTE and DISTANCE-SCALED: each
          // of the 24 acos calls runs on a dot → 1 as the subtended angle
          // shrinks, and acos's conditioning there costs ~ε/sinθ per edge —
          // sinθ ≈ diag/dist, so the noise grows LINEARLY with distance while
          // the result shrinks as 1/dist², and a flat bar just chases the far
          // tail (5e-5 left 60 bad, 2e-4 left 10, all farther out). Measured
          // envelope over 76,500 evals: worst |Δ| 2.1e-4 at dist 32, 5.4e-5
          // at dist 10, nothing anomalous under dist 9 — pure conditioning,
          // and the same noise already ships in giLight's slot path, which IS
          // this code. The bar: 1.5e-5·dist with a 1e-4 floor (~2× the
          // envelope), still ~100× under any real defect at the near
          // distances production emitters actually live at.
          const boxAbsAt = (dist) => Math.max(1e-4, 1.5e-5 * dist);
          let eBad = 0;
          let dirBad = 0;
          let tBad = 0;
          let nonzero = 0;
          let boxN = 0;
          let sphN = 0;
          let eWorst = 0;
          let eWorstAt = "";
          let dirWorst = 0;
          let tWorst = 0;
          let tWorstAt = "";
          const eBadLines = [];
          const eBadSeen = new Set();
          const eFlips = new Set();
          const eDrifts = new Set();
          for (let i = 0; i < evalCount; i++) {
            const ci = evalMeta[i * 2];
            const ei = evalMeta[i * 2 + 1];
            const c = CASES[ci];
            const view = fixtures[c.fixture].view;
            const Nsub = c.N ?? NSUB;
            const em = view.emitter(ei);
            const Ecpu = LT.emitterIrradiance(view, ei, c.P, Nsub);
            const Egpu = [rawEval[i * 4], rawEval[i * 4 + 1], rawEval[i * 4 + 2]];
            if (Ecpu[0] > 0 || Ecpu[1] > 0 || Ecpu[2] > 0) nonzero++;
            if (em.kind === 1) boxN++; else sphN++;
            const relTol = em.kind === 1 ? REL_E_BOX : REL_E_SPH;
            const distPE = Math.hypot(c.P[0] - em.centre[0], c.P[1] - em.centre[1], c.P[2] - em.centre[2]);
            const absTol = em.kind === 1 ? boxAbsAt(distPE) : ABS_E;
            let chBad = false;
            let myWorst = 0;
            let myLine = "";
            for (let k = 0; k < 3; k++) {
              if (Math.abs(Ecpu[k] - Egpu[k]) <= absTol) continue;
              const rel = relErr(Ecpu[k], Egpu[k]);
              if (rel > myWorst) {
                myWorst = rel;
                myLine = `eval ${i} (case ${ci}, emitter ${ei}, kind ${em.kind}) ch ${k}: cpu ${Ecpu[k]} gpu ${Egpu[k]}`;
              }
              if (rel > relTol) chBad = true;
            }
            if (myWorst > eWorst) { eWorst = myWorst; eWorstAt = myLine; }
            if (chBad) {
              eBad++;
              const pointKey = `${Math.floor(ci / 10)}:${ei}`;
              if (myWorst > 0.5) eFlips.add(pointKey);
              else eDrifts.add(pointKey);
              if (!eBadSeen.has(pointKey) && eBadLines.length < 10) {
                eBadSeen.add(pointKey);
                // CPU-side margins for the diagnosis: how close was this eval
                // to a discontinuous gate?
                const dv2 = [c.P[0] - em.centre[0], c.P[1] - em.centre[1], c.P[2] - em.centre[2]];
                const dd = Math.hypot(dv2[0], dv2[1], dv2[2]);
                const wi2 = [dv2[0] / dd, dv2[1] / dd, dv2[2] / dd];
                const cosTh2 = Math.max(-1, Math.min(1, dot3(em.axis, wi2)));
                const coneCos2 = cosTh2 > em.cosThetaO ? 1
                  : cosTh2 * em.cosThetaO + Math.sqrt(Math.max(0, 1 - cosTh2 * cosTh2)) * Math.sqrt(Math.max(0, 1 - em.cosThetaO * em.cosThetaO));
                eBadLines.push(`${myLine} | rel ${myWorst.toExponential(2)} dist ${dd.toFixed(2)} coneMargin ${(coneCos2 - em.cosThetaE).toExponential(2)}`);
              }
            }
            // dirTo + maxT — skip only the degenerate P-at-centre direction.
            const dvec = [em.centre[0] - c.P[0], em.centre[1] - c.P[1], em.centre[2] - c.P[2]];
            const dl = Math.hypot(dvec[0], dvec[1], dvec[2]);
            if (dl > 1e-6) {
              const dcpu = [dvec[0] / dl, dvec[1] / dl, dvec[2] / dl];
              const derr = Math.max(
                Math.abs(dcpu[0] - rawDir[i * 4]),
                Math.abs(dcpu[1] - rawDir[i * 4 + 1]),
                Math.abs(dcpu[2] - rawDir[i * 4 + 2]),
              );
              if (derr > dirWorst) dirWorst = derr;
              if (derr > 1e-4) dirBad++;
              const maxTgpu = rawEval[i * 4 + 3];
              const tref = em.kind === 1
                ? boxEnterCpu(c.P, dcpu, em.centre, em.half, em.bx, em.by, cross3(em.bx, em.by))
                : dl - em.angularRadius;
              const ttol = 1e-4 * Math.max(1, dl);
              const terr = Math.abs(maxTgpu - tref);
              if (terr / ttol > tWorst) {
                tWorst = terr / ttol;
                tWorstAt = `eval ${i} (case ${ci}, emitter ${ei}, kind ${em.kind}): cpu ${tref} gpu ${maxTgpu}`;
              }
              if (terr > ttol) tBad++;
            }
          }
          check("eval coverage: both kinds and real energy in the mix",
            nonzero > evalCount * 0.05 && boxN > 0 && sphN > 0,
            `${nonzero} nonzero-E evals, ${boxN} box, ${sphN} sphere`);
          check("E matches emitterIrradiance per channel (rel 2e-3 sphere / 2.5e-2 box, abs floor 1e-5)",
            eBad === 0,
            `${eBad} of ${evalCount} evals differ; worst rel ${eWorst.toExponential(2)}` +
            (eBad ? ` — ${eFlips.size} unique flip pairs (rel > 0.5), ${eDrifts.size} unique drift pairs\n     ${eBadLines.join("\n     ")}` : ""));
          check("dirTo is the unit direction P → emitter centre (1e-4)",
            dirBad === 0, `${dirBad} bad, max |Δ| ${dirWorst.toExponential(2)}`);
          check("maxT stops the shadow ray at the emitter surface (sphere d − R, box slab entry)",
            tBad === 0,
            `${tBad} bad, worst ${tWorst.toExponential(2)}× its bar` +
            (tBad ? `\n     worst: ${tWorstAt}` : ""));
        }

        // ── THE ESTIMATOR ARM (§12.62 Unit W3) ─────────────────────────────
        // The full NEE term the production kernel will compute, term for
        // term on the GPU: sample, then Σ E(index)/pdf over the 1-2 slots.
        // hasN = 1 for EVERY case because the CPU side is estimateLightTree
        // fed the same substituted normal — identical importances, identical
        // draw order, so the two sides pick the same emitters.
        say("\n── THE ESTIMATOR ARM: Σ E/pdf, term for term, both sides ──");
        const estOut = instancedArray(new Float32Array(CASES.length * 4), "vec4");
        const estKernel = Fn(() => {
          const i = instanceIndex.toVar();
          const pv = posBuf.element(i).toVar();
          const nv = nrmBuf.element(i).toVar();
          const baseW = metaBuf.element(i.mul(2)).toVar();
          const seed = metaBuf.element(i.mul(2).add(1)).toVar();
          const s = sampler(pv.xyz, nv.xyz, float(1), baseW, seed);
          const acc = vec3(0).toVar();
          If(s.index0.greaterThanEqual(0).and(s.pdf0.greaterThan(0)), () => {
            acc.addAssign(evalFn(pv.xyz, nv.xyz, baseW, s.index0.toUint()).E.div(s.pdf0));
          });
          If(s.index1.greaterThanEqual(0).and(s.pdf1.greaterThan(0)), () => {
            acc.addAssign(evalFn(pv.xyz, nv.xyz, baseW, s.index1.toUint()).E.div(s.pdf1));
          });
          estOut.element(i).assign(vec4(acc, 0));
        })().compute(CASES.length);
        await renderer.computeAsync(estKernel);
        const rawEst = new Float32Array(
          (await renderer.getArrayBufferAsync(estOut.value)).slice(0, CASES.length * 16),
        );
        {
          const lum = (v) => 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
          // ⚠ THE FLOOR IS PDF-AWARE, AND THAT IS THE WHOLE CALIBRATION. At a
          // CONTINUOUS zero crossing (a receiver on an emitter's horizon, a
          // box face seen edge-on) the CPU's f64 reads exactly 0 while the
          // GPU's f32 lands ~1e-5 above it — the eval arm's 1e-5 floor
          // absorbs that raw drift. The estimator then divides by a pdf as
          // small as ~0.05, amplifying the same drift to ~2e-4 (measured:
          // the pre-calibration run's 58 "failures" were ALL cpu-exactly-zero
          // vs gpu ≤ 1.1e-4 — float width through the division, not energy).
          // A real defect (wrong word offset, missing term, dropped sample)
          // moves values of order 0.1 and clears this floor by 500×.
          const ABS_EST = 2e-4;
          // Relative bounds inherit the eval arm's box conditioning (2.5e-2)
          // and compound two evals per case, so channels get a hair more.
          const REL_LUM = 2.5e-2;
          const REL_CH = 3e-2;
          // ONE-SIDED ZERO FLIPS get their own accounting instead of a rel
          // comparison (rel against an exact zero is always 1.0 and prices
          // nothing): one side sits exactly at a hard gate's OFF value (the
          // emission cone, a slab miss) while the other side's f32 landed a
          // hair inside — boundary-measure float width, amplified by ÷pdf.
          // The defect this arm exists to catch — a MISSING or inverted gate
          // — flips every affected pick, not a boundary sliver, and carries
          // real energy. So flips PASS only as a population: ≤ 2% of cases
          // AND ≤ 0.1% of the total CPU-side energy (§12.26.7's discipline —
          // an energy claim wants an energy statistic).
          const FLIP_LUM = 1e-3;
          let lumBad = 0;
          let chBad = 0;
          let lumWorst = 0;
          let chWorst = 0;
          let worstAt = "";
          let estNonzero = 0;
          let floored = 0;
          let zeroFlips = 0;
          let flipLum = 0;
          let totalLum = 0;
          for (let i = 0; i < CASES.length; i++) {
            const c = CASES[i];
            const view = fixtures[c.fixture].view;
            const cpuE = LT.estimateLightTree(view, c.P, c.N ?? NSUB, GPU.makeGpuRng(c.seed));
            const gpuE = [rawEst[i * 4], rawEst[i * 4 + 1], rawEst[i * 4 + 2]];
            // The case's own noise floor: each sample contributes its raw
            // eval-arm floor AMPLIFIED by its 1/pdf (a fresh rng with the same
            // seed replays the identical picks — the descent arm proved that).
            // The 6 pre-calibration "failures" this closes were uniform ~8.5%
            // scale-downs whose RAW drift (4e-5 on a dim box) sat under the
            // eval arm's own bar; ÷pdf is a multiplier, so the bar must ride
            // along. A real defect still overshoots: order-1 relative error
            // on an order-0.1 value clears any plausible floor by 100×.
            const picks = LT.sampleLightTree(view, c.P, c.N ?? NSUB, GPU.makeGpuRng(c.seed));
            let caseAbs = ABS_EST;
            for (const s of picks) {
              if (!(s.pdf > 0)) continue;
              const se = view.emitter(s.index);
              const sd = Math.hypot(c.P[0] - se.centre[0], c.P[1] - se.centre[1], c.P[2] - se.centre[2]);
              const rawFloor = se.kind === 1 ? Math.max(1e-4, 1.5e-5 * sd) : 1e-5;
              caseAbs += rawFloor / s.pdf;
            }
            if (lum(cpuE) > 1e-5) estNonzero++;
            const la = lum(cpuE);
            const lb = lum(gpuE);
            totalLum += la;
            if ((la === 0 && lb > 0 && lb < FLIP_LUM) || (lb === 0 && la > 0 && la < FLIP_LUM)) {
              zeroFlips++;
              flipLum += Math.max(la, lb);
              continue; // counted above; the rel machinery has nothing to price
            }
            if (Math.abs(la - lb) > caseAbs) {
              const lrel = relErr(la, lb);
              if (lrel > lumWorst) {
                lumWorst = lrel;
                worstAt = `case ${i} (fix ${c.fixture}, seed ${c.seed >>> 0}): cpu [${cpuE.map((v) => v.toPrecision(6)).join(",")}] gpu [${gpuE.map((v) => v.toPrecision(6)).join(",")}]`;
              }
              if (lrel > REL_LUM) lumBad++;
            } else if (Math.abs(la - lb) > 1e-5) floored++;
            for (let k = 0; k < 3; k++) {
              if (Math.abs(cpuE[k] - gpuE[k]) <= caseAbs) continue;
              const rel = relErr(cpuE[k], gpuE[k]);
              if (rel > chWorst) chWorst = rel;
              if (rel > REL_CH) chBad++;
            }
          }
          check("the estimator delivers energy somewhere", estNonzero > CASES.length * 0.1,
            `${estNonzero} of ${CASES.length} cases nonzero`);
          check("estimator luminance agrees with estimateLightTree (rel 2.5e-2, abs floor 2e-4)",
            lumBad === 0,
            `${lumBad} bad, ${floored} under the pdf-aware floor, worst rel ${lumWorst.toExponential(2)}` +
            (lumBad ? `\n     ${worstAt}` : ""));
          check("estimator channels agree (rel 3e-2, abs floor 2e-4)",
            chBad === 0, `${chBad} bad channels, worst rel ${chWorst.toExponential(2)}`);
          check("zero flips are boundary-measure (≤2% of cases, ≤0.1% of energy)",
            zeroFlips <= CASES.length * 0.02 && flipLum <= totalLum * 1e-3,
            `${zeroFlips} flips of ${CASES.length} cases, flip energy ${flipLum.toExponential(2)} of ${totalLum.toExponential(2)} total (${(flipLum / Math.max(totalLum, 1e-12) * 100).toFixed(3)}%)`);
        }

        check("no WebGPU validation errors", validationErrors.length === 0, validationErrors.join(" | "));
        say(`\n${failures ? `gi-lighttree-descent: ${failures} of ${checks} FAILED` : "gi-lighttree-descent: all cases PASS"}`);
        globalThis.__LT_DESCENT_RESULT__ = {
          pass: failures === 0,
          failures,
          checks,
          cases: CASES.length,
          evals: evalCount,
          fixtures: fixtures.length,
          maxPdfRel: main.maxPdfRel,
          text: out.textContent,
        };
      } catch (error) {
        fail(error);
      }
    </script>
  </body>
</html>
