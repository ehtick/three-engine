[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
# `staticlib` is only needed to link into an iOS app. On Windows it produces a
# ~760 MB `tauri_app_lib.lib` archive (and Cargo keeps a second copy under
# `deps/`), so it cost 1.5 GB of build cache for an artifact nothing consumes.
# Re-add it if `tauri ios init` is ever run. `cdylib` (Android) is ~0.4 MB, so
# it stays.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
url = "2"
# Real pseudo-terminals for the in-editor terminal panel: claude and codex are
# full TUI programs and will not run over plain pipes. ConPTY on Windows,
# forkpty elsewhere.
portable-pty = "0.9"
# PTY output is arbitrary bytes that can split a UTF-8 sequence across reads, so
# it crosses to the webview base64-encoded rather than lossily stringified.
base64 = "0.22"
# Zipping an exported web build (the layout itch.io wants). `default-features
# = false` keeps this to deflate — the full feature set drags in bzip2, zstd
# and AES, none of which a game bundle needs.
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
# Watches the open project folder so a file written by anything other than the
# editor — an AI agent's own file tools, a texture painted in another app, a
# script edited in an IDE — shows up without a restart. `default-features =
# false` drops the crossbeam channel we don't use; events cross to the webview
# as Tauri events instead.
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
# LAN browser previews need a secure context for WebGPU. The editor generates
# an ephemeral certificate and terminates TLS itself; localhost stays HTTP.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }

# `tauri dev` rebuilds on every restart even when nothing changed. Keep the
# debug profile lean so the per-restart link cost stays small.
# `incremental` is on by default but stating it explicitly makes the choice
# obvious to anyone tuning this file.
[profile.dev]
incremental = true
opt-level = 0

# Debug info for the dependency tree is what makes `target/debug` enormous
# (~590 MB for the `windows` crate alone). We never step into third-party code,
# so drop it there and keep full symbols for our own crates. This also shortens
# the per-restart link.
[profile.dev.package."*"]
debug = false
